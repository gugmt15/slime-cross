<script>
/* Mudança de endereço: quem abre pelo github.io ou pelo www vai pro slimecross.com levando o que está salvo no navegador
   (tudo que começa com "slime-"), e o slimecross.com importa na chegada sem sobrescrever o que já tiver. */
(function () {
  const NOVO = 'https://slimecross.com/';
  if (location.hostname === 'gugmt15.github.io' || location.hostname === 'www.slimecross.com') {
    const dados = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf('slime-') === 0) dados[k] = localStorage.getItem(k);
      }
    } catch (e) { /* sem armazenamento: vai sem dados */ }
    location.replace(NOVO + (Object.keys(dados).length ? '#importar=' + encodeURIComponent(JSON.stringify(dados)) : ''));
    return;
  }
  const m = location.hash.match(/^#importar=(.+)$/);
  if (!m) return;
  try {
    const dados = JSON.parse(decodeURIComponent(m[1]));
    for (const k in dados) {
      if (k.indexOf('slime-') === 0 && typeof dados[k] === 'string' && localStorage.getItem(k) === null) localStorage.setItem(k, dados[k]);
    }
  } catch (e) { /* dado estragado ou sem armazenamento: segue sem importar */ }
  history.replaceState(null, '', location.pathname + location.search);
})();
</script>

<style>
/* Layout: caderno de laboratório quadriculado; alvo e ameaça no topo, árvore genealógica no meio, barra de anotar e cruzar presa embaixo. */

canvas.sprite.winged { width: auto !important; }

@keyframes tonto { 0% { transform: translate(0, 0) rotate(0); } 45% { transform: translate(6px, -22px) rotate(200deg); } 80% { transform: translate(0, -10px) rotate(360deg); } 100% { transform: translate(0, 0) rotate(360deg); } }

/* parado, o slime sobe e desce suave, achatando embaixo e esticando em cima */
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1.07, 0.93); } 50% { transform: translateY(-3px) scale(0.95, 1.06); } }
@media (prefers-reduced-motion: reduce) { canvas.sprite, .slime.fresh, .slime.fresh.winner, .slime.fresh.winner canvas.sprite, .slime.wilting canvas.sprite { animation: none; } }

.gens { display: flex; flex-direction: column; gap: 18px; }
.gen-row { display: flex; flex-wrap: wrap; gap: 8px; }
.gens .slime { width: 80px; }

.bar {
  position: sticky; bottom: 0; z-index: 2;
  margin-inline: -16px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 2px solid var(--ink);
}
.bar-in { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.pips { display: flex; gap: 4px; flex: none; margin-left: auto; }
.pips.threats { padding-top: 22px; }
/* o quadradinho do cruzamento em que a ameaça chega: borda vermelha e a ameaça em cima, mesmo depois de usado */
.pip { position: relative; }
/* a ameaça chega entre dois cruzamentos: uma parede vermelha no vão, com o bicho em cima */
.pips .wall { width: 3px; height: 14px; background: var(--danger); border-radius: 2px; position: relative; flex: none; }
.pips .wall .m { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); line-height: 0; }
.bar-actions { flex: 1 1 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pip { width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 3px; }
.pip.used { background: var(--ink); }
.msg { font-size: 0.92rem; flex: 1 1 120px; min-width: 0; }
.notebar { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.notebar .nb-title { font-weight: 700; font-size: 0.88rem; }
.gpick { display: flex; align-items: center; gap: 4px; }
.gpick .gname { font-size: 0.75rem; color: var(--muted); margin-right: 2px; }
.gpick .fixed { font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem; padding: 2px 6px; }
.gpick button { font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem; padding: 2px 7px; border-radius: 5px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.gpick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }

.end { margin-bottom: 16px; background: var(--surface); border: 2px solid var(--accent); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.end h3 { font-family: var(--font-display); font-size: 1.4rem; font-weight: 400; margin: 0; }
.num { font-family: "Silkscreen", var(--font-mono); font-weight: 400; letter-spacing: 0; }
.end p { margin: 0; max-width: 65ch; }
.end .path { margin: -4px 0 0; padding-left: 1.6em; display: flex; flex-direction: column; gap: 2px; }
.end .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.stats { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.stat-nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; align-items: center; text-align: center; }
.stat b { font-family: "Silkscreen", var(--font-mono); font-weight: 400; font-size: 1.5rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.75rem; color: var(--muted); }
.dist { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 6px; align-items: center; font-family: var(--font-mono); font-size: 0.8rem; }
.drow { display: contents; }
.dk { text-align: right; color: var(--muted); }
.dbar { background: var(--line); color: var(--ink); padding: 0 6px; border-radius: 3px; text-align: right; font-variant-numeric: tabular-nums; }
.dbar.mine { background: var(--accent); color: var(--accent-ink); }
.stat-title { margin: 0; font-size: 0.85rem; font-weight: 700; }
.btn.share { display: inline-flex; align-items: center; gap: 6px; }
.btn.share .ico { width: 1.15em; height: 1.15em; flex: none; }
.sharebox { width: 100%; font-family: var(--font-mono); font-size: 0.85rem; min-height: 7em; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }

.home { align-items: center; text-align: center; padding-top: 24px; gap: 14px; }
.home-title { font-size: 3rem; }
.home-slime { width: 128px; height: 128px; }
.home-tag { margin: 0; max-width: 34ch; color: var(--muted); }
.home-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 360px; margin-top: 6px; }
.bigbtn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; padding: 14px 16px; border-radius: 10px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.bigbtn small { font-family: var(--font-body); font-size: 0.85rem; font-weight: 400; color: var(--muted); }
.bigbtn.primary { background: var(--accent); border-color: var(--ink); color: var(--accent-ink); }
.bigbtn.primary small { color: var(--accent-ink); opacity: 0.85; }
.bigbtn.ghost { box-shadow: none; border-style: dashed; font-size: 1.1rem; }
.bigbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.badge { position: absolute; top: -2px; right: 12px; font-family: var(--font-body); font-size: 0.72rem; font-weight: 700; background: var(--danger); color: #ffffff; padding: 1px 8px; border-radius: 99px; }
.btn.ghost { border-color: transparent; background: transparent; padding-inline: 4px; }
.gamehead { align-items: center; }
/* os botões de modo ficam numa linha própria, à esquerda, embaixo do título, igual em qualquer largura de tela */
.gamehead .tools { flex: 1 1 100%; }
/* frase que explica o modo difícil, embaixo dos botões, só no desafio do dia */
.modehelp { flex: 1 1 100%; margin: -6px 0 0; font-size: 0.8rem; color: var(--muted); }
/* base 0: o título nunca empurra o idioma e o ? pra linha de baixo (em japonês ele é mais largo) */
.gh-mid { flex: 1 1 0; min-width: 0; }
.gh-title { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1.1; }
.tut { display: flex; flex-direction: column; gap: 16px; padding-bottom: 32px; }
.tut-text { font-size: 1.05rem; margin: 0; max-width: 60ch; }
.tut-step-n { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.tut-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
.tut-card { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tut-card.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tut-card canvas { width: 72px; height: 72px; }
.tut-card .copies { display: flex; gap: 4px; }
.copy { font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem; width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--ink); color: #ffffff; }
.copy.red { background: #d6453d; }
.copy.blue { background: #3f72d8; }
.copy.unk { background: var(--well); color: var(--muted); border-style: dashed; }
.tut-kids .tut-card { animation: hatch 650ms cubic-bezier(0.2, 0.9, 0.3, 1.25) both; }
.tut-x { font-family: var(--font-display); font-size: 1.6rem; }
.tut-say { background: var(--well); border-left: 4px solid var(--accent); border-radius: 6px; padding: 10px 14px; font-size: 1rem; margin: 0; max-width: 60ch; }
.tut-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.copy.horn { background: #efe4c4; color: #1a1c2c; }
.copy.nohorn { background: #b9c4bd; color: #1a1c2c; }
.tut-card .copies + .copies { margin-top: 2px; }
button.tut-card { cursor: pointer; font: inherit; color: var(--ink); }
.tut-card.hit { border-color: var(--accent); background: var(--well); }
.tut-lab { font-weight: 700; font-size: 0.95rem; }
.tut-say.wrong { border-left-color: var(--danger); }
.tut-target { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 1rem; }
.tut-target canvas { width: 48px; height: 48px; }
.tut-badge { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; background: var(--accent); color: var(--accent-ink); padding: 1px 6px; border-radius: 4px; }
.tut-gen { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
.tut-gen-label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.tut-left { font-size: 0.85rem; color: var(--muted); align-self: center; }
.tut-gen .tut-card canvas { width: 56px; height: 56px; }
.mix-grid { display: grid; grid-template-columns: auto repeat(4, minmax(0, 1fr)); gap: 8px 6px; align-items: center; justify-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 10px 8px; }
.mix-lab { justify-self: start; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.mix-grid .copies { display: flex; gap: 3px; }
.mix-grid .copy { width: 22px; height: 22px; font-size: 0.78rem; }
.mix-grid canvas { width: 44px; height: 44px; }
.mix-cell { border-radius: 6px; padding: 2px; }
.mix-num { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; color: var(--muted); }
.tut-say p { margin: 0; }
.tut-say p + p { margin-top: 6px; }
.mix-cell.moved { animation: mixflash 700ms ease-out both; }
.mix-slime { border-radius: 8px; padding: 2px; border: 2px solid transparent; }
.mix-slime.hit { border-color: var(--accent); background: var(--well); }
@keyframes mixflash { from { background: var(--accent); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .mix-cell.moved { animation: none; } }
@keyframes hatch { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .tut-kids .tut-card { animation: none; } }
.pinbar { position: fixed; left: 0; right: 0; top: 0; z-index: 3; background: var(--surface); border-bottom: 2px solid var(--ink); padding: calc(6px + env(safe-area-inset-top, 0px)) 16px 6px; }
.pin-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 700; }
.pin-in canvas { width: 52px; height: 52px; flex: none; }
.pin-label { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; background: var(--accent); color: var(--accent-ink); padding: 1px 6px; border-radius: 4px; }
.langs { position: relative; display: flex; }
.topright { display: flex; gap: 6px; align-items: center; }
.home .langs { align-self: flex-end; }
.lang-btn { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); letter-spacing: 0.04em; }
.lang-btn svg { width: 1.1em; height: 1.1em; flex: none; }
.lang-btn .caret { font-size: 0.7em; color: var(--muted); }
.lang-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; min-width: 190px; display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--surface); border: 2px solid var(--ink); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink); text-align: left; }
.lang-opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); font: inherit; font-size: 0.95rem; cursor: pointer; text-align: left; }
.lang-opt:hover { background: var(--well); }
.lang-opt[aria-checked="true"] { font-weight: 700; }
.lang-opt .tick { color: var(--accent); font-weight: 700; }
footer { font-size: 0.8rem; color: var(--muted); padding-bottom: 16px; max-width: 65ch; }
/* tela Sobre: texto corrido, formulário de sugestão, e o link do X */
.sobre-link { align-self: center; margin-top: 18px; font-size: 0.85rem; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.sobre { display: flex; flex-direction: column; gap: 12px; max-width: 65ch; padding-bottom: 32px; }
.sobre p { margin: 0; }
.sobre-slime { width: 96px; height: 64px; image-rendering: pixelated; align-self: center; }
.sobre-h { font-family: var(--font-display); font-weight: 500; font-size: 1.2rem; margin: 10px 0 0; }
.fb { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.fb label { font-weight: 700; font-size: 0.88rem; }
.fb textarea, .fb input { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
.fb textarea:focus, .fb input:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.fb-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.fb-status { font-size: 0.88rem; color: var(--muted); }
.fb-status.ok { color: var(--accent); font-weight: 700; }
.fb-status.err { color: var(--danger); }
.sobre-x a { color: var(--ink); font-weight: 700; }
.help-btn { min-width: 36px; font-family: var(--font-display); font-size: 1.05rem; padding-inline: 10px; }
.help { border: 2px solid var(--ink); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 16px; width: min(600px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); overflow: auto; box-shadow: 4px 4px 0 var(--ink); }
.help::backdrop { background: rgba(10, 16, 12, 0.55); }
.help-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.help h2 { margin: 0; }
.help-x { font-size: 1.5rem; line-height: 1; padding: 2px 10px; }
.help-list { margin: 10px 0 16px; padding-left: 1.2em; max-width: 65ch; }
.help-list li { margin-bottom: 6px; }
.help-sub { font-family: var(--font-display); font-weight: 500; font-size: 1rem; margin: 0 0 6px; }
.help .rules { margin-bottom: 16px; }
.help .threat-list { list-style: none; padding-left: 0; }
.help .threat-list li { display: flex; gap: 10px; align-items: center; }
.help #threat-help p { margin: 0 0 8px; max-width: 65ch; }
.help-foot { font-size: 0.8rem; color: var(--muted); margin: 16px 0 0; max-width: 65ch; }
/* tela inicial: sequência e relógio do próximo desafio */
.bigbtn small.home-next { font-size: 0.78rem; }
.next-line { text-align: center; color: var(--muted); font-size: 0.9rem; margin: 10px 0 0; }
/* Dias anteriores */
.arch-tabs { display: flex; gap: 8px; }
.arch-note, .modes-note { margin: 0; font-size: 0.85rem; color: var(--muted); }
.arch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.arch-day, .mode-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; border: 2px solid var(--ink); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; box-shadow: 3px 3px 0 var(--ink); }
.arch-day { padding: 10px 6px 8px; }
.arch-day canvas { height: 44px; width: auto; }
.arch-day b, .mode-card b { font-family: var(--font-display); font-weight: 400; }
.arch-day small { font-size: 0.75rem; color: var(--muted); }
.arch-day .st { font-size: 0.78rem; font-weight: 700; min-height: 1.3em; }
.arch-day .st.won { color: var(--accent); }
.arch-day .st.lost { color: var(--danger); }
.arch-day.won { border-color: var(--accent); }
.arch-day:active, .mode-card:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
/* Outros modos em cartões */
.mode-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.mode-card { padding: 12px 10px; gap: 4px; }
.mode-card canvas { height: 56px; width: auto; }
.mode-card b { font-size: 1.05rem; }
.mode-card small { color: var(--muted); font-size: 0.82rem; line-height: 1.3; }
.modes-h { font-family: var(--font-display); font-size: 1rem; margin: 4px 0 -8px; }
.mode-chips { display: flex; flex-direction: column; gap: 8px; }
.mode-chip { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; border: 1.5px dashed var(--ink); border-radius: 8px; background: transparent; color: var(--ink); font: inherit; }
.mode-chip .ico { position: relative; flex: none; width: 40px; display: flex; justify-content: center; }
.mode-chip .ico canvas { height: 32px; width: auto; image-rendering: pixelated; }
.mode-chip .ico i { position: absolute; right: -4px; bottom: -4px; font-style: normal; font-size: 0.7rem; font-weight: 700; background: var(--ink); color: var(--surface); border-radius: 4px; padding: 0 3px; }
.mode-chip .tx { flex: 1; min-width: 0; }
.mode-chip .tx b { display: block; }
.mode-chip .tx small { color: var(--muted); font-size: 0.82rem; line-height: 1.3; display: block; }
.mode-chip .sw { width: 36px; height: 20px; border-radius: 99px; background: var(--line); position: relative; flex: none; }
.mode-chip .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #ffffff; transition: left 0.15s; }
.mode-chip[aria-pressed="true"] { border-style: solid; background: var(--surface); }
.mode-chip[aria-pressed="true"] .sw { background: var(--accent); }
.mode-chip[aria-pressed="true"] .sw::after { left: 18px; }
/* cabeçalho do jogo numa linha só: botões curtos, título pequeno, a frase do modo difícil vai pro "?" */
#view-game .gamehead { flex-wrap: nowrap; align-items: center; gap: 6px; }
#view-game .gamehead .tools { flex: none; order: 2; gap: 6px; flex-wrap: nowrap; }
#view-game .gamehead .topright { order: 3; gap: 6px; }
#view-game .gh-title { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#view-game .sub { margin-top: 2px; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#view-game .gamehead .btn { padding: 5px 9px; font-size: 0.82rem; white-space: nowrap; }
#view-game #btn-home { padding-inline: 4px; font-size: 1.15rem; line-height: 1; }
#view-game #btn-easy, #view-game #btn-reset { min-width: 34px; font-size: 1rem; padding-inline: 6px; }
#view-game .lang-btn svg, #view-game .lang-btn .caret { display: none; }
#view-game .help-btn { min-width: 32px; padding-inline: 8px; }
#view-game .modehelp { display: none; }
.help-mode { margin: 0 0 12px; max-width: 65ch; }
/* lições do roxo e do transparente, na primeira vez */
.lesson-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 10px; font-family: var(--font-display); font-size: 1.1rem; color: var(--muted); }
.lesson-row canvas { height: 48px; width: auto; }
.lesson p { margin: 0 0 10px; max-width: 60ch; }
.lesson h3 { margin: 6px 0 4px; }
[hidden] { display: none !important; }
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
</style>
</head>
<body>

<div class="wrap home" id="view-home">
  <div class="langs"></div>
  <h1 class="home-title" data-i18n="title">Slime Cross</h1>
  <canvas id="home-cv" class="sprite home-slime" width="16" height="16" aria-hidden="true"></canvas>
  <p class="home-tag" data-i18n="home_tag"></p>
  <div class="home-btns">
    <button class="bigbtn primary" id="go-daily" type="button"><span data-i18n="go_daily"></span><small id="daily-status"></small><small class="home-next" id="daily-next" hidden></small></button>
    <button class="bigbtn" id="go-tut" type="button"><span class="badge" id="tut-badge" data-i18n="start_here"></span><span data-i18n="tutorial"></span><small data-i18n="tut_sub"></small></button>
    <button class="bigbtn ghost" id="go-more" type="button"><span data-i18n="more"></span><small data-i18n="more_sub"></small></button>
    <button class="bigbtn ghost" id="go-arch" type="button"><span data-i18n="go_arch"></span><small data-i18n="arch_sub"></small></button>
  </div>
  <button class="btn ghost sobre-link" id="go-sobre" type="button" data-i18n="sobre_link"></button>
</div>

<div class="wrap" id="view-sobre" hidden>
  <header class="gamehead">
    <button class="btn ghost" id="sobre-home" type="button" data-i18n="home_btn"></button>
    <div class="gh-title" data-i18n="sobre_title"></div>
    <div class="langs"></div>
  </header>
  <div class="sobre">
    <canvas id="sobre-cv" class="sprite sobre-slime" width="24" height="16" aria-hidden="true"></canvas>
    <p data-i18n-html="sobre_1"></p>
    <p data-i18n-html="sobre_2"></p>
    <p data-i18n-html="sobre_3"></p>
    <h2 class="sobre-h" data-i18n="sobre_fb_title"></h2>
    <p data-i18n="sobre_fb_sub"></p>
    <form class="fb" id="fb">
      <label for="fb-msg" data-i18n="fb_msg"></label>
      <textarea id="fb-msg" rows="4" maxlength="2000" required></textarea>

es iniciais. Dá para descobrir os genes escondidos só deduzindo.</li><li>O botão <b>Ativar anotações</b> mostra as letras dos genes embaixo de cada slime e permite marcar palpites. <code>V_</code> quer dizer “tem um V, e a outra letra ainda não se sabe”.</li><li>Filhote com <b>borda amarela</b> está a um traço do alvo.</li>","<li>Each slime has <b>two copies</b> of each gene, one from each parent. The <b>dominant</b> one shows; the <b>recessive</b> one stays hidden and can come back in the offspring.</li><li>Tap two slimes and press <b>Cross</b>. You always get 4 offspring, and each trait comes out in the <b>exact ratio</b>: two reds that hide blue give 3 red and 1 blue.</li><li><b>Which traits go together</b> in the same offspring, though, is random, like in nature. So a possible combination may not hatch. The draw is the same for everyone, and the same pair always gives the same litter.</li><li>The offspring join the tree and can be crossed with any slime, <b>even their own parent</b>. You have 8 crosses to hatch the target.</li><li>Every challenge needs <b>at least 3 crosses</b>: the target combines traits from different slimes, and that takes two generations.</li><li>Whatever the target needs always shows up in one of the starting slimes. You can figure out the hidden genes by deduction alone.</li><li><b>Enable notes</b> shows the gene letters under each slime and lets you mark your guesses. <code>V_</code> means “it has a V, and the other letter is still unknown”.</li><li>An offspring with a <b>yellow border</b> is one trait away from the target.</li>","<li>スライムはそれぞれの遺伝子を<b>2つ</b>持っていて、親から1つずつもらいます。<b>顕性</b>のほうが見た目に出て、<b>潜性</b>のほうはかくれたまま、子どもで現れることがあります。</li><li>スライムを2匹タップして<b>交配</b>を押します。子どもはいつも4匹で、それぞれの特徴は<b>ぴったりの割合</b>で生まれます。青をかくした赤どうしなら、赤3匹と青1匹です。</li><li>ただし、<b>どの特徴が同じ子にそろうか</b>は、自然と同じようにランダムです。だから、ありえる組み合わせが生まれないこともあります。結果はみんな同じで、同じペアからはいつも同じ子どもが生まれます。</li><li>子どもは家系図に加わり、どのスライムとも交配できます。<b>自分の親とも</b>交配できます。目標を生み出すまでに使える交配は8回です。</li><li>どのチャレンジも<b>3回以上の交配</b>が必要です。目標はちがうスライムの特徴を組み合わせたもので、2世代かかります。</li><li>目標に必要な特徴は、最初のスライムのどれかに必ず見えています。かくれた遺伝子は推理だけで見つけられます。</li><li><b>メモを使う</b>をオンにすると、スライムの下に遺伝子の文字が出て、予想をメモできます。<code>V_</code>は「Vを1つ持っていて、もう1つはまだわからない」という意味です。</li><li><b>黄色のふち</b>の子どもは、目標まであと特徴1つです。</li>"],"tut_again":["Rever o tutorial","Replay the tutorial","チュートリアルをもう一度"],"tree":["Árvore da família","Family tree","家系図"],"zoom_aria":["Zoom da árvore","Tree zoom","家系図のズーム"],"z_out":["Afastar","Zoom out","縮小"],"z_in":["Aproximar","Zoom in","拡大"],"z_fit":["Ver tudo","Fit","全体"],"footer":["Mendel chegou nessas regras cruzando ervilhas no jardim do mosteiro de Brno, entre 1856 e 1863. A cor intermediária e o gene que esconde outro foram entendidos depois dele, no começo do século 20.","Mendel found these rules by crossing peas in the garden of the abbey in Brno, between 1856 and 1863. Intermediate colors and genes that hide other genes were understood after him, in the early 20th century.","メンデルは1856年から1863年にかけて、ブルノの修道院の庭でエンドウを交配して、この法則を見つけました。中間の色や、ほかの遺伝子をかくす遺伝子がわかったのは、20世紀のはじめになってからです。"],"msg_start":["Toque em dois slimes para cruzar.","Tap two slimes to cross them.","スライムを2匹タップして交配しよう。"],"pips_aria":["Cruzamentos usados","Crosses used","使った交配"],"cross":["Cruzar","Cross","交配"],"cross_ab":["Cruzar {a} × {b}","Cross {a} × {b}","{a} × {b}を交配"],"giveup":["Ver resposta","Show answer","答えを見る"],"giveup_confirm":["Tem certeza? Toque de novo","Sure? Tap again","本当に? もう一度タップ"],"v_classico":["3 genes","3 genes","遺伝子3つ"],"v_roxo":["Roxo","Purple","紫"],"v_transparente":["Transparente","Transparent","透明"],"v_mistura":["Roxo e transparente","Purple and transparent","紫と透明"],"v_option":["{nome} ({n} cruzamentos)","{nome} ({n} crosses)","{nome}(交配{n}回)"],"days":[["domingo","segunda","terça","quarta","quinta","sexta","sábado"],["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],["日曜","月曜","火曜","水曜","木曜","金曜","土曜"]],"g_V":["Cor","Color","色"],"g_C":["Chifre","Horn","角"],"g_E":["Olhos","Eyes","目"],"g_T":["Transp.","Trans Hatching...","誕生中…"],"m_won":["Nasceu o alvo!","The target was born!","目標が生まれた!"],"m_below":[" O resultado está mais abaixo."," The result is further down."," 結果は下にあります。"],"m_pick":["Escolha mais um slime ({x} selecionado).","Pick one more slime ({x} selected).","もう1匹えらんで({x}を選択中)。"],"m_done":["Esse par já foi cruzado, e a ninhada é sempre a mesma. Escolha outro par.","This pair was already crossed, and it always gives the same litter. Pick another pair.","このペアはもう交配済みで、いつも同じ子どもが生まれる。別のペアをえらぼう。"],"m_left":["Restam {n} cruzamentos.","{n} crosses left.","残り{n}回。"],"m_dead":["{x} morreu e não cruza mais.","{x} is gone and can't cross anymore.","{x}はもういないので交配できない。"],"m_tired":["{x} já cruzou {n} vezes e não cruza mais.","{x} already crossed {n} times and can't cross anymore.","{x}はもう{n}回交配したので、これ以上できない。"],"sh_daily":["Slime Cross nº {n} ({nome})","Slime Cross No. {n} ({nome})","スライムクロス 第{n}回({nome})"],"sh_train":["Slime Cross, treino ({nome})","Slime Cross, practice ({nome})","スライムクロス 練習({nome})"],"x_hard":["escondido","hidden","かくれ"],"x_aging":["envelhecer","aging","老化"],"x_threat":["ameaça","threat","天敵"],"x_easy":["anotações","notes","メモ"],"won_pre":["Você conseguiu em ","You did it in ",""],"won_post1":[" cruzamento!"," cross!","回の交配で成功!"],"won_postn":[" cruzamentos!"," crosses!","回の交配で成功!"],"e_min":["Isso é o mínimo possível para este desafio.","That is the minimum for this challenge.","これがこのチャレンジの最少回数です。"],"e_minwas":["O mínimo possível era {n}.","The minimum was {n}.","最少は{n}回でした。"],"e_answer":["Uma resposta possível","A possible answer","答えの一つ"],"e_lost":["Não foi dessa vez","Not this time","今回はざんねん"],"e_example":["O mínimo é {n} cruzamentos, por exemplo:","The minimum is {n} crosses, for example:","最少は{n}回、たとえば:"],"copy":["Compartilhar","Share","シェア"],"copied":["Copiado","Copied","コピーしました"],"selected":["Selecionado, é só copiar","Selected, just copy it","選択したのでコピーしてね"],"hide_genes":["Esconder genes","Hide genes","遺伝子をかくす"],"show_genes":["Mostrar genes","Show genes","遺伝子を見る"],"another":["Outro desafio","Another challenge","別のチャレンジ"],"share_aria":["Resultado para compartilhar","Result to share","シェア用の結果"],"h_won":["nº {n} · resolvido em {m} ✓","No. {n} · solved in {m} ✓","第{n}回・{m}回で成功 ✓"],"h_lost":["nº {n} · não foi dessa vez","No. {n} · not this time","第{n}回・ざんねん"],"h_going":["nº {n} · em andamento","No. {n} · in progress","第{n}回・挑戦中"],"h_new":["nº {n} · até 8 cruzamentos","No. {n} · up to 8 crosses","第{n}回・交配は8回まで"],"step":["Passo {n} de {m}","Step {n} of {m}","ステップ {n}/{m}"],"next":["Próximo","Next","次へ"],"yes_hides":["Sim, esconde azul","Yes, it hides blue","はい、青をかくしている"],"no_hides":["Não esconde","No, it doesn't","いいえ、かくしていない"],"right":["Isso! ","Right! ","正解! "],"wrong":["Não é bem assim. ","Not quite. ","ちょっとちがう。"],"tut_done":["Pronto! No desafio do dia o alvo tem três traços (cor, chifre e olhos) e você tem 8 cruzamentos para fazer ele nascer. Se precisar de ajuda, toque em Ativar anotações: aparecem as letras dos genes embaixo de cada slime.","That's it! In the daily challenge the target has three traits (color, horn and eyes), and you have 8 crosses to hatch it. If you need help, tap Enable notes: it shows the gene letters under each slime.","これで準備完了! 今日のチャレンジでは目標に3つの特徴(色・角・目)があり、8回の交配で生み出します。困ったら「メモを使う」をオンにすると、スライムの下に遺伝子の文字が出ます。"],"play_daily":["Jogar o desafio do dia","Play the daily challenge","今日のチャレンジをあそぶ"],"back_home":["Voltar ao início","Back to home","ホームにもどる"],"t1_text":["Todo slime tem duas cópias do gene da cor: uma veio do pai e a outra da mãe. Este vermelho tem duas cópias vermelhas. Este azul tem duas cópias azuis. O que será que vai nascer se cruzar os dois?","Every slime has two copies of the color gene: one from each parent. This red one has two red copies. This blue one has two blue copies. What do you think will hatch if you cross them?","スライムは色の遺伝子を2つ持っていて、親から1つずつもらいます。この赤いスライムは赤を2つ、この青いスライムは青を2つ持っています。この2匹を交配すると、何が生まれるかな?"],"t1_say":["Os quatro nasceram vermelhos! Cada filhote pegou uma cópia de cada pai: uma vermelha e uma azul. Vermelho é dominante e azul é recessivo, então o azul ficou escondido dentro deles.","All four came out red! Each one got a copy from each parent: one red and one blue. Red is dominant and blue is recessive, so the blue stayed hidden inside them.","4匹とも赤で生まれた! どの子も親から1つずつ、赤と青をもらいました。赤が顕性で青が潜性なので、青は中にかくれています。"],"tp_text":["Também dá para cruzar um filhote com o próprio pai ou mãe. Cruze um desses filhotes vermelhos com o pai azul.","You can also cross an offspring with its own father or mother. Cross one of those red offspring with the blue parent.","子どもを自分の親と交配することもできます。赤い子どもの1匹を、青い親と交配しよう。"],"tp_say":["Metade saiu azul! O filhote deu a cópia azul que escondia, e o pai azul deu outra. Dá para cruzar qualquer par da árvore, até filho com pai ou mãe, e às vezes esse é o caminho mais curto até o alvo.","Half came out blue! The offspring gave the blue copy it was hiding, and the blue parent gave another. You can cross any pair in the tree, even a child with its parent, and sometimes that is the shortest way to the target.","半分が青になった! 子どもがかくしていた青を1つ、青い親がもう1つわたしたんだ。家系図のどのペアでも交配できて、親子どうしでもOK。それが目標へのいちばんの近道になることもある。"],"tm_text":["Destes pais pode nascer um azul sem chifre, mas o jogo não garante isso. Cada coluna é um filhote. A cor e o chifre são distribuídos separados, cada um numa ordem sorteada.","These parents can have a blue hornless offspring, but the game doesn't guarantee it. Each column is one offspring. Color and horn are handed out separately, each in a random order.","この親からは青で角なしの子が生まれることもありますが、ゲームはそれを約束しません。1列が子ども1匹です。色と角は別々に、それぞれランダムな順番で配られます。"],"tm_shuffle":["Trocar os chifres de lugar","Swap the horns around","角を入れかえる"],"tm_same":["O jogo garante a proporção de cada traço: sempre nasce 1 azul e sempre nasce 1 sem chifre. Não garante que sejam o mesmo filhote.","The game guarantees the ratio of each trait: there is always 1 blue and always 1 hornless. It doesn't guarantee they are the same offspring.","ゲームが約束するのは特徴ごとの割合です。青は必ず1匹、角なしも必ず1匹生まれます。でも、同じ子とはかぎりません。"],"tm_yes":["Aqui eles caíram juntos: nasceu um azul sem chifre.","Here they landed together: a blue hornless one hatched.","今回は同じ子にそろったので、青で角なしが生まれた。"],"tm_no":["Aqui eles caíram em filhotes diferentes: o azul sem chifre não nasceu, mesmo sendo possível.","Here they landed on different offspring: no blue hornless one hatched, even though it was possible.","今回は別々の子に分かれたので、青で角なしは生まれなかった。ありえる組み合わせなのに。"],"tm_fixed":["Por isso os 4 filhotes nem sempre mostram todas as combinações possíveis. No jogo, essa ordem é sorteada uma vez por par e é igual para todo mundo.","That's why the 4 offspring don't always show every possible combination. In the game, this order is drawn once for each pair and is the same for everyone.","だから、4匹の子どもがありえる組み合わせを全部見せるとはかぎりません。ゲームでは、この順番はペアごとに1回だけ決まり、みんな同じです。"],"t2_text":["Agora cruze dois desses filhotes. Por fora são vermelhos, mas cada um esconde uma cópia azul.","Now cross two of these offspring. They look red, but each one hides a blue copy.","次はこの子どもを2匹交配しよう。見た目は赤でも、どちらも青を1つかくしています。"],"t2_say":["Nasceu um azul! Ele pegou a cópia azul escondida de cada pai. Um traço pode sumir numa geração e voltar na seguinte. Foi isso que o Mendel viu cruzando ervilhas.","A blue one hatched! It got the hidden blue copy from each parent. A trait can vanish in one generation and come back in the next. That is what Mendel saw crossing peas.","青が生まれた! 両方の親から、かくれていた青を1つずつもらったんだ。特徴はある世代で消えて、次の世代でもどってくることがある。メンデルがエンドウの交配で見たのはこれです。"],"t3_text":["Sua vez. No jogo não dá para ver as cópias, só a aparência. Este vermelho cruzou com um azul e teve estes quatro filhotes. Ele esconde azul?","Your turn. In the game you can't see the copies, only the looks. This red one was crossed with a blue one and had these four offspring. Does it hide blue?","きみの番。ゲームでは遺伝子は見えず、見た目しかわかりません。この赤いスライムを青と交配したら、この4匹が生まれました。この赤は青をかくしている?"],"t3_explain":["Nasceram filhotes azuis, e azul precisa de duas cópias azuis. Uma veio do pai azul; a outra só pode ter vindo do vermelho. Então ele esconde azul.","Blue offspring hatched, and blue needs two blue copies. One came from the blue parent; the other can only have come from the red one. So it hides blue.","青い子どもが生まれた。青になるには青が2つ必要です。1つは青い親から、もう1つは赤い親からとしか考えられない。だから赤は青をかくしています。"],"t4_text":["E este outro vermelho? Também cruzou com um azul. Ele esconde azul?","And this other red one? It was also crossed with a blue one. Does it hide blue?","こちらの赤いスライムは? これも青と交配しました。青をかくしている?"],"t4_explain":["Se ele escondesse azul, metade dos filhotes sairia azul, como no exemplo anterior. Nasceram quatro vermelhos, então ele tem duas cópias vermelhas e não esconde nada.","If it hid blue, half the offspring would come out blue, like in the last example. All four are red, so it has two red copies and hides nothing.","もし青をかくしていたら、さっきの例のように半分が青になるはず。4匹とも赤なので、赤を2つ持っていて、何もかくしていません。"],"t5_text":["Cada gene é herdado separado. Este é azul com chifre; este é vermelho sem chifre. O que será que vai nascer?","Each gene is inherited separately. This one is blue and horned; this one is red with no horn. What do you think will hatch?","遺伝子はそれぞれ別々に受けつがれます。こちらは青で角あり、こちらは赤で角なし。何が生まれるかな?"],"t5_say":["Todos vermelhos e com chifre, porque vermelho e com chifre são dominantes. Mas cada filhote esconde um azul e um sem chifre.","All red and horned, because red and horned are dominant. But each one hides a blue and a hornless copy.","みんな赤で角あり。赤と角ありが顕性だからです。でも、どの子も青と角なしをかくしています。"],"t6_text":["Agora cruze dois desses filhotes.","Now cross two of these offspring.","次はこの子どもを2匹交配しよう。"],"t6_say":["Nasceu um azul sem chifre, e nenhum dos avós era assim: um era azul com chifre, o outro vermelho sem chifre. Como cada gene vem separado, dá para juntar o azul de um lado com o sem chifre do outro. É assim que você monta o alvo no jogo.","A blue, hornless one hatched, and neither grandparent looked like that: one was blue and horned, the other red with no horn. Since each gene comes separately, you can combine the blue from one side with the hornless from the other. That's how you build the target in the game.","青で角なしが生まれた。祖父母にはこんなスライムはいなかった。片方は青で角あり、もう片方は赤で角なし。遺伝子は別々に受けつがれるので、片方の青ともう片方の角なしを組み合わせられる。ゲームではこうやって目標を作ります。"],"lang_pt":["Português (Brasil)","Português (Brasil)","Português (Brasil)"],"lang_en":["English (US)","English (US)","English (US)"],"lang_ja":["日本語","日本語","日本語"],"lang_aria":["Idioma","Language","言語"],"sub_default":["desafio de genética","genetics challenge","遺伝のチャレンジ"],"e_min_path":["O mínimo é {n} cruzamentos:","The minimum is {n} crosses:","最少は{n}回:"],"e_others":["Pode haver outros caminhos.","There may be other ways.","ほかの方法もあるかもしれない。"],"close":["Fechar","Close","閉じる"],"kid_step":["filhote do {n}","offspring from {n}","{n}の子"],"kids_step":["dois filhotes do {n}","two offspring from {n}","{n}の子どうし"],"see_short":["Ver o caminho mais curto","See the shortest path","最短ルートを見る"],"e_short":["O caminho mais curto","The shortest path","最短ルート"],"e_short_p":["São {n} cruzamentos. Você usou {m}.","It takes {n} crosses. You used {m}.","交配{n}回で届きます。あなたは{m}回でした。"],"back_mine":["Voltar pro meu jogo","Back to my game","自分のゲームにもどる"],"v_asasdif":["4 genes","4 genes","遺伝子4つ"],"v_dois":["2 genes","2 genes","遺伝子2つ"],"hard_btn":["Modo difícil","Hard mode","ハードモード"],"hard_locked":["O modo difícil só pode ser trocado antes do primeiro cruzamento do dia.","Hard mode can only be switched before the first cross of the day.","ハードモードは、その日の最初の交配の前にだけ切りかえられます。"],"v_hard":["difícil","hard","ハード"],"hit_olhos":["O gavião atacou!","The hawk attacked!","タカがおそってきた!"],"hit_chifre":["O urso atacou!","The bear attacked!","クマがおそってきた!"],"hit_azul":["O sol esquentou!","The sun blazed!","日差しが強くなった!"],"hit_asas":["A ventania chegou!","A gale blew in!","強風がふいてきた!"],"gone_wind":["levado","blown away","とばされた"],"hard_help":["Modo difícil: 4 genes com asa, e duas ameaças durante a partida.","Hard mode: 4 genes with wings, and two threats during the game.","ハードモード:翼つきの遺伝子4つ、そして途中で天敵が2回おそってくる。"],"threat_help":["Depois do {n} cruzamento, morrem todos os slimes que mostram o traço marcado. Quem só esconde o traço escapa. A parede vermelha entre os quadradinhos, embaixo, mostra quando.","After cross {n}, every slime showing the marked trait dies. Those that only hide the trait survive. The red wall between the boxes at the bottom shows when.","{n}回目の交配のあと、印のついた特徴を見せているスライムは全部やられる。特徴をかくしているだけのスライムは助かる。下のマスの間の赤いしきりがタイミングを示す。"],"and":[" e "," and ","と"],"nth":["{n}º","{n}","{n}回目"],"kill_olhos":["mata os de um olho","kills the one-eyed","目が1つは全滅"],"kill_chifre":["mata os sem chifre","kills the hornless","角なしは全滅"],"kill_azul":["mata os azuis","kills the blue ones","青は全滅"],"kill_asas":["mata os de asa","kills the winged","翼ありは全滅"],"sobre_link":["Sobre o jogo e sugestões","About the game and suggestions","このゲームについて・ご意見"],"sobre_title":["Sobre","About","このゲームについて"],"sobre_1":["O Slime Cross é um quebra-cabeça diário de genética. Você recebe três slimes com genes escondidos e um alvo, e precisa cruzar os slimes certos até o alvo nascer. Todo mundo recebe o mesmo desafio no mesmo dia.","Slime Cross is a daily genetics puzzle. You get three slimes with hidden genes and a target, and you have to cross the right slimes until the target is born. Everyone gets the same challenge on the same day.","スライムクロスは、遺伝をテーマにした毎日のパズルです。遺伝子がかくれた3匹のスライムと目標が与えられ、正しいスライムを交配して目標を生み出します。同じ日には、みんな同じ問題に挑戦します。"],"sobre_2":["As regras são as que <b>Gregor Mendel</b> encontrou cruzando ervilhas no jardim do mosteiro de Brno, entre 1856 e 1863: cada traço vem em duas cópias, uma de cada pai; a dominante aparece e a recessiva fica escondida, podendo voltar nos filhos. A cor intermediária (o roxo) e o gene que esconde outro (o transparente) foram entendidos depois dele, no começo do século 20. Jogando, você acaba fazendo o que Mendel fazia: deduzir o que cada um esconde a partir do que nasce.","The rules are the ones <b>Gregor Mendel</b> found by crossing peas in the garden of the abbey in Brno, between 1856 and 1 let LANG = 'pt';
function tr(key, v) {
  const e = I18N[key];
  let s = e ? e[LANGS.indexOf(LANG)] : key;
  if (typeof s !== 'string') return s;
  v = v || {};
  return s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)).replace(/\{\{/g, '{').replace(/\}\}/g, '}');
}
function vname(V) { return tr('v_' + V.id); }
const LANG_CODE = { pt: 'PT', en: 'EN', ja: 'JA' };
const GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>';
function closeLangMenus() {
  document.querySelectorAll('.lang-menu').forEach(m => { m.hidden = true; });
  document.querySelectorAll('.lang-btn').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
/* Um botão só (globo + sigla do idioma atual) que abre a lista com o nome de cada idioma escrito nele mesmo. */
function renderLangButtons() {
  document.querySelectorAll('.langs').forEach(box => {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn lang-btn';
    btn.innerHTML = GLOBE;
    const code = document.createElement('span'); code.textContent = LANG_CODE[LANG];
    const caret = document.createElement('span'); caret.className = 'caret'; caret.textContent = '▾'; caret.setAttribute('aria-hidden', 'true');
    btn.append(code, caret);
    btn.setAttribute('aria-label', tr('lang_aria') + ': ' + tr('lang_' + LANG));
    btn.setAttribute('aria-haspopup', 'true'); btn.setAttribute('aria-expanded', 'false');
    const menu = document.createElement('div'); menu.className = 'lang-menu'; menu.hidden = true;
    menu.setAttribute('role', 'menu'); menu.setAttribute('aria-label', tr('lang_aria'));
    LANGS.forEach(l => {
      const o = document.createElement('button'); o.type = 'button'; o.className = 'lang-opt';
      o.setAttribute('role', 'menuitemradio'); o.setAttribute('aria-checked', l === LANG ? 'true' : 'false');
      const name = document.createElement('span'); name.textContent = I18N['lang_' + l][LANGS.indexOf(l)];
      o.append(name);
      if (l === LANG) { const t = document.createElement('span'); t.className = 'tick'; t.textContent = '✓'; t.setAttribute('aria-hidden', 'true'); o.append(t); }
      o.addEventListener('click', () => { closeLangMenus(); setLang(l); });
      menu.append(o);
    });
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const open = menu.hidden;
      closeLangMenus();
      menu.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) { /* abre pro lado que tem espaço: a lista não pode sair da tela */
        menu.style.left = 'auto'; menu.style.right = '0';
        if (menu.getBoundingClientRect().left < 8) { menu.style.right = 'auto'; menu.style.left = '0'; }
      }
      if (open) { const cur = menu.querySelector('[aria-checked="true"]'); if (cur) cur.focus(); }
    });
    box.replaceChildren(btn, menu);
  });
}
document.addEventListener('click', e => { if (!e.target.closest('.langs')) closeLangMenus(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLangMenus(); });
function applyStatic() {
  document.documentElement.lang = { pt: 'pt-BR', en: 'en-US', ja: 'ja' }[LANG];
  document.title = tr('title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = tr(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = tr(e.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', tr(e.dataset.i18nAria)); });
  renderLangButtons();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem('slime-lang', l); } catch (e) { /* sem armazenamento */ }
  applyStatic();
  if (typeof fillVariantSelect === 'function') fillVariantSelect();
  if (!$('view-home').hidden) renderHome();
  if (!$('view-tut').hidden) renderTut();
  if (!$('view-arch').hidden) renderArch();
  if (!$('view-modes').hidden) renderModes();
  if (G && !$('view-game').hidden) render();
}
function initLang() {
  let l = null;
  try { l = localStorage.getItem('slime-lang'); } catch (e) { /* sem armazenamento */ }
  if (!LANGS.includes(l)) {
    const n = (navigator.language || 'pt').toLowerCase();
    l = n.startsWith('pt') ? 'pt' : n.startsWith('ja') ? 'ja' : 'en';
  }
  LANG = l;
  applyStatic();
}

/* modo difícil do desafio do dia: os 4 genes com asa, com lista própria */

/* Cada ameaça tem uma presa fixa, e a presa é sempre um traço recessivo: gavião leva os de um olho,
   lobo come os sem chifre, o sol derrete os azuis, a ventania leva os de asa. Quem só esconde o traço escapa. */
const EVENTS = [

]

/* Painel de regras: cada uma mostra o slime dominante e o recessivo, desenhados. {xx} marca código de gene. */
const BASE_P = { cor: 'vermelho', chifre: false, olhos: 2 };
function rulesOf(V) {
  const r = [];
  const c = x => tr('c_' + x);
  if (V.inc) {
    r.push({ t: tr('r_color'), mix: true, figs: [[{ cor: 'vermelho' }, c('vermelho'), 'VV'], [{ cor: 'roxo' }, c('roxo'), 'Vv'], [{ cor: 'azul' }, c('azul'), 'vv']], s: tr('rn_mix'), novo: true });
  } else {
    r.push({ t: tr('r_color'), dom: [{ cor: 'vermelho' }, c('vermelho'), 'V'], rec: [{ cor: 'azul' }, c('azul'), 'v'], s: tr('rn_color') });
  }
  r.push({ t: tr('r_horn'), dom: [{ chifre: true }, tr('horn_y'), 'C'], rec: [{ chifre: false }, tr('horn_n'), 'c'], s: tr('rn_horn') });
  if (!V.two) r.push({ t: tr('r_eyes'), dom: [{ olhos: 2 }, tr('eyes_2'), 'E'], rec: [{ olhos: 1 }, tr('eyes_1'), 'e'], s: tr('rn_eyes') });
  if (V.trans) r.push({ t: tr('r_trans'), dom: [{}, tr('normal'), 'T'], rec: [{ cor: 'transparente' }, c('transparente'), 't'], s: tr('rn_trans'), novo: true });
  if (V.wings) r.push({ t: tr('r_wings'), dom: [{ asas: false }, tr('wing_n'), 'A'], rec: [{ asas: true }, tr('wing_y'), 'a'], s: tr('rn_wings'), novo: true });
  return r;
}
function miniFig(spec, role) {
  const [over, label, code] = spec;
  const f = document.createElement('figure'); f.className = 'mini';
  const cv = sprite(Object.assign({}, BASE_P, over)); f.append(cv);
  const cap = document.createElement('figcaption'); cap.append(label + ' ', geneTag(code)); f.append(cap);
  if (role) { const r = document.createElement('span'); r.className = 'role ' + role; r.textContent = role === 'dom' ? tr('dom') : tr('rec'); f.append(r); }
  return f;
}
function renderRules(V) {
  return rulesOf(V).map(r => {
    const e = document.createElement('div'); e.className = 'winrow' + (r.novo ? ' new' : '');
    const t = document.createElement('div'); t.className = 'wr-title'; t.textContent = r.t;
    const pair = document.createElement('div'); pair.className = 'wr-pair' + (r.mix ? ' mix' : '');
    if (r.mix) {
      r.figs.forEach(fg => pair.append(miniFig(fg)));

      pair.append(miniFig(r.dom, 'dom'), miniFig(r.rec, 'rec'));
    }
    const d = document.createElement('p'); d.className = 'wr-note'; d.append(...withTags(r.s));
    e.append(t, pair, d);
    return e;
  });
}
function geneTag(txt) { const e = document.createElement('span'); e.className = 'gene'; e.textContent = txt; return e; }
function withTags(text) {
  return text.split(/(\{[^}]+\})/).filter(Boolean).map(part => (part[0] === '{' ? geneTag(part.slice(1, -1)) : part));
}

/* ---------- lógica: genética, ninhadas, ameaça, gerador e solucionador ---------- */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h;
}
function rngFrom(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle4(rng) {
  const p = [0, 1, 2, 3];
  for (let i = 3; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  return p;
}

function reg(P, c) { c.p = phenOf(P.V, c.g); P.reg.set(c.id, c); return c; }

function phenOf(V, g) {
  const has = i => (g[i][0] | g[i][1]);
  let cor = V.inc ? ['azul', 'roxo', 'vermelho'][g[0][0] + g[0][1]] : (has(0) ? 'vermelho' : 'azul');
  if (V.trans && !has(V.genes.indexOf('T'))) cor = 'transparente';
  const p = { cor, chifre: !!has(1), olhos: V.two || has(2) ? 2 : 1 };
  if (V.wings) p.asas = !has(V.genes.indexOf('A'));
  return p;
}
function hits(V, p, t) { let n = 0; V.keys.forEach(k => { if (p[k] === t[k]) n++; }); return n; }
function match(V, p, t) { return hits(V, p, t) === V.keys.length; }
function killedBy(E, p) { return !!E && p[E.k] === E.v; }
function pairKey(a, b) { return a.id < b.id ? a.id + '|' + b.id : b.id + '|' + a.id; }

function litter(P, a, b) {
  const [x, y] = a.id < b.id ? [a, b] : [b, a];
  const mk = x.id + '|' + y.id;
  if (P.lit.has(mk)) return P.lit.get(mk);
  const n = P.V.genes.length;
  const kids = [0, 1, 2, 3].map(k => ({ id: '(' + x.id + 'x' + y.id + ')' + k, g: [], parents: [x.id, y.id], idx: k }));
  for (let i = 0; i < n; i++) {
    const pun = [
      [x.g[i][0], y.g[i][0]], [x.g[i][0], y.g[i][1]],
      [x.g[i][1], y.g[i][0]], [x.g[i][1], y.g[i][1]],
    ];
    const perm = shuffle4(rngFrom(hashStr(P.key + '|' + mk + '|' + i)));
    for (let k = 0; k < 4; k++) kids[k].g[i] = pun[perm[k]].slice();
  }
  kids.forEach(k => reg(P, k));
  P.lit.set(mk, kids);
  return kids;
}

/* Busca o menor número de cruzamentos, respeitando o limite de uso e a ameaça. */
function solve(P, maxD) {
  const V = P.V;
  function dfs(pop, uses, done, made, d) {
    for (let i = 0; i < pop.length; i++) {
      const a = pop[i];
      if (P.mods.aging && (uses[a.id] || 0) >= AGE_LIMIT) continue;
      for (let j = i + 1; j < pop.length; j++) {
        const b = pop[j];
        if (P.mods.aging && (uses[b.id] || 0) >= AGE_LIMIT) continue;
        const pk = pairKey(a, b);
        if (done.includes(pk)) continue;
        const kids = litter(P, a, b);
        if (kids.some(k => match(V, k.p, P.target))) return [[a.id, b.id]];
        if (d > 1) {
          const nu = Object.assign({}, uses);
          nu[a.id] = (nu[a.id] || 0) + 1; nu[b.id] = (nu[b.id] || 0) + 1;
          let np = pop.concat(kids);
          P.Es.forEach(x => { if (made + 1 === x.at) np = np.filter(c => !killedBy(x.E, c.p)); });
          const r = dfs(np, nu, done.concat(pk), made + 1, d - 1);
          if (r) return [[a.id, b.id]].concat(r);
        }
      }
    }
    return null;
  }
  for (let d = 1; d <= maxD; d++) {
    const r = dfs(P.starters.slice(), {}, [], 0, d);
    if (r) return { depth: d, path: r };
  }
  return null;
}

function interesting(V, t) {
  return t.cor !== 'vermelho' || !t.chifre || t.olhos === 1 || (V.wings && t.asas);
}

/* Modo justo: toda letra que o alvo precisa já aparece à vista em algum slime inicial,
   então dá pra achar o gene por dedução, sem cruzar no escuro atrás de um portador escondido. */
function knownLetters(pub) { return pub.split('').filter(ch => ch !== '_'); }
function fairStart(V, starters, target) {
  return V.genes.every((_, i) => {
    const need = [...new Set(knownLetters(pubGeno(V, target, i)))];
    return need.every(a => starters.some(s => knownLetters(pubGeno(V, s.p, i)).includes(a)));
  });
}

function makePuzzle(V, seedStr, mods) {
  const n = V.genes.length;
  const valid = EVENTS.filter(e => (!e.wings || V.wings) && (e.k !== 'olhos' || !V.two));
  for (let attempt = 0; attempt < 30000; attempt++) {
    const key = V.id + (mods.aging ? '+idade' : '') + (mods.threat ? '+ameaca' : '') + (mods.hard ? '+dificil' : '') + ':' + seedStr + '#' + attempt;
    const rng = rngFrom(hashStr(key));
    const gen = () => Array.from({ length: n }, () => [rng() < 0.55 ? 1 : 0, rng() < 0.55 ? 1 : 0]);
    const P = { V, key, mods, reg: new Map(), lit: new Map(), Es: [] };
    P.starters = ['A', 'B', 'C'].map(id => reg(P, { id, parents: null, g: gen() }));
    P.target = phenOf(V, gen());
    if (!interesting(V, P.target)) continue;
    if (P.starters.some(s => match(V, s.p, P.target))) continue;
    if (!mods.hard && !fairStart(V, P.starters, P.target)) continue;
    /* Todo treino: o slime inicial mais parecido com o alvo tem que errar pelo menos 2 traços. Com 1 só,
       o alvo ficava a um passo de um inicial e o desafio saía fácil. */
    if (V.keys.length - Math.max(...P.starters.map(c => hits(V, c.p, P.target))) < (V.two ? 1 : 2)) continue;
    /* Quatro genes: a asa tem que dar trabalho. O alvo pede asa (o recessivo) e ela está num slime inicial
       diferente do que já tem a maior parte dos outros traços; sem isso, a asa vinha de graça e o modo ficava fácil. */
    if (V.wings) {
      if (!P.target.asas) continue;
      const score = c => V.keys.filter(k => k !== 'asas' && c.p[k] === P.target[k]).length;
      const top = Math.max(...P.starters.map(score));
      if (P.starters.some(c => score(c) === top && c.p.asas)) continue;
    }
    if (mods.threat) {
      /* a ameaça sempre ataca uma aparência que o alvo tem: pra chegar nele, é preciso guardar quem só esconde o traço */
      const onTarget = valid.filter(e => P.target[e.k] === e.v);
      if (!onTarget.length) continue;
      P.Es = [{ E: onTarget[Math.floor(rng() * onTarget.length)], at: EVENT_AT }];
    }
    const res = solve(P, 3);
    if (res && res.depth >= MIN_PAR) { P.par = res.depth; P.path = res.path; return P; }
  }
  return null;
}

/* Asa de penas, saindo do lado do corpo (em cima da cabeça ela parecia orelha). O slime alado é desenhado
   com 24 de largura e o corpo 4 px pra dentro; a asa é a metade esquerda, espelhada, desenhada antes do corpo.
   Dois quadros, aberta e batendo. */
const WING_W = 24, WING_OX = 4;
const WING = [[
  '........', '........', '........', '........', '........',
  '....KK..', '..KKFFK.', '.KFFFFFK', 'KFFFFFf.', 'KFfFfF..',
  '.KFKFK..', '..K.K...', '........', '........', '........', '........',
], [
  '........', '........', '........', '........', '........',
  '........', '...KKK..', '.KKFFFK.', 'KFFFFFf.', 'KFfFfF..',
  '.KFKFK..', '..K.K...', '........', '........', '........', '........',
], [
  '........', '........', '........', '........', '........',
  '........', '........', '...KKK..', '.KKFFFK.', 'KFFFFFf.',
  'KFfFfFK.', '.KFKFK..', '..K.K...', '........', '........', '........',
]];
const WING_PX = { K: '#1a1c2c', F: '#eef3ff', f: '#b7c3df' };

const WING_SEQ = [0, 1, 2, 1];
let wingFrame = 0;
/* lágrima escorrendo: desce um pixel e volta */

function drawSlime(cv, p) {
  const w = p.asas ? WING_W : 16, ox = p.asas ? WING_OX : 0;
  if (cv.width !== w) cv.width = w;
  cv.height = 16;
  cv.classList.toggle('winged', !!p.asas);
  cv.classList.toggle('crying', !!p.sad);
  cv._sad = p.sad ? p : null;
  /* morto não bate asa: fica com a asa fechada, caída, e sai da lista da batida */
  cv._p = p.asas && !p.morto ? p : null;
  const x = cv.getContext('2d');
  x.clearRect(0, 0, w, 16);
  const body = BODY[p.cor];
  if (p.asas) WING[p.morto ? 2 : WING_SEQ[wingFrame]].forEach((row, Y) => {
    for (let X = 0; X < 8; X++) {
      const ch = row[X];
      if (ch === '.') continue;
      x.fillStyle = WING_PX[ch]; x.fillRect(X, Y, 1, 1); x.fillRect(w - 1 - X, Y, 1, 1);
    }
  });
  const put = (c, X, Y) => { x.fillStyle = c; x.fillRect(X + ox, Y, 1, 1); };
  BASE.forEach((row, Y) => {
    for (let X = 0; X < 16; X++) {
      const ch = row[X];
      if (ch === 'L') put(body[0], X, Y);
      else if (ch === 'l') put(body[1], X, Y);
      else if (ch === 'K' || ch === 'w') put(PX[ch], X, Y);
    }
  });
  if (p.sad) {
    if (p.olhos === 2) {
      [[5, 9], [5, 10], [10, 9], [10, 10], [6, 8], [9, 8]].forEach(([X, Y]) => put(PX.K, X, Y));
      [[4, 11 + tearFrame], [4, 12 + tearFrame]].forEach(([X, Y]) => put('#9fd8ff', X, Y));
    } else {
      for (let X = 6; X <= 9; X++) for (let Y = 8; Y <= 10; Y++) put(PX.w, X, Y);
      [[7, 10], [8, 10]].forEach(([X, Y]) => put(PX.K, X, Y));
      [[6, 7], [7, 6], [8, 6], [9, 7]].forEach(([X, Y]) => put(PX.K, X, Y));
      [[11, 10 + tearFrame], [11, 11 + tearFrame]].forEach(([X, Y]) => put('#9fd8ff', X, Y));
    }
    [[6, 12], [7, 11], [8, 11], [9, 12]].forEach(([X, Y]) => put(PX.K, X, Y));
  } else if (p.morto) {
    if (p.olhos === 2) [[4, 8], [6, 8], [5, 9], [4, 10], [6, 10], [9, 8], [11, 8], [10, 9], [9, 10], [11, 10]].forEach(([X, Y]) => put(PX.K, X, Y));
    else [[6, 7], [9, 7], [7, 8], [8, 8], [7, 9], [8, 9], [6, 10], [9, 10]].forEach(([X, Y]) => put(PX.K, X, Y));
  } else if (p.surpreso) {
    if (p.olhos === 2) [[5, 8], [5, 9], [5, 10], [10, 8], [10, 9], [10, 10]].forEach(([X, Y]) => put(PX.K, X, Y));
    else {
      for (let X = 6; X <= 9; X++) for (let Y = 7; Y <= 10; Y++) put(PX.w, X, Y);
      [[7, 8], [8, 8], [7, 9], [8, 9]].forEach(([X, Y]) => put(PX.K, X, Y));
    }
    [[7, 12], [8, 12], [7, 13], [8, 13]].forEach(([X, Y]) => put(PX.K, X, Y));
  } else if (p.happy) {
    if (p.olhos === 2) [[4, 9], [5, 8], [6, 9], [9, 9], [10, 8], [11, 9]].forEach(([X, Y]) => put(PX.K, X, Y));
    else [[5, 9], [6, 8], [7, 7], [8, 7], [9, 8], [10, 9]].forEach(([X, Y]) => put(PX.K, X, Y));
    [[6, 11], [7, 12], [8, 12], [9, 11]].forEach(([X, Y]) => put(PX.K, X, Y));
  } else if (p.olhos === 2) {
    [[5, 9], [5, 10], [10, 9], [10, 10]].forEach(([X, Y]) => put(PX.K, X, Y));
  } else {
    for (let X = 6; X <= 9; X++) for (let Y = 8; Y <= 10; Y++) put(PX.w, X, Y);
    [[7, 9], [8, 9], [7, 10], [8, 10]].forEach(([X, Y]) => put(PX.K, X, Y));
  }
  if (p.chifre) {
    put(PX.K, 8, 1);
    put(PX.K, 7, 2); put(PX.H, 8, 2); put(PX.K, 9, 2);
    put(PX.K, 6, 3); put(PX.H, 7, 3); put(PX.H, 8, 3); put(PX.K, 9, 3);
    put(PX.H, 7, 4); put(PX.h, 8, 4);
  }
}

/* O que a aparência já diz de cada gene: V_ (uma maiúscula garantida), vv, Vv no roxo, __ quando a cor está escondida. */
function pubGeno(V, p, i) {
  const L = V.genes[i];
  if (L === 'V') {
    if (V.trans && p.cor === 'transparente') return '__';
    if (V.inc) return p.cor === 'vermelho' ? 'VV' : p.cor === 'roxo' ? 'Vv' : 'vv';
    return p.cor === 'vermelho' ? 'V_' : 'vv';
  }
  if (L === 'C') return p.chifre ? 'C_' : 'cc';
  if (L === 'E') return p.olhos === 2 ? 'E_' : 'ee';
  if (L === 'T') return p.cor === 'transparente' ? 'tt' : 'T_';
  if (L === 'A') return p.asas ? 'aa' : 'A_';
  return '__';
}
function geneOptions(V, p, i) {
  const pub = pubGeno(V, p, i), L = V.genes[i], l = L.toLowerCase();
  if (pub === '__') return V.inc ? [pub, L + L, L + l, l + l] : [pub, L + L, L + l, l + l];
  if (pub.includes('_')) return [pub, L + L, L + l];
  return [];
}
function trueGeno(V, c) {
  return c.g.map((pair, i) => {
    const L = V.genes[i], l = L.toLowerCase();
    return pair.map(v => (v ? L : l)).sort().join('');
  });
}

function puzzleFromList(V, d) {
  const [num, a, b, c, tg] = d;
  const P = { V, key: (V.list || 'lista1') + ':' + num, mods: NO_MODS, reg: new Map(), lit: new Map(), Es: [] };
  const gen = str => V.genes.map((_, i) => [+str[2 * i], +str[2 * i + 1]]);
  P.starters = [['A', a], ['B', b], ['C', c]].map(([id, str]) => reg(P, { id, parents: null, g: gen(str) }));
  P.target = { cor: tg[0] === '1' ? 'vermelho' : 'azul', chifre: tg[1] === '1', olhos: tg[2] === '1' ? 2 : 1 };
  if (V.wings) P.target.asas = tg[3] === '0'; /* asa é o recessivo: 0 nas duas cópias */
  /* desafio com ameaças prontas (modo difícil do dia): ids na ordem em que acontecem */
  if (d[5]) P.Es = d[5].split(',').map((id, i) => ({ E: EVENTS.find(e => e.id === id), at: HARD_AT[i] }));
  const res = solve(P, 3);
  if (!res) return null;
  P.par = res.depth; P.path = res.path;
  return P;
}

function newGame(mode, V, seedStr, info, saved, mods, listed) {
  mods = Object.assign({}, NO_MODS, mods || {});
  let P = listed ? puzzleFromList(V, listed) : null;
  if (!P) P = makePuzzle(V, seedStr, mods);
  for (let extra = 1; !P && extra < 20; extra++) P = makePuzzle(V, seedStr + '+' + extra, mods);
  G = {
    mode, V, seedStr, info, P, mods, listed,
    pop: P.starters.slice(),
    labels: new Map(P.starters.map(s => [s.id, s.id])),
    next: 1, crosses: [], sel: [], status: 'playing', reveal: false,
    marks: Object.assign({}, (saved && saved.marks) || {}), focus: null,
    dead: new Set(), fired: 0, killed: [], killer: new Map(), curE: null, reason: '',
  };
  ((saved && saved.crosses) || []).forEach(([a, b]) => { if (G.status === 'playing') doCross(a, b, true); });
  if (saved && saved.gaveup) { G.status = 'lost'; G.reason = 'r_gaveup'; G.reveal = true; G.gaveup = true; }
  fresh = new Set();
  render();
}

function usesOf(id) { let n = 0; G.crosses.forEach(c => { if (c.a === id || c.b === id) n++; }); return n; }
function canBreed(id) { return !G.dead.has(id) && (!G.mods.aging || usesOf(id) < AGE_LIMIT); }
function pairsLeft() {
  const ok = G.pop.filter(c => canBreed(c.id));
  for (let i = 0; i < ok.length; i++) for (let j = i + 1; j < ok.length; j++) {
    const pk = pairKey(ok[i], ok[j]);
    if (!G.crosses.some(c => pairKey(C(c.a), C(c.b)) === pk)) return true;
  }
  return false;
}

function doCross(aId, bId, silent) {
  const a = C(aId), b = C(bId);
  if (!a || !b) return;
  const kids = litter(G.P, a, b);
  kids.forEach(k => {
    if (!G.labels.has(k.id)) { G.labels.set(k.id, String(G.next++)); G.pop.push(k); if (!silent) fresh.add(k.id); }
  });
  G.crosses.push({ a: aId, b: bId, kids: kids.map(k => k.id) });
  if (kids.some(k => match(G.V, k.p, G.P.target))) { G.status = 'won'; }
  else {
    const ev = G.P.Es[G.fired];
    if (ev && G.crosses.length === ev.at) {
      G.fired++;
      const victims = [];
      G.pop.forEach(c => { if (!G.dead.has(c.id) && killedBy(ev.E, c.p)) { G.dead.add(c.id); G.killer.set(c.id, ev.E.id); victims.push(c.id); } });
      G.killed.push(victims.length);
      G.curE = ev.E;
      /* jogando de verdade, a morte vira cena: espera a ninhada nascer, avisa, assusta, murcha e só então mostra o morto */
      if (!silent && victims.length) { G.dying = new Set(victims); G.deathState = new Map(victims.map(id => [id, 'alive'])); G.deathT0 = Date.now() + LITTER_MS + 300; G.deathScheduled = false; }
    }
    if (G.crosses.length >= G.V.max) { G.status = 'lost'; G.reason = 'r_out'; }
    else if (!pairsLeft()) { G.status = 'lost'; G.reason = 'r_nopair'; }
  }
  if (!silent) save();
  if (G.mode === 'daily' && !silent && !G.replay && !G.autoplay && G.crosses.length === 1) track('start');
  if (G.mode === 'daily' && G.status !== 'playing') recordDaily();
}

function recordDaily() {
  if (G.replay) return;
  const st = load(STATS) || { days: {} };
  if (st.days[G.seedStr]) return;
  st.days[G.seedStr] = { won: G.status === 'won', n: G.crosses.length };
  store(STATS, st);
  track('end');
}
/* Estatística anônima do desafio do dia (functions/api/stats.js): o começo e o fim de cada partida, sem identificar ninguém.
   Só no site e nos endereços de teste do Cloudflare; os de teste vão marcados e ficam fora do resumo. */
const TRACK_ON = /(^|\.)slimecross\.com$|(^|\.)slime-cross\.pages\.dev$/.test(location.hostname);
const TRACK_TEST = !IS_LIVE && location.hostname !== 'slime-cross.pages.dev';
function track(ev, reason) {

  try {
    const before = Object.keys((load(STATS) || { days: {} }).days).filter(k => k !== G.seedStr);
    const S = statsSummary();
    const body = {
      ev, date: G.seedStr, day: G.info.n, hard: G.V === HARD, test: TRACK_TEST || !!TEST_DAY,
      won: G.status === 'won', reason: reason || G.reason || '', n: G.crosses.length, par: G.P.par,
      path: G.crosses.map(c => lab(c.a) + '×' + lab(c.b)).join(' '), played: before.length, streak: S.current, lang: LANG,
    };
    fetch('/api/stats', { method: 'POST', keepalive: true, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});
  } catch (e) {}
}

  let best = 0, run = 0, prev = null;
  keys.forEach(k => {
    const won = st.days[k].won, n = dayNum(k);
    run = won ? (prev !== null && n - prev === 1 && run > 0 ? run + 1 : 1) : 0;
    prev = n;
    best = Math.max(best, run);
  });
  const last = keys[keys.length - 1];
  const todayN = dayNum(today().key);
  const current = last && st.days[last].won && todayN - dayNum(last) <= 1 ? run : 0;
  return { played, wins, current, best, dist };
}

let TREE_SIZE = { w: 0, h: 0 };
function applyZoom() {

  if (!sizer || !canvas || !G) return;

}
