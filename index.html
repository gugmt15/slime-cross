<script>
/* Mudança de endereço: quem abre pelo github.io ou pelo www vai pro slimecross.com levando o que está salvo no navegador
   (tudo que começa com "slime-"), e o slimecross.com importa na chegada sem sobrescrever o que já tiver. */
(function () {
  const NOVO = 'https://slimecross.com/';
  if (location.hostname === 'gugmt15.github.io' || location.hostname === 'www.slimecross.com') {
    const dados = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf('slime-') === 0) dados[k] = localStorage.getItem(k);
      }
    } catch (e) { /* sem armazenamento: vai sem dados */ }
    location.replace(NOVO + (Object.keys(dados).length ? '#importar=' + encodeURIComponent(JSON.stringify(dados)) : ''));
    return;
  }
  const m = location.hash.match(/^#importar=(.+)$/);
  if (!m) return;
  try {
    const dados = JSON.parse(decodeURIComponent(m[1]));
    for (const k in dados) {
      if (k.indexOf('slime-') === 0 && typeof dados[k] === 'string' && localStorage.getItem(k) === null) localStorage.setItem(k, dados[k]);
    }
  } catch (e) { /* dado estragado ou sem armazenamento: segue sem importar */ }
  history.replaceState(null, '', location.pathname + location.search);
})();
</script>

/* Layout: caderno de laboratório quadriculado; alvo e ameaça no topo, árvore genealógica no meio, barra de anotar e cruzar presa embaixo. */
:root {

    --ink: #e2ebe3; --muted: #97a99c; --line: #2e3c33;

@keyframes jump { 0%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(0) scale(1.15, 0.85); } 50% { transform: translateY(-14px) scale(0.92, 1.1); } 85% { transform: translateY(0) scale(1.1, 0.9); } }
.slime { position: relative; }
.fx { position: absolute; top: 30%; font-size: 1rem; pointer-events: none; animation: floatup 1.6s ease-out both; z-index: 2; }
.fx.heart { color: #ff6f91; }

@keyframes floatup { 0% { transform: translate(0, 0) scale(0.4); opacity: 0; } 15% { opacity: 1; transform: translate(0, -6px) scale(1.1); } 100% { transform: translate(var(--dx), -56px) scale(0.8); opacity: 0; } }
.slime.sad canvas.sprite { animation: none; transform: translateY(3px) scale(1.08, 0.88); transform-origin: 50% 100%; }
.slime.wilting canvas.sprite { animation: wilt 1.1s ease-in-out both; transform-origin: 50% 100%; }
@keyframes wilt { 0% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(4px) scale(1.14, 0.8); } 70% { transform: translateY(2px) scale(1.05, 0.92); } 100% { transform: translateY(3px) scale(1.08, 0.88); } }
@keyframes shine { 0%, 100% { box-shadow: 0 0 0 2px var(--accent), 0 0 10px 2px var(--accent); } 50% { box-shadow: 0 0 0 3px var(--accent), 0 0 28px 10px var(--accent); } }
@keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
canvas.sprite { image-rendering: pixelated; image-rendering: crisp-edges; animation: bob 1.4s steps(2) infinite; }
.slime.dead canvas.sprite { animation: none; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { canvas.sprite, .slime.fresh, .slime.fresh.winner, .slime.fresh.winner canvas.sprite, .slime.wilting canvas.sprite { animation: none; } }

.tut-card.hit { border-color: var(--accent); background: var(--well); }
.tut-lab { font-weight: 700; font-size: 0.95rem; }
.tut-say.wrong { border-left-color: var(--danger); }
.tut-target { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 1rem; }
.tut-target canvas { width: 48px; height: 48px; }
.tut-badge { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; background: var(--accent); color: var(--accent-ink); padding: 1px 6px; border-radius: 4px; }
.tut-gen { display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
.tut-gen-label { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.tut-left { font-size: 0.85rem; color: var(--muted); align-self: center; }
.tut-gen .tut-card canvas { width: 56px; height: 56px; }
.mix-grid { display: grid; grid-template-columns: auto repeat(4, minmax(0, 1fr)); gap: 8px 6px; align-items: center; justify-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 10px 8px; }
.mix-lab { justify-self: start; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.mix-grid .copies { display: flex; gap: 3px; }
.mix-grid .copy { width: 22px; height: 22px; font-size: 0.78rem; }
.mix-grid canvas { width: 44px; height: 44px; }
.mix-cell { border-radius: 6px; padding: 2px; }
.mix-cell.moved { animation: mixflash 700ms ease-out both; }
.mix-slime { border-radius: 8px; padding: 2px; border: 2px solid transparent; }
.mix-slime.hit { border-color: var(--accent); background: var(--well); }
@keyframes mixflash { from { background: var(--accent); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .mix-cell.moved { animation: none; } }
@keyframes hatch { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .tut-kids .tut-card { animation: none; } }
.pinbar { position: fixed; left: 0; right: 0; top: 0; z-index: 3; background: var(--surface); border-bottom: 2px solid var(--ink); padding: calc(6px + env(safe-area-inset-top, 0px)) 16px 6px; }
.pin-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 700; }
.pin-in canvas { width: 52px; height: 52px; flex: none; }
.pin-label { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; background: var(--accent); color: var(--accent-ink); padding: 1px 6px; border-radius: 4px; }
.langs { display: flex; gap: 6px; }
.home .langs { align-self: flex-end; }
.lang { border: 2px solid transparent; background: transparent; padding: 2px; border-radius: 5px; line-height: 0; cursor: pointer; }
.lang[aria-pressed="true"] { border-color: var(--accent); }
.lang svg { width: 28px; height: 19px; display: block; border-radius: 2px; box-shadow: 0 0 0 1px var(--line); }
footer { font-size: 0.8rem; color: var(--muted); padding-bottom: 16px; max-width: 65ch; }
[hidden] { display: none !important; }
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }

<script>

const LANGS = ['pt', 'en', 'ja'];
const I18N = {"title":["Slime Cross","Slime Cross","スライムクロス"],"home_tag":["Cruze slimes, descubra os genes escondidos e faça nascer o slime do dia!","Cross slimes, uncover their hidden genes and hatch the slime of the day!","スライムを交配して、かくれた遺伝子を見つけ、今日のスライムを生み出そう!"],"go_daily":["Desafio do dia","Daily challenge","今日のチャレンジ"],"start_here":["comece aqui","start here","ここから"],"tutorial":["Tutorial","Tutorial","チュートリアル"],"tut_sub":["aprenda como funciona em dois minutos","learn how it works in two minutes","2分で遊び方がわかる"],"more":["Mais opções","More options","その他"],"more_sub":["treino, outras versões e modos especiais","practice, other versions and special modes","練習・ほかのバージョン・特別モード"],"home_btn":["← Início","← Home","← ホーム"],"new":["Novo desafio","New challenge","新しいチャレンジ"],"easy":["Ativar anotações","Enable notes","メモを使う"],"reset":["Recomeçar","Restart","やり直す"],"reset_confirm":["Toque de novo para recomeçar","Tap again to restart","もう一度タップでやり直す"],"version":["Versão","Version","バージョン"],"trainhelp":["Cada versão acrescenta uma regra: <b>Roxo</b>, vermelho com azul dá roxo; <b>Transparente</b>, um gene esconde a cor; <b>Quatro genes</b>, entram as asas e 9 cruzamentos; <b>Roxo e transparente</b>, as duas juntas. Os modos especiais deixam mais difícil:","Each version adds a rule: <b>Purple</b>, red with blue makes purple; <b>Transparent</b>, one gene hides the color; <b>Four genes</b>, wings join in, with 9 crosses; <b>Purple and transparent</b>, both together. Special modes make it harder:","バージョンごとにルールが1つ増えます。<b>紫</b>:赤と青で紫になる。<b>透明</b>:ある遺伝子が色をかくす。<b>4つの遺伝子</b>:翼が加わり、交配は9回まで。<b>紫と透明</b>:両方いっしょ。特別モードで難しくなります:"],"mods_aria":["Modos especiais","Special modes","特別モード"],"mod_aging":["Envelhecer: cada slime cruza só 2 vezes","Aging: each slime can only cross twice","老化:スライムは2回までしか交配できない"],"mod_threat":["Ameaça: depois do 2º cruzamento, o ambiente mata os slimes de uma aparência (quem só esconde o traço escapa)","Threat: after the 2nd cross, the environment kills slimes with one look (those that only hide the trait survive)","天敵:2回目の交配のあと、ある見た目のスライムがやられる(特徴をかくしているだけのスライムは助かる)"],"mod_hard":["Difícil: o gene que o alvo pede pode estar escondido nos iniciais","Hard: the gene the target needs may be hidden in the starting slimes","ハード:目標に必要な遺伝子が最初のスライムにかくれていることがある"],"target_aria":["Alvo","Target","目標"],"target_today":["Alvo de hoje","Today's target","今日の目標"],"target":["Alvo","Target","目標"],"target_genes":["Genes do alvo:","Target genes:","目標の遺伝子:"],"threat":["Ameaça","Threat","天敵"],"rules_sum":["Dominante e recessivo","Dominant and recessive","顕性と潜性"],"howto_sum":["Como jogar","How to play","遊び方"],"howto":["<li>Cada slime tem <b>duas cópias</b> de cada gene, uma de cada pai. A <b>dominante</b> aparece; a <b>recessiva</b> fica escondida e pode voltar nos filhos.</li><li>Toque em dois slimes e aperte <b>Cruzar</b>. Nascem sempre 4 filhotes, e cada traço sai na <b>proporção exata</b>: dois vermelhos que escondem azul dão 3 vermelhos e 1 azul.</li><li>Já <b>quais traços vão juntos</b> no mesmo filhote é sorteado, como na natureza. Por isso uma combinação possível pode não nascer. O sorteio é igual para todo mundo, e o mesmo par dá sempre a mesma ninhada.</li><li>Os filhotes entram na árvore e podem ser cruzados com qualquer slime, <b>até com o próprio pai ou mãe</b>. Você tem 8 cruzamentos para fazer nascer o alvo.</li><li>Todo desafio precisa de <b>pelo menos 3 cruzamentos</b>: o alvo junta traços de slimes diferentes, e isso leva duas gerações.</li><li>O que o alvo pede sempre aparece à vista em algum dos slimes iniciais. Dá para descobrir os genes escondidos só deduzindo.</li><li>O botão <b>Ativar anotações</b> mostra as letras dos genes embaixo de cada slime e permite marcar palpites. <code>V_</code> quer dizer “tem um V, e a outra letra ainda não se sabe”.</li>","<li>Each slime has <b>two copies</b> of each gene, one from each parent. The <b>dominant</b> one shows; the <b>recessive</b> one stays hidden and can come back in the offspring.</li><li>Tap two slimes and press <b>Cross</b>. You always get 4 offspring, and each trait comes out in the <b>exact ratio</b>: two reds that hide blue give 3 red and 1 blue.</li><li><b>Which traits go together</b> in the same offspring, though, is random, like in nature. So a possible combination may not hatch. The draw is the same for everyone, and the same pair always gives the same litter.</li><li>The offspring join the tree and can be crossed with any slime, <b>even their own parent</b>. You have 8 crosses to hatch the target.</li><li>Every challenge needs <b>at least 3 crosses</b>: the target combines traits from different slimes, and that takes two generations.</li><li>Whatever the target needs always shows up in one of the starting slimes. You can figure out the hidden genes by deduction alone.</li><li><b>Enable notes</b> shows the gene letters under each slime and lets you mark your guesses. <code>V_</code> means “it has a V, and the other letter is still unknown”.</li>","<li>スライムはそれぞれの遺伝子を<b>2つ</b>持っていて、親から1つずつもらいます。<b>顕性</b>のほうが見た目に出て、<b>潜性</b>のほうはかくれたまま、子どもで現れることがあります。</li><li>スライムを2匹タップして<b>交配</b>を押します。子どもはいつも4匹で、それぞれの特徴は<b>ぴったりの割合</b>で生まれます。青をかくした赤どうしなら、赤3匹と青1匹です。</li><li>ただし、<b>どの特徴が同じ子にそろうか</b>は、自然と同じようにランダムです。だから、ありえる組み合わせが生まれないこともあります。結果はみんな同じで、同じペアからはいつも同じ子どもが生まれます。</li><li>子どもは家系図に加わり、どのスライムとも交配できます。<b>自分の親とも</b>交配できます。目標を生み出すまでに使える交配は8回です。</li><li>どのチャレンジも<b>3回以上の交配</b>が必要です。目標はちがうスライムの特徴を組み合わせたもので、2世代かかります。</li><li>目標に必要な特徴は、最初のスライムのどれかに必ず見えています。かくれた遺伝子は推理だけで見つけられます。</li><li><b>メモを使う</b>をオンにすると、スライムの下に遺伝子の文字が出て、予想をメモできます。<code>V_</code>は「Vを1つ持っていて、もう1つはまだわからない」という意味です。</li>"],"tut_again":["Rever o tutorial","Replay the tutorial","チュートリアルをもう一度"],"tree":["Árvore da família","Family tree","家系図"],"zoom_aria":["Zoom da árvore","Tree zoom","家系図のズーム"],"z_out":["Afastar","Zoom out","縮小"],"z_in":["Aproximar","Zoom in","拡大"],"z_fit":["Ver tudo","Fit","全体"],"footer":["Mendel chegou nessas regras cruzando ervilhas no jardim do mosteiro de Brno, entre 1856 e 1863. A cor intermediária e o gene que esconde outro foram entendidos depois dele, no começo do século 20.","Mendel found these rules by crossing peas in the garden of the abbey in Brno, between 1856 and 1863. Intermediate colors and genes that hide other genes were understood after him, in the early 20th century.","メンデルは1856年から1863年にかけて、ブルノの修道院の庭でエンドウを交配して、この法則を見つけました。中間の色や、ほかの遺伝子をかくす遺伝子がわかったのは、20世紀のはじめになってからです。"],"msg_start":["Toque em dois slimes para cruzar.","Tap two slimes to cross them.","スライムを2匹タップして交配しよう。"],"pips_aria":["Cruzamentos usados","Crosses used","使った交配"],"cross":["Cruzar","Cross","交配"],"cross_ab":["Cruzar {a} × {b}","Cross {a} × {b}","{a} × {b}を交配"],"giveup":["Ver resposta","Show answer","答えを見る"],"giveup_confirm":["Tem certeza? Toque de novo","Sure? Tap again","本当に? もう一度タップ"],"v_classico":["Clássico","Classic","クラシック"],"v_roxo":["Roxo","Purple","紫"],"v_transparente":["Transparente","Transparent","透明"],"v_asas":["Quatro genes","Four genes","4つの遺伝子"],"v_mistura":["Roxo e transparente","Purple and transparent","紫と透明"],"v_option":["{nome} ({n} cruzamentos)","{nome} ({n} crosses)","{nome}(交配{n}回)"],"days":[["domingo","segunda","terça","quarta","quinta","sexta","sábado"],["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],["日曜","月曜","火曜","水曜","木曜","金曜","土曜"]],"g_V":["Cor","Color","色"],"g_C":["Chifre","Horn","角"],"g_E":["Olhos","Eyes","目"],"g_T":["Transp.","Transp.","透明"],"g_A":["Asas","Wings","翼"],"c_vermelho":["vermelho","red","赤"],"c_azul":["azul","blue","青"],"c_roxo":["roxo","purple","紫"],"c_transparente":["transparente","transparent","透明"],"horn_y":["com chifre","horned","角あり"],"horn_n":["sem chifre","no horn","角なし"],"eyes_2":["dois olhos","two eyes","目が2つ"],"eyes_1":["um olho","one eye","目が1つ"],"wings_y":["com asas","winged","翼あり"],"wings_n":["sem asas","no wings","翼なし"],"wing_y":["com asa","winged","翼あり"],"wing_n":["sem asa","no wings","翼なし"],"normal":["normal","normal","ふつう"],"r_color":["Cor","Color","色"],"r_horn":["Chifre","Horn","角"],"r_eyes":["Olhos","Eyes","目"],"r_trans":["Transparência","Transparency","透明度"],"r_wings":["Asas","Wings","翼"],"rn_mix":["Nenhuma é dominante: uma de cada dá roxo.","Neither is dominant: one of each makes purple.","どちらも顕性ではなく、1つずつだと紫になる。"],"rn_color":["Só {{vv}} é azul. Um vermelho pode esconder azul.","Only {{vv}} is blue. A red one can hide blue.","{{vv}}だけが青。赤いスライムが青をかくしていることもある。"],"rn_horn":["Só {{cc}} nasce sem chifre.","Only {{cc}} is born without a horn.","{{cc}}だけが角なしで生まれる。"],"rn_eyes":["Só {{ee}} nasce com um olho.","Only {{ee}} is born with one eye.","{{ee}}だけが目が1つで生まれる。"],"rn_trans":["Só {{tt}} fica transparente, e esconde a cor que carrega.","Only {{tt}} turns transparent, hiding the color it carries.","{{tt}}だけが透明になり、持っている色がかくれる。"],"rn_wings":["Só {{aa}} nasce com asas.","Only {{aa}} is born with wings.","{{aa}}だけが翼をもって生まれる。"],"dom":["dominante","dominant","顕性"],"rec":["recessivo","recessive","潜性"],"ev_olhos":["uma raposa come todo slime de um olho, que não vê ela chegando","a fox eats every one-eyed slime, since they can't see it coming","キツネが目が1つのスライムを全部食べてしまう(近づいても見えないから)"],"ev_chifre":["um lobo come todo slime sem chifre, que não tem como se defender","a wolf eats every hornless slime, since they can't defend themselves","オオカミが角のないスライムを全部食べてしまう(身を守れないから)"],"ev_vermelho":["um gavião leva todo slime vermelho, que se vê de longe","a hawk takes every red slime, easy to spot from above","タカが赤いスライムを全部さらっていく(遠くからでも目立つから)"],"ev_azul":["um gavião leva todo slime azul, que se vê de longe","a hawk takes every blue slime, easy to spot from above","タカが青いスライムを全部さらっていく(遠くからでも目立つから)"],"ev_roxo":["um gavião leva todo slime roxo, que se vê de longe","a hawk takes every purple slime, easy to spot from above","タカが紫のスライムを全部さらっていく(遠くからでも目立つから)"],"ev_transparente":["um sol forte evapora todo slime transparente","a strong sun evaporates every transparent slime","強い日差しで透明なスライムが全部蒸発する"],"ev_asas":["uma ventania leva embora todo slime de asa","a gale blows away every winged 伝子をかくす"],"show_genes":["Mostrar genes","Show genes","遺伝子を見る"],"another":["Outro desafio","Another challenge","別のチャレンジ"],"share_aria":["Resultado para compartilhar","Result to share","シェア用の結果"],"h_won":["nº {n} · resolvido em {m} ✓","No. {n} · solved in {m} ✓","第{n}回・{m}回で成功 ✓"],"h_lost":["nº {n} · não foi dessa vez","No. {n} · not this time","第{n}回・ざんねん"],"h_going":["nº {n} · em andamento","No. {n} · in progress","第{n}回・挑戦中"],"h_new":["nº {n} · até 8 cruzamentos","No. {n} · up to 8 crosses","第{n}回・交配は8回まで"],"step":["Passo {n} de {m}","Step {n} of {m}","ステップ {n}/{m}"],"next":["Próximo","Next","次へ"],"yes_hides":["Sim, esconde azul","Yes, it hides blue","はい、青をかくしている"],"no_hides":["Não esconde","No, it doesn't","いいえ、かくしていない"],"right":["Isso! ","Right! ","正解! "],"wrong":["Não é bem assim. ","Not quite. ","ちょっとちがう。"],"tut_done":["Pronto! No desafio do dia o alvo tem três traços (cor, chifre e olhos) e você tem 8 cruzamentos para fazer ele nascer. Se precisar de ajuda, toque em Ativar anotações: aparecem as letras dos genes embaixo de cada slime.","That's it! In the daily challenge the target has three traits (color, horn and eyes), and you have 8 crosses to hatch it. If you need help, tap Enable notes: it shows the gene letters under each slime.","これで準備完了! 今日のチャレンジでは目標に3つの特徴(色・角・目)があり、8回の交配で生み出します。困ったら「メモを使う」をオンにすると、スライムの下に遺伝子の文字が出ます。"],"play_daily":["Jogar o desafio do dia","Play the daily challenge","今日のチャレンジをあそぶ"],"back_home":["Voltar ao início","Back to home","ホームにもどる"],"t1_text":["Todo slime tem duas cópias do gene da cor: uma veio do pai e a outra da mãe. Este vermelho tem duas cópias vermelhas. Este azul tem duas cópias azuis. O que nasce se cruzar os dois?","Every slime has two copies of the color gene: one from each parent. This red one has two red copies. This blue one has two blue copies. What hatches if you cross them?","スライムは色の遺伝子を2つ持っていて、親から1つずつもらいます。この赤いスライムは赤を2つ、この青いスライムは青を2つ持っています。この2匹を交配すると、何が生まれるかな?"],"t1_say":["Os quatro nasceram vermelhos! Cada filhote pegou uma cópia de cada pai: uma vermelha e uma azul. Vermelho é dominante e azul é recessivo, então o azul ficou escondido dentro deles.","All four came out red! Each one got a copy from each parent: one red and one blue. Red is dominant and blue is recessive, so the blue stayed hidden inside them.","4匹とも赤で生まれた! どの子も親から1つずつ、赤と青をもらいました。赤が顕性で青が潜性なので、青は中にかくれています。"],"tp_text":["Também dá para cruzar um filhote com o próprio pai ou mãe. Cruze um desses filhotes vermelhos com o pai azul.","You can also cross an offspring with its own father or mother. Cross one of those red offspring with the blue parent.","子どもを自分の親と交配することもできます。赤い子どもの1匹を、青い親と交配しよう。"],"tp_say":["Metade saiu azul! O filhote deu a cópia azul que escondia, e o pai azul deu outra. Dá para cruzar qualquer par da árvore, até filho com pai ou mãe, e às vezes esse é o caminho mais curto até o alvo.","Half came out blue! The offspring gave the blue copy it was hiding, and the blue parent gave another. You can cross any pair in the tree, even a child with its parent, and sometimes that is the shortest way to the target.","半分が青になった! 子どもがかくしていた青を1つ、青い親がもう1つわたしたんだ。家系図のどのペアでも交配できて、親子どうしでもOK。それが目標へのいちばんの近道になることもある。"],"tm_text":["Como a ninhada se forma. Cada gene é resolvido separado: o jogo junta cada cópia de um pai com cada cópia do outro, o que dá 4 combinações de cor e 4 de chifre. Depois entrega uma combinação de cor e uma de chifre para cada filhote, numa ordem sorteada, gene por gene.","How a litter is made. Each gene is worked out separately: the game pairs each copy from one parent with each copy from the other, which gives 4 color combinations and 4 horn combinations. Then it hands one color and one horn combination to each offspring, in a random order, gene by gene.","子どもの生まれ方。遺伝子は1つずつ別々に決まります。片方の親のコピーともう片方の親のコピーを1つずつ組み合わせると、色の組み合わせが4つ、角の組み合わせが4つできます。それを4匹の子どもに1つずつ配ります。配る順番は遺伝子ごとにランダムです。"],"tm_shuffle":["Sortear de novo","Shuffle again","もう一度配る"],"tm_same":["A cor sai sempre 3 vermelhos e 1 azul, e o chifre sempre 3 com chifre e 1 sem. O que muda é quem fica com o quê.","Color always comes out 3 red and 1 blue, and horn always 3 horned and 1 hornless. What changes is who gets what.","色はいつも赤3・青1、角はいつも角あり3・角なし1。変わるのは、どの子が何をもらうかだけ。"],"tm_yes":[" Desta vez o azul ficou com o sem chifre, e nasceu um azul sem chifre."," This time the blue went with the hornless, so a blue hornless one hatched.","今回は青と角なしが同じ子にそろったので、青で角なしが生まれた。"],"tm_no":[" Desta vez o azul ficou com chifre, e o azul sem chifre não nasceu, mesmo sendo possível."," This time the blue got a horn, so no blue hornless one hatched, even though it was possible.","今回は青に角がついたので、青で角なしは生まれなかった。ありえる組み合わせなのに。"],"tm_fixed":[" No jogo, essa ordem é sorteada uma vez para cada par e é a mesma para todo mundo."," In the game, this order is drawn once for each pair and is the same for everyone.","ゲームでは、この順番はペアごとに1回だけ決まり、みんな同じです。"],"t2_text":["Agora cruze dois desses filhotes. Por fora são vermelhos, mas cada um esconde uma cópia azul.","Now cross two of these offspring. They look red, but each one hides a blue copy.","次はこの子どもを2匹交配しよう。見た目は赤でも、どちらも青を1つかくしています。"],"t2_say":["Nasceu um azul! Ele pegou a cópia azul escondida de cada pai. Um traço pode sumir numa geração e voltar na seguinte. Foi isso que o Mendel viu cruzando ervilhas.","A blue one hatched! It got the hidden blue copy from each parent. A trait can vanish in one generation and come back in the next. That is what Mendel saw crossing peas.","青が生まれた! 両方の親から、かくれていた青を1つずつもらったんだ。特徴はある世代で消えて、次の世代でもどってくることがある。メンデルがエンドウの交配で見たのはこれです。"],"t3_text":["Sua vez. No jogo não dá para ver as cópias, só a aparência. Este vermelho cruzou com um azul e teve estes quatro filhotes. Ele esconde azul?","Your turn. In the game you can't see the copies, only the looks. This red one was crossed with a blue one and had these four offspring. Does it hide blue?","きみの番。ゲームでは遺伝子は見えず、見た目しかわかりません。この赤いスライムを青と交配したら、この4匹が生まれました。この赤は青をかくしている?"],"t3_explain":["Nasceram filhotes azuis, e azul precisa de duas cópias azuis. Uma veio do pai azul; a outra só pode ter vindo do vermelho. Então ele esconde azul.","Blue offspring hatched, and blue needs two blue copies. One came from the blue parent; the other can only have come from the red one. So it hides blue.","青い子どもが生まれた。青になるには青が2つ必要です。1つは青い親から、もう1つは赤い親からとしか考えられない。だから赤は青をかくしています。"],"t4_text":["E este outro vermelho? Também cruzou com um azul. Ele esconde azul?","And this other red one? It was also crossed with a blue one. Does it hide blue?","こちらの赤いスライムは? これも青と交配しました。青をかくしている?"],"t4_explain":["Se ele escondesse azul, metade dos filhotes sairia azul, como no exemplo anterior. Nasceram quatro vermelhos, então ele tem duas cópias vermelhas e não esconde nada.","If it hid blue, half the offspring would come out blue, like in the last example. All four are red, so it has two red copies and hides nothing.","もし青をかくしていたら、さっきの例のように半分が青になるはず。4匹とも赤なので、赤を2つ持っていて、何もかくしていません。"],"t5_text":["Cada gene é herdado separado. Este é azul com chifre; este é vermelho sem chifre. O que nasce?","Each gene is inherited separately. This one is blue and horned; this one is red with no horn. What hatches?","遺伝子はそれぞれ別々に受けつがれます。こちらは青で角あり、こちらは赤で角なし。何が生まれるかな?"],"t5_say":["Todos vermelhos e com chifre, porque vermelho e com chifre são dominantes. Mas cada filhote esconde um azul e um sem chifre.","All red and horned, because red and horned are dominant. But each one hides a blue and a hornless copy.","みんな赤で角あり。赤と角ありが顕性だからです。でも、どの子も青と角なしをかくしています。"],"t6_text":["Agora cruze dois desses filhotes.","Now cross two of these offspring.","次はこの子どもを2匹交配しよう。"],"t6_say":["Nasceu um azul sem chifre, e nenhum dos avós era assim: um era azul com chifre, o outro vermelho sem chifre. Como cada gene vem separado, dá para juntar o azul de um lado com o sem chifre do outro. É assim que você monta o alvo no jogo.","A blue, hornless one hatched, and neither grandparent looked like that: one was blue and horned, the other red with no horn. Since each gene comes separately, you can combine the blue from one side with the hornless from the other. That's how you build the target in the game.","青で角なしが生まれた。祖父母にはこんなスライムはいなかった。片方は青で角あり、もう片方は赤で角なし。遺伝子は別々に受けつがれるので、片方の青ともう片方の角なしを組み合わせられる。ゲームではこうやって目標を作ります。"],"lang_pt":["Português (Brasil)","Português (Brasil)","Português (Brasil)"],"lang_en":["English (US)","English (US)","English (US)"],"lang_ja":["日本語","日本語","日本語"],"lang_aria":["Idioma","Language","言語"],"sub_default":["desafio de genética","genetics challenge","遺伝のチャレンジ"],"e_min_path":["O mínimo é {n} cruzamentos:","The minimum is {n} crosses:","最少は{n}回:"],"e_others":["Pode haver outros caminhos.","There may be other ways.","ほかの方法もあるかもしれない。"]};
let LANG = 'pt';
function tr(key, v) {
  const e = I18N[key];
  let s = e ? e[LANGS.indexOf(LANG)] : key;
  if (typeof s !== 'string') return s;
  v = v || {};
  return s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)).replace(/\{\{/g, '{').replace(/\}\}/g, '}');
}
function vname(V) { return tr('v_' + V.id); }

function renderLangButtons() {
  document.querySelectorAll('.langs').forEach(box => {
    box.setAttribute('role', 'group'); box.setAttribute('aria-label', tr('lang_aria'));
    box.replaceChildren(...LANGS.map(l => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'lang';
      b.innerHTML = FLAGS[l]; b.setAttribute('aria-label', tr('lang_' + l)); b.title = tr('lang_' + l);
      b.setAttribute('aria-pressed', l === LANG ? 'true' : 'false');
      b.addEventListener('click', () => setLang(l));
      return b;
    }));
  });
}
function applyStatic() {
  document.documentElement.lang = { pt: 'pt-BR', en: 'en-US', ja: 'ja' }[LANG];
  document.title = tr('title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = tr(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = tr(e.dataset.i18nHtml); });

  if (!$('view-home').hidden) renderHome();

function initLang() {

/* ---------- lógica: genética, ninhadas, ameaça, gerador e solucionador ---------- */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h;
}
function rngFrom(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle4(rng) {
  const p = [0, 1, 2, 3];
  for (let i = 3; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  return p;
}

function reg(P, c) { c.p = phenOf(P.V, c.g); P.reg.set(c.id, c); return c; }

function phenOf(V, g) {
  const has = i => (g[i][0] | g[i][1]);
  let cor = V.inc ? ['azul', 'roxo', 'vermelho'][g[0][0] + g[0][1]] : (has(0) ? 'vermelho' : 'azul');
  if (V.trans && !has(V.genes.indexOf('T'))) cor = 'transparente';
  const p = { cor, chifre: !!has(1), olhos: has(2) ? 2 : 1 };
  if (V.wings) p.asas = !has(V.genes.indexOf('A'));
  return p;
}
function hits(V, p, t) { let n = 0; V.keys.forEach(k => { if (p[k] === t[k]) n++; }); return n; }
function match(V, p, t) { return hits(V, p, t) === V.keys.length; }
function killedBy(E, p) { return !!E && p[E.k] === E.v; }
function pairKey(a, b) { return a.id < b.id ? a.id + '|' + b.id : b.id + '|' + a.id; }

function litter(P, a, b) {
  const [x, y] = a.id < b.id ? [a, b] : [b, a];
  const mk = x.id + '|' + y.id;
  if (P.lit.has(mk)) return P.lit.get(mk);
  const n = P.V.genes.length;
  const kids = [0, 1, 2, 3].map(k => ({ id: '(' + x.id + 'x' + y.id + ')' + k, g: [], parents: [x.id, y.id], idx: k }));
  for (let i = 0; i < n; i++) {
    const pun = [
      [x.g[i][0], y.g[i][0]], [x.g[i][0], y.g[i][1]],
      [x.g[i][1], y.g[i][0]], [x.g[i][1], y.g[i][1]],
    ];
    const perm = shuffle4(rngFrom(hashStr(P.key + '|' + mk + '|' + i)));
    for (let k = 0; k < 4; k++) kids[k].g[i] = pun[perm[k]].slice();
  }
  kids.forEach(k => reg(P, k));
  P.lit.set(mk, kids);
  return kids;
}

/* Busca o menor número de cruzamentos, respeitando o limite de uso e a ameaça. */
function solve(P, maxD) {
  const V = P.V, E = P.E;
  function dfs(pop, uses, done, made, d) {
    for (let i = 0; i < pop.length; i++) {
      const a = pop[i];
      if (P.mods.aging && (uses[a.id] || 0) >= AGE_LIMIT) continue;
      for (let j = i + 1; j < pop.length; j++) {
        const b = pop[j];
        if (P.mods.aging && (uses[b.id] || 0) >= AGE_LIMIT) continue;
        const pk = pairKey(a, b);
        if (done.includes(pk)) continue;
        const kids = litter(P, a, b);
        if (kids.some(k => match(V, k.p, P.target))) return [[a.id, b.id]];
        if (d > 1) {
          const nu = Object.assign({}, uses);
          nu[a.id] = (nu[a.id] || 0) + 1; nu[b.id] = (nu[b.id] || 0) + 1;
          let np = pop.concat(kids);
          if (made + 1 === EVENT_AT) np = np.filter(c => !killedBy(E, c.p));
          const r = dfs(np, nu, done.concat(pk), made + 1, d - 1);
          if (r) return [[a.id, b.id]].concat(r);
        }
      }
    }
    return null;
  }
  for (let d = 1; d <= maxD; d++) {
    const r = dfs(P.starters.slice(), {}, [], 0, d);
    if (r) return { depth: d, path: r };
  }
  return null;
}

function interesting(V, t) {
  return t.cor !== 'vermelho' || !t.chifre || t.olhos === 1 || (V.wings && t.asas);
}

/* Modo justo: toda letra que o alvo precisa já aparece à vista em algum slime inicial,
   então dá pra achar o gene por dedução, sem cruzar no escuro atrás de um portador escondido. */
function knownLetters(pub) { return pub.split('').filter(ch => ch !== '_'); }
function fairStart(V, starters, target) {
  return V.genes.every((_, i) => {
    const need = [...new Set(knownLetters(pubGeno(V, target, i)))];
    return need.every(a => starters.some(s => knownLetters(pubGeno(V, s.p, i)).includes(a)));
  });
}

function makePuzzle(V, seedStr, mods) {
  const n = V.genes.length;
  const valid = EVENTS.filter(e => (!e.inc || V.inc) && (!e.trans || V.trans) && (!e.wings || V.wings));
  for (let attempt = 0; attempt < 30000; attempt++) {
    const key = V.id + (mods.aging ? '+idade' : '') + (mods.threat ? '+ameaca' : '') + (mods.hard ? '+dificil' : '') + ':' + seedStr + '#' + attempt;
    const rng = rngFrom(hashStr(key));
    const gen = () => Array.from({ length: n }, () => [rng() < 0.55 ? 1 : 0, rng() < 0.55 ? 1 : 0]);
    const P = { V, key, mods, reg: new Map(), lit: new Map(), E: null };
    P.starters = ['A', 'B', 'C'].map(id => reg(P, { id, parents: null, g: gen() }));
    P.target = phenOf(V, gen());
    if (!interesting(V, P.target)) continue;
    if (P.starters.some(s => match(V, s.p, P.target))) continue;
    if (!mods.hard && !fairStart(V, P.starters, P.target)) continue;
    if (mods.threat) {
      const onTarget = valid.filter(e => P.target[e.k] === e.v);
      const pool = onTarget.length && rng() < 0.5 ? onTarget : valid;
      P.E = pool[Math.floor(rng() * pool.length)];
    }
    const res = solve(P, 3);
    if (res && res.depth >= MIN_PAR) { P.par = res.depth; P.path = res.path; return P; }
  }
  return null;
}

const BASE = [

function drawSlime(cv, p) {
  const x = cv.getContext('2d');
  x.clearRect(0, 0, 16, 16);
  const body = BODY[p.cor];
  const put = (c, X, Y) => { x.fillStyle = c; x.fillRect(X, Y, 1, 1); };
  BASE.forEach((row, Y) => {
    for (let X = 0; X < 16; X++) {
      const ch = row[X];
      if (ch === 'L') put(body[0], X, Y);
      else if (ch === 'l') put(body[1], X, Y);
      else if (ch === 'K' || ch === 'w') put(PX[ch], X, Y);
    }
  });
  if (p.asas) WING.forEach(([X, Y, c]) => { const col = c === 'K' ? PX.K : c === 'F' ? '#eef3ff' : '#b7c3df'; put(col, X, Y); put(col, 15 - X, Y); });
  if (p.sad) {
    if (p.olhos === 2) {
      [[5, 9], [5, 10], [10, 9], [10, 10], [6, 8], [9, 8]].forEach(([X, Y]) => put(PX.K, X, Y));
      [[4, 11], [4, 12]].forEach(([X, Y]) => put('#9fd8ff', X, Y));
    } else {
      for (let X = 6; X <= 9; X++) for (let Y = 8; Y <= 10; Y++) put(PX.w, X, Y);
      [[7, 10], [8, 10]].forEach(([X, Y]) => put(PX.K, X, Y));
      [[6, 7], [7, 6], [8, 6], [9, 7]].forEach(([X, Y]) => put(PX.K, X, Y));
      [[11, 10], [11, 11]].forEach(([X, Y]) => put('#9fd8ff', X, Y));
    }
    [[6, 12], [7, 11], [8, 11], [9, 12]].forEach(([X, Y]) => put(PX.K, X, Y));
  } else if (p.happy) {
    if (p.olhos === 2) [[4, 9], [5, 8], [6, 9], [9, 9], [10, 8], [11, 9]].forEach(([X, Y]) => put(PX.K, X, Y));
    else [[5, 9], [6, 8], [7, 7], [8, 7], [9, 8], [10, 9]].forEach(([X, Y]) => put(PX.K, X, Y));
    [[6, 11], [7, 12], [8, 12], [9, 11]].forEach(([X, Y]) => put(PX.K, X, Y));
  } else if (p.olhos === 2) {
    [[5, 9], [5, 10], [10, 9], [10, 10]].forEach(([X, Y]) => put(PX.K, X, Y));
  } else {
    for (let X = 6; X <= 9; X++) for (let Y = 8; Y <= 10; Y++) put(PX.w, X, Y);
    [[7, 9], [8, 9], [7, 10], [8, 10]].forEach(([X, Y]) => put(PX.K, X, Y));
  }
  if (p.chifre) {
    put(PX.K, 8, 1);
    put(PX.K, 7, 2); put(PX.H, 8, 2); put(PX.K, 9, 2);
    put(PX.K, 6, 3); put(PX.H, 7, 3); put(PX.H, 8, 3); put(PX.K, 9, 3);
    put(PX.H, 7, 4); put(PX.h, 8, 4);
  }
}

/* O que a aparência já diz de cada gene: V_ (uma maiúscula garantida), vv, Vv no roxo, __ quando a cor está escondida. */
function pubGeno(V, p, i) {
  const L = V.genes[i];
  if (L === 'V') {
    if (V.trans && p.cor === 'transparente') return '__';
    if (V.inc) return p.cor === 'vermelho' ? 'VV' : p.cor === 'roxo' ? 'Vv' : 'vv';
    return p.cor === 'vermelho' ? 'V_' : 'vv';
  }
  if (L === 'C') return p.chifre ? 'C_' : 'cc';
  if (L === 'E') return p.olhos === 2 ? 'E_' : 'ee';
  if (L === 'T') return p.cor === 'transparente' ? 'tt' : 'T_';
  if (L === 'A') return p.asas ? 'aa' : 'A_';
  return '__';
}
function geneOptions(V, p, i) {
  const pub = pubGeno(V, p, i), L = V.genes[i], l = L.toLowerCase();
  if (pub === '__') return V.inc ? [pub, L + L, L + l, l + l] : [pub, L + L, L + l, l + l];
  if (pub.includes('_')) return [pub, L + L, L + l];
  return [];
}
function trueGeno(V, c) {
  return c.g.map((pair, i) => {
    const L = V.genes[i], l = L.toLowerCase();
    return pair.map(v => (v ? L : l)).sort().join('');
  });
}

function puzzleFromList(V, d) {
  const [num, a, b, c, tg] = d;
  const P = { V, key: 'lista1:' + num, mods: NO_MODS, reg: new Map(), lit: new Map(), E: null };
  const gen = str => [0, 1, 2].map(i => [+str[2 * i], +str[2 * i + 1]]);
  P.starters = [['A', a], ['B', b], ['C', c]].map(([id, str]) => reg(P, { id, parents: null, g: gen(str) }));
  P.target = { cor: tg[0] === '1' ? 'vermelho' : 'azul', chifre: tg[1] === '1', olhos: tg[2] === '1' ? 2 : 1 };
  const res = solve(P, 3);
  if (!res) return null;
  P.par = res.depth; P.path = res.path;
  return P;
}

function newGame(mode, V, seedStr, info, saved, mods, listed) {
  mods = Object.assign({}, NO_MODS, mods || {});
  let P = listed ? puzzleFromList(V, listed) : null;
  if (!P) P = makePuzzle(V, seedStr, mods);
  for (let extra = 1; !P && extra < 20; extra++) P = makePuzzle(V, seedStr + '+' + extra, mods);
  G = {
    mode, V, seedStr, info, P, mods,
    pop: P.starters.slice(),
    labels: new Map(P.starters.map(s => [s.id, s.id])),
    next: 1, crosses: [], sel: [], status: 'playing', reveal: false,
    marks: Object.assign({}, (saved && saved.marks) || {}), focus: null,
    dead: new Set(), fired: false, killed: 0, reason: '',
  };
  ((saved && saved.crosses) || []).forEach(([a, b]) => { if (G.status === 'playing') doCross(a, b, true); });
  if (saved && saved.gaveup) { G.status = 'lost'; G.reason = 'r_gaveup'; G.reveal = true; G.gaveup = true; }
  fresh = new Set();
  render();
}

function usesOf(id) { let n = 0; G.crosses.forEach(c => { if (c.a === id || c.b === id) n++; }); return n; }
function canBreed(id) { return !G.dead.has(id) && (!G.mods.aging || usesOf(id) < AGE_LIMIT); }
function pairsLeft() {
  const ok = G.pop.filter(c => canBreed(c.id));
  for (let i = 0; i < ok.length; i++) for (let j = i + 1; j < ok.length; j++) {
    const pk = pairKey(ok[i], ok[j]);
    if (!G.crosses.some(c => pairKey(C(c.a), C(c.b)) === pk)) return true;
  }
  return false;
}

function doCross(aId, bId, silent) {
  const a = C(aId), b = C(bId);
  if (!a || !b) return;
  const kids = litter(G.P, a, b);
  kids.forEach(k => {
    if (!G.labels.has(k.id)) { G.labels.set(k.id, String(G.next++)); G.pop.push(k); if (!silent) fresh.add(k.id); }
  });
  G.crosses.push({ a: aId, b: bId, kids: kids.map(k => k.id) });
  if (kids.some(k => match(G.V, k.p, G.P.target))) { G.status = 'won'; }
  else {
    if (G.P.E && G.crosses.length === EVENT_AT && !G.fired) {
      G.fired = true;
      G.pop.forEach(c => { if (!G.dead.has(c.id) && killedBy(G.P.E, c.p)) { G.dead.add(c.id); G.killed++; } });
    }
    if (G.crosses.length >= G.V.max) { G.status = 'lost'; G.reason = 'r_out'; }
    else if (!pairsLeft()) { G.status = 'lost'; G.reason = 'r_nopair'; }
  }
  if (!silent) save();
  if (G.mode === 'daily' && G.status !== 'playing') recordDaily();
}

function recordDaily() {
  const st = load(STATS) || { days: {} };
  if (st.days[G.seedStr]) return;
  st.days[G.seedStr] = { won: G.status === 'won', n: G.crosses.length };
  store(STATS, st);
}
function statsSummary() {
  const st = load(STATS) || { days: {} };
  const keys = Object.keys(st.days).sort();
  const played = keys.length;
  const wins = keys.filter(k => st.days[k].won).length;
  const dist = {};
  keys.forEach(k => { const d = st.days[k]; const b = d.won ? d.n : 'X'; dist[b] = (dist[b] || 0) + 1; });
  const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
  let best = 0, run = 0, prev = null;
  keys.forEach(k => {
    const won = st.days[k].won, n = dayNum(k);
    run = won ? (prev !== null && n - prev === 1 && run > 0 ? run + 1 : 1) : 0;
    prev = n;
    best = Math.max(best, run);
  });
  const last = keys[keys.length - 1];
  const todayN = dayNum(today().key);
  const current = last && st.days[last].won && todayN - dayNum(last) <= 1 ? run : 0;
  return { played, wins, current, best, dist };
}

  const S = statsSummary();

  [[S.played, tr('s_played')], [S.played ? Math.round(100 * S.wins / S.played) : 0, tr('s_wins')], [S.current, tr('s_streak')], [S.best, tr('s_best')]].forEach(([v, l]) => {
    const it = document.createElement('div'); it.className = 'stat';
    const b = document.createElement('b'); b.textContent = v;
    const sp = document.createElement('span'); sp.textContent = l;

  const dist = document.createElement('div'); dist.className = 'dist';
  const bins = [3, 4, 5, 6, 7, 8, 'X']; /* nenhum desafio sai em menos de 3 cruzamentos */
  const maxv = Math.max(1, ...bins.map(b => S.dist[b] || 0));
  const mine = G.status === 'won' ? G.crosses.length : 'X';
  bins.forEach(bn => {
    const row = document.createElement('div'); row.className = 'drow';

    bar.textContent = v;
    row.append(k, bar); dist.append(row);
  });
  const dt = document.createElement('p'); dt.className = 'stat-title'; dt.textContent = tr('s_title');
  box.append(nums, dt, dist);
  return box;
}

function save() {
  if (G.mode === 'daily') store(SAVE + G.seedStr, { crosses: G.crosses.map(c => [c.a, c.b]), marks: G.marks, gaveup: !!G.gaveup });

function nameOf(id) {
  if (G.labels.has(id)) return G.labels.get(id);

function celebrate(card) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const bits = ['♥', '✦', '♥', '✧', '♥', '✦', '♥', '✧'];
  bits.forEach((ch, i) => {
    const e = document.createElement('span');
    e.className = 'fx ' + (ch === '♥' ? 'heart' : 'spark');
    e.textContent = ch;
    e.setAttribute('aria-hidden', 'true');
    e.style.left = (10 + Math.random() * 80) + '%';
    e.style.animationDelay = (i * 0.18) + 's';
    e.style.setProperty('--dx', (Math.random() * 40 - 20).toFixed(0) + 'px');
    card.append(e);
    setTimeout(() => e.remove(), 2600 + i * 180);
  });
}

function makeCard(c) {
  const V = G.V, t = G.P.target;
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.id = c.id;
  const dead = G.dead.has(c.id), u = usesOf(c.id);
  const tired = G.mods.aging && u >= AGE_LIMIT;
  if (fresh.has(c.id)) {
    const d = KID_START + (c.idx || 0) * KID_GAP;
    const winner = match(V, c.p, t);
    b.style.animationDelay = winner ? d + 's, ' + (d + 0.55) + 's' : d + 's';
  }
  b.className = 'slime' + (fresh.has(c.id) ? ' fresh' : '') + (match(V, c.p, t) ? ' hit' : '') + (dead ? ' dead' : tired ? ' tired' : '') + (G.focus === c.id ? ' focus' : '');
  if (fresh.has(c.id) && match(V, c.p, t)) b.classList.add('winner');
  b.style.height = cardH() + 'px';
  b.setAttribute('aria-pressed', G.sel.includes(c.id) ? 'true' : 'false');
  b.setAttribute('aria-label', 'Slime ' + lab(c.id) + ': ' + descrText(V, c.p) + (dead ? tr('aria_dead') : G.mods.aging ? tr('aria_uses', { n: AGE_LIMIT - u }) : ''));
  const isWin = match(V, c.p, t);
  const lastKids = G.crosses.length ? G.crosses[G.crosses.length - 1].kids : [];
  const isSad = G.status === 'lost' && !G.gaveup && lastKids.includes(c.id);
  const sp = sprite(isWin && G.status === 'won' && !fresh.has(c.id) ? Object.assign({}, c.p, { happy: true })
    : isSad && !fresh.has(c.id) ? Object.assign({}, c.p, { sad: true }) : c.p);
  if (isSad && !fresh.has(c.id)) b.classList.add('sad');
  if (isSad && fresh.has(c.id)) {
    const sadAt = KID_START + 3 * KID_GAP + KID_GROW + 0.3 + (c.idx || 0) * 0.35;
    setTimeout(() => { drawSlime(sp, Object.assign({}, c.p, { sad: true })); b.classList.add('wilting'); }, sadAt * 1000);
  }
  if (fresh.has(c.id) && isWin) {
    const jumpAt = KID_START + (c.idx || 0) * KID_GAP + KID_GROW;
    sp.style.animationDelay = jumpAt + 's';
    setTimeout(() => { drawSlime(sp, Object.assign({}, c.p, { happy: true })); celebrate(b); }, jumpAt * 1000);
  }
  b.append(sp);
  const l = document.createElement('span'); l.className = 'lab'; l.textContent = lab(c.id); b.append(l);
  const mk = G.marks[c.id] || {};
  if (EASY) {
    const m = document.createElement('span'); m.className = 'mark';
    let first = true;
    V.genes.forEach((_, i) => {
      const pub = pubGeno(V, c.p, i);
      const picked = mk[i] && mk[i] !== pub;
      if (!EASY && !picked) return;
      if (!first) m.append(' ');
      first = false;
      if (picked) { const s = document.createElement('span'); s.className = 'picked'; s.textContent = mk[i]; m.append(s); }
      else m.append(pub);
    });
    b.append(m);
  }
  if (G.reveal) { const g = document.createElement('span'); g.className = 'geno'; g.textContent = trueGeno(V, c).join(' '); b.append(g); }
  if (dead) { const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = tr('dead'); b.append(tg); }
  else if (G.mods.aging) {
    const us = document.createElement('span'); us.className = 'uses';
    for (let k = 0; k < AGE_LIMIT; k++) { const i = document.createElement('i'); if (k < AGE_LIMIT - u) i.className = 'left'; us.append(i); }
    b.append(us);
  }
  b.addEventListener('click', () => toggle(c.id));
  return b;
}

function cardH() {
  const marks = EASY;
  return 74 + (marks ? 15 : 0) + (G.reveal ? 15 : 0) + (G.mods.aging || G.P.E ? 13 : 0);
}

let TREE_SIZE = { w: 0, h: 0 };
function applyZoom() {
  const host = $('tree'), sizer = host.querySelector('.tree-sizer'), canvas = host.querySelector('.tree-canvas');
  if (!sizer || !canvas || !G) return;
  const z = G.zoom || 1;
  canvas.style.transform = 'scale(' + z + ')';
  sizer.style.width = Math.ceil(TREE_SIZE.w * z) + 'px';
  sizer.style.height = Math.ceil(TREE_SIZE.h * z) + 'px';
}
function setZoom(z) { if (!G) return; G.zoom = Math.max(0.3, Math.min(1.6, z)); applyZoom(); }
function fitZoom() { const w = $('tree').clientWidth - 4; return TREE_SIZE.w ? Math.min(1, w / TREE_SIZE.w) : 1; }

/* Árvore: cada cruzamento é um nó com o número dele; os dois pais descem até ele, e dele saem os 4 filhotes. */
function renderTree() {
  const host = $('tree');
  const relevant = new Set(G.sel);
  if (G.focus) relevant.add(G.focus);
  if (!window.dagre) { renderRows(host); return; }
  const CW = 80, CH = cardH();
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: 'TB', nodesep: 10, ranksep: 30, edgesep: 8, marginx: 4, marginy: 4 });
  g.setDefaultEdgeLabel(() => ({}));
  G.P.starters.forEach(c => g.setNode(c.id, { width: CW, height: CH }));
  G.crosses.forEach((cr, i) => {
    const x = 'x' + i;
    const xt = lab(cr.a) + ' × ' + lab(cr.b);
    g.setNode(x, { width: Math.ceil(22 + xt.length * 7.4), height: 22, cross: i, text: xt });
    g.setEdge(cr.a, x); g.setEdge(cr.b, x);
    cr.kids.forEach(k => { g.setNode(k, { width: CW, height: CH }); g.setEdge(x, k); });
  });
  dagre.layout(g);
  const gw = Math.ceil(g.graph().width), gh = Math.ceil(g.graph().height);
  const canvas = document.createElement('div'); canvas.className = 'tree-canvas';
  canvas.style.width = gw + 'px'; canvas.style.height = gh + 'px';
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'links'); svg.setAttribute('width', gw); svg.setAttribute('height', gh);
  svg.setAttribute('viewBox', '0 0 ' + gw + ' ' + gh); svg.setAttribute('aria-hidden', 'true');
  const hotCross = new Set();
  G.crosses.forEach((cr, i) => { if (relevant.has(cr.a) || relevant.has(cr.b) || cr.kids.some(k => relevant.has(k))) hotCross.add('x' + i); });
  const calm = [], hot = [];
  g.edges().forEach(e => {
    const pts = g.edge(e).points;
    let d = 'M' + pts[0].x + ' ' + pts[0].y;
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
      d += ' Q' + pts[i].x + ' ' + pts[i].y + ' ' + mx + ' ' + my;
    }
    const last = pts[pts.length - 1];
    d += ' L' + last.x + ' ' + last.y;
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', d);
    const isHot = hotCross.has(e.w) ? relevant.has(e.v) || G.crosses[+e.w.slice(1)].kids.some(k => relevant.has(k))
      : hotCross.has(e.v) && (relevant.has(e.w) || relevant.has(G.crosses[+e.v.slice(1)].a) || relevant.has(G.crosses[+e.v.slice(1)].b));
    if (isHot) { path.setAttribute('class', 'hot'); hot.push(path); } else calm.push(path);
  });
  svg.append(...calm, ...hot);
  canvas.append(svg);
  g.nodes().forEach(id => {
    const n = g.node(id);
    if (n.cross !== undefined) {
      const x = document.createElement('div');
      x.className = 'xnode' + (hotCross.has(id) ? ' hot' : '');
      x.style.left = (n.x - n.width / 2) + 'px'; x.style.top = (n.y - n.height / 2) + 'px';
      x.style.width = n.width + 'px'; x.style.height = n.height + 'px';
      x.textContent = n.text;
      x.title = n.text;
      canvas.append(x);
    } else {
      const card = makeCard(C(id));
      card.style.left = (n.x - CW / 2) + 'px'; card.style.top = (n.y - CH / 2) + 'px';
      canvas.append(card);
    }
  });
  const sizer = document.createElement('div'); sizer.className = 'tree-sizer';
  sizer.append(canvas);
  host.replaceChildren(sizer);
  TREE_SIZE = { w: gw, h: gh };
  applyZoom();
}

/* Reserva, se a biblioteca da árvore não carregar: uma linha por geração. */
function renderRows(host) {
  const genOf = new Map(G.P.starters.map(c => [c.id, 0]));
  G.crosses.forEach(cr => { const g = Math.max(genOf.get(cr.a), genOf.get(cr.b)) + 1; cr.kids.forEach(id => genOf.set(id, g)); });
  const max = Math.max(...genOf.values());
  const box = document.createElement('div'); box.className = 'gens';
  for (let g = 0; g <= max; g++) {
    const row = document.createElement('div'); row.className = 'gen-row';
    G.pop.filter(c => genOf.get(c.id) === g).forEach(c => row.append(makeCard(c)));
    box.append(row);
  }
  host.replaceChildren(box);
}

function renderNoteBar() {
  const bar = $('notebar');
  if (!G.focus || !EASY) { bar.hidden = true; bar.replaceChildren(); return; }
  const V = G.V, c = C(G.focus);
  bar.hidden = false;
  const title = document.createElement('span'); title.className = 'nb-title'; title.textContent = tr('genes_of', { x: lab(c.id) });
  const parts = [title];
  V.genes.forEach((L, i) => {
    const wrap = document.createElement('div'); wrap.className = 'gpick';
    const nm = document.createElement('span'); nm.className = 'gname'; nm.textContent = tr('g_' + L); wrap.append(nm);
    const opts = geneOptions(V, c.p, i);
    if (!opts.length) { const f = document.createElement('span'); f.className = 'fixed'; f.textContent = pubGeno(V, c.p, i); wrap.append(f); }
    else {
      const cur = (G.marks[c.id] || {})[i] || opts[0];
      opts.forEach(o => {
        const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = (o === opts[0] && !EASY) ? '?' : o;
        btn.setAttribute('aria-pressed', o === cur ? 'true' : 'false');
        btn.setAttribute('aria-label', tr('g_' + L) + ' · ' + lab(c.id) + ': ' + o);
        btn.addEventListener('click', () => {
          const m = G.marks[c.id] || (G.marks[c.id] = {});
          if (o === opts[0]) delete m[i]; else m[i] = o;
          if (!Object.keys(m).length) delete G.marks[c.id];
          save(); render();
        });
        wrap.append(btn);
      });
    }
    parts.push(wrap);
  });
  bar.replaceChildren(...parts);
}

function renderBar() {
  renderNoteBar();
  const btn = $('btn-cross'), msg = $('msg');
  $('btn-giveup').hidden = G.status !== 'playing' || !!G.autoplay;
  if (G.autoplay && G.status === 'playing') { btn.disabled = true; btn.textContent = tr('cross'); msg.textContent = tr('m_auto', { a: Math.max(1, G.autoStep), b: G.P.path.length }); return; }
  if (G.status !== 'playing') { btn.disabled = true; btn.textContent = tr('cross'); msg.textContent = G.holdEnd ? (G.gaveup ? tr('m_auto_end') : tr('m_hatch')) : (G.status === 'won' ? tr('m_won') : tr(G.reason)) + tr('m_below'); return; }
  if (G.sel.length < 2) {
    btn.disabled = true; btn.textContent = tr('cross');
    msg.textContent = G.sel.length ? tr('m_pick', { x: lab(G.sel[0]) }) : tr('msg_start');
    return;
  }
  const [a, b] = G.sel;
  const pk = pairKey(C(a), C(b));
  const done = G.crosses.some(c => pairKey(C(c.a), C(c.b)) === pk);
  btn.textContent = tr('cross_ab', { a: lab(a), b: lab(b) });
  btn.disabled = done;
  msg.textContent = done ? tr('m_done') : tr('m_left', { n: G.V.max - G.crosses.length });
}

function shareText() {
  const V = G.V, total = V.keys.length;
  const sq = id => { const h = hits(V, C(id).p, G.P.target); return h === total ? '🟩' : h === total - 1 ? '🟨' : '⬜'; };
  const extras = [G.mods.hard ? tr('x_hard') : '', G.mods.aging ? tr('x_aging') : '', G.mods.threat ? tr('x_threat') : '', EASY ? tr('x_easy') : ''].filter(Boolean);
  const head = (G.mode === 'daily' ? tr('sh_daily', { n: G.info.n, nome: vname(V) }) : tr('sh_train', { nome: vname(V) })) + ' ' + (G.status === 'won' ? G.crosses.length : 'X') + '/' + V.max + (extras.length ? ' · ' + extras.join(', ') : '');
  return head + '\n' + G.crosses.map(c => c.kids.map(sq).join('')).join('\n') + '\n' + GAME_URL;
}

function renderEnd() {
  const end = $('end');
  if (G.status === 'playing' || G.holdEnd) { end.hidden = true; end.replaceChildren(); return; }
  end.hidden = false;
  const h = document.createElement('h3');
  const p = document.createElement('p');
  let pathList = null, pathNote = null;
  if (G.status === 'won') {
    const nm = document.createElement('span'); nm.className = 'num'; nm.textContent = G.crosses.length;
    h.append(tr('won_pre'), nm, G.crosses.length === 1 ? tr('won_post1') : tr('won_postn'));
    p.textContent = G.crosses.length <= G.P.par ? tr('e_min') : tr('e_minwas', { n: G.P.par });
  } else {
    h.textContent = G.gaveup ? tr('e_answer') : tr('e_lost');
    p.textContent = G.gaveup ? tr('e_min_path', { n: G.P.par }) : tr(G.reason) + (LANG === 'ja' ? '' : ' ') + tr('e_example', { n: G.P.par });
    pathList = document.createElement('ol'); pathList.className = 'path';
    G.P.path.forEach(pr => { const li = document.createElement('li'); li.textContent = lab(pr[0]) + ' × ' + lab(pr[1]); pathList.append(li); });
    if (G.gaveup) { pathNote = document.createElement('p'); pathNote.textContent = tr('e_others'); }
  }
  const actions = document.createElement('div'); actions.className = 'actions';
  const sh = document.createElement('button'); sh.type = 'button'; sh.className = 'btn primary share';
  const shLabel = document.createElement('span'); shLabel.textContent = tr('copy');
  sh.innerHTML = SHARE_ICON; sh.append(shLabel);
  const rv = document.createElement('button'); rv.type = 'button'; rv.className = 'btn';
  rv.textContent = G.reveal ? tr('hide_genes') : tr('show_genes');
  rv.addEventListener('click', () => { G.reveal = !G.reveal; render(); });
  const box = document.createElement('textarea'); box.className = 'sharebox'; box.id = 'share-box'; box.readOnly = true; box.value = shareText(); box.hidden = true;
  box.setAttribute('aria-label', tr('share_aria'));
  sh.addEventListener('click', () => {
    const txt = shareText();
    const fallback = () => { box.hidden = false; box.focus(); box.select(); shLabel.textContent = tr('selected'); };
    const copy = () => { try { navigator.clipboard.writeText(txt).then(() => { shLabel.textContent = tr('copied'); }, fallback); } catch (e) { fallback(); } };
    /* no celular abre o menu de compartilhar do sistema (WhatsApp etc.); no computador copia */
    const phone = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    if (phone && navigator.share) navigator.share({ text: txt }).catch(e => { if (e && e.name !== 'AbortError') copy(); });
    else copy();
  });
  actions.append(sh, rv);
  if (G.mode === 'train') {
    const nx = document.createElement('button'); nx.type = 'button'; nx.className = 'btn'; nx.textContent = tr('another');
    nx.addEventListener('click', () => startTrain(G.V.id));
    actions.append(nx);
  }
  end.replaceChildren(...[h, p, pathList, pathNote, G.mode === 'daily' ? statsBlock() : null, actions, box].filter(Boolean));
}

function toggle(id) {
  if (G.autoplay) return;
  G.focus = id;
  if (G.status !== 'playing' || !canBreed(id)) {
    G.sel = G.sel.filter(s => s !== id);
    render();
    if (G.status === 'playing') $('msg').textContent = G.dead.has(id) ? tr('m_dead', { x: lab(id) }) : tr('m_tired', { x: lab(id), n: AGE_LIMIT });
    return;
  }
  const i = G.sel.indexOf(id);
  if (i >= 0) G.sel.splice(i, 1);
  else { if (G.sel.length === 2) G.sel.shift(); G.sel.push(id); }
  render();
}

function animateCross(a, b) {
  const before = new Set(fresh);
  doCross(a, b, false);
  G.sel = [];
  const born = [...fresh].filter(id => !before.has(id));
  const last = G.crosses[G.crosses.length - 1];
  const winIdx = last.kids.findIndex(id => match(G.V, C(id).p, G.P.target));
  G.holdEnd = G.status !== 'playing';
  render();
  /* rola até a ninhada nova antes de ela começar a nascer */
  const first = born.length && $('tree').querySelector('[data-id="' + CSS.escape(born[0]) + '"]');
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
  if (G.holdEnd) {
    const waitIdx = G.status === 'won' && winIdx >= 0 ? winIdx : 3;
    const wait = (KID_START + waitIdx * KID_GAP + KID_GROW) * 1000 + (G.status === 'won' ? 1400 : G.gaveup ? 500 : 2600); /* na derrota, espera a última ninhada murchar */
    setTimeout(() => {
      G.holdEnd = false;
      if (G.gaveup) { G.status = 'lost'; G.reason = 'r_gaveup'; G.reveal = true; G.autoplay = false; }
      render();
    }, wait);
  }
}
const LITTER_MS = (KID_START + 3 * KID_GAP + KID_GROW) * 1000;

$('btn-cross').addEventListener('click', () => {
  if (G.sel.length !== 2 || G.status !== 'playing' || G.autoplay) return;
  animateCross(G.sel[0], G.sel[1]);
});

/* Ver resposta: recomeça o tabuleiro e joga sozinho a sequência mais curta, com a animação normal. */
function showAnswer() {
  if (G.mode === 'daily') {
    const st = load(STATS) || { days: {} };
    if (!st.days[G.seedStr]) { st.days[G.seedStr] = { won: false, n: G.crosses.length }; store(STATS, st); }
  }
  newGame(G.mode, G.V, G.seedStr, G.info, null, G.mods, G.mode === 'daily' ? DAILY[G.info.n - 2] : null);
  G.gaveup = true;
  G.autoplay = true;
  G.autoStep = 0;
  save();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  const path = G.P.path;
  const step = () => {
    if (!G.autoplay || G.autoStep >= path.length) return;
    const [a, b] = path[G.autoStep];
    G.autoStep++;
    animateCross(a, b);
    if (G.autoStep < path.length) setTimeout(step, LITTER_MS + 700);
  };
  setTimeout(step, 900);
}

/* ---------- tutorial: seis passos, do experimento do Mendel até uma partida guiada ---------- */
function tsl(cor, chifre) { return { cor: cor.split(''), chifre: chifre ? chifre.split('') : null }; }
function tPhen(s) { return { cor: s.cor.includes('V') ? 'vermelho' : 'azul', chifre: s.chifre ? s.chifre.includes('C') : false, olhos: 2 }; }
function tKids(a, b) {
  const pun = (x, y) => [[x[0], y[0]], [x[0], y[1]], [x[1], y[0]], [x[1], y[1]]];
  const pc = pun(a.cor, b.cor);
  const ph = a.chifre && b.chifre ? pun(a.chifre, b.chifre) : null;
  return [0, 1, 2, 3].map(k => ({ cor: pc[k], chifre: ph ? ph[k] : null }));
}
const TGENES = [
  { k: 'cor', dom: 'vermelho', rec: 'azul', has: s => s.cor.includes('V') },
  { k: 'chifre', dom: 'com chifre', rec: 'sem chifre', has: s => s.chifre.includes('C') },
];

const TSTEPS = [
  { passo: 1, kind: 'cross', text: 't1_text', parents: [tsl('VV'), tsl('vv')], say: 't1_say' },
  { passo: 1, kind: 'cross', text: 'tp_text', parents: [tsl('Vv'), tsl('vv')], say: 'tp_say' },
  { passo: 2, kind: 'cross', text: 't2_text', parents: [tsl('Vv'), tsl('Vv')], say: 't2_say' },
  { passo: 3, kind: 'quiz', text: 't3_text', parents: [tsl('Vv'), tsl('vv')], answer: true, explain: 't3_explain' },
  { passo: 3, kind: 'quiz', text: 't4_text', parents: [tsl('VV'), tsl('vv')], answer: false, explain: 't4_explain' },
  { passo: 4, kind: 'cross', text: 't5_text', parents: [tsl('vv', 'CC'), tsl('VV', 'cc')], say: 't5_say' },
  { passo: 4, kind: 'cross', text: 't6_text', parents: [tsl('Vv', 'Cc'), tsl('Vv', 'Cc')], say: 't6_say' },
  { passo: 4, kind: 'mix', text: 'tm_text', parents: [tsl('Vv', 'Cc'), tsl('Vv', 'Cc')] },
]
const TUT_TOTAL = 4;
let tutStep = 0, tutDone = false, tutAnswer = null, tutMix = null, tutMoved = null;

function chipFor(x, hide) {
  const e = document.createElement('span');
  if (hide) { e.className = 'copy unk'; e.textContent = '?'; return e; }
  e.className = 'copy ' + ({ V: 'red', v: 'blue', C: 'horn', c: 'nohorn' }[x]);
  e.textContent = x;
  return e;
}
function tutCard(sl, o) {
  o = o || {};
  const c = document.createElement(o.button ? 'button' : 'div');
  if (o.button) c.type = 'button';
  c.className = 'tut-card' + (o.picked ? ' picked' : '') + (o.hit ? ' hit' : '');
  c.append(sprite(tPhen(sl)));
  if (o.label) { const l = document.createElement('span'); l.className = 'tut-lab'; l.textContent = o.label; c.append(l); }
  [sl.cor, sl.chifre].filter(Boolean).forEach(pair => {
    const cp = document.createElement('div'); cp.className = 'copies';
    pair.slice().sort().forEach(x => cp.append(chipFor(x, o.hide)));
    c.append(cp);
  });
  return c;
}
function tEl(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function tBtn(text, primary, fn) { const b = tEl('button', 'btn' + (primary ? ' primary' : ''), text); b.type = 'button'; b.addEventListener('click', fn); return b; }
function tNext() { tutStep++; tutDone = false; tutAnswer = null; tutMix = null; tutMoved = null; renderTut(); window.scrollTo({ top: 0 }); }
function parentsRow(S, hideFirst) {
  const row = tEl('div', 'tut-row');
  row.append(tutCard(S.parents[0], { picked: true, hide: hideFirst }), tEl('span', 'tut-x', '×'), tutCard(S.parents[1], { picked: true }));
  return row;
}
function kidsRow(kids, hide, animate) {
  const row = tEl('div', 'tut-row' + (animate ? ' tut-kids' : ''));
  kids.forEach((k, i) => { const c = tutCard(k, { hide }); c.style.animationDelay = (i * 0.5) + 's'; row.append(c); });
  return row;
}

function startTutorial() { tutStep = 0; tutDone = false; tutAnswer = null; tutMix = null; tutMoved = null; renderTut(); }

function renderTut() {
  const S = TSTEPS[tutStep];
  const parts = [tEl('div', 'tut-step-n', tr('step', { n: S.passo, m: TUT_TOTAL }))];
  if (S.kind === 'cross') {
    parts.push(tEl('p', 'tut-text', tr(S.text)), parentsRow(S, false));
    const act = tEl('div', 'tut-actions');
    if (!tutDone) act.append(tBtn(tr('cross'), true, () => { tutDone = true; renderTut(); }));
    else {
      parts.push(kidsRow(tKids(S.parents[0], S.parents[1]), false, true), tEl('p', 'tut-say', tr(S.say)));
      if (tutStep < TSTEPS.length - 1) act.append(tBtn(tr('next'), true, tNext));
      else {
        parts.push(tEl('p', 'tut-text', tr('tut_done')));
        act.append(tBtn(tr('play_daily'), true, () => { startDaily(); show('game'); }), tBtn(tr('back_home'), false, () => show('home')));
        store('slime-tut-feito', true);
      }
    }
    parts.push(act);
  } else if (S.kind === 'quiz') {
    parts.push(tEl('p', 'tut-text', tr(S.text)), parentsRow(S, tutAnswer === null), kidsRow(tKids(S.parents[0], S.parents[1]), tutAnswer === null, tutAnswer === null));
    const act = tEl('div', 'tut-actions');
    if (tutAnswer === null) {
      act.append(tBtn(tr('yes_hides'), true, () => { tutAnswer = true; renderTut(); }), tBtn(tr('no_hides'), false, () => { tutAnswer = false; renderTut(); }));
    } else {
      const ok = tutAnswer === S.answer;
      parts.push(tEl('p', 'tut-say' + (ok ? '' : ' wrong'), (ok ? tr('right') : tr('wrong')) + tr(S.explain)));
      act.append(tBtn(tr('next'), true, tNext));
    }
    parts.push(act);
  } else if (S.kind === 'mix') {
    parts.push(tEl('p', 'tut-text', tr(S.text)), parentsRow(S, false));
    /* começa na mesma ordem da ninhada do passo anterior; cada sorteio embaralha cor e chifre separados */
    if (!tutMix) tutMix = { cor: [0, 1, 2, 3], chifre: [0, 1, 2, 3] };
    const pun = (x, y) => [[x[0], y[0]], [x[0], y[1]], [x[1], y[0]], [x[1], y[1]]];
    const cells = { cor: pun(S.parents[0].cor, S.parents[1].cor), chifre: pun(S.parents[0].chifre, S.parents[1].chifre) };
    const kids = [0, 1, 2, 3].map(k => ({ cor: cells.cor[tutMix.cor[k]], chifre: cells.chifre[tutMix.chifre[k]] }));
    const grid = tEl('div', 'mix-grid');
    [['cor', tr('r_color')], ['chifre', tr('r_horn')]].forEach(([g, label]) => {
      grid.append(tEl('span', 'mix-lab', label));
      kids.forEach(kd => {
        const cell = tEl('div', 'mix-cell' + (tutMoved && tutMoved[g] ? ' moved' : ''));
        const cp = tEl('div', 'copies');
        kd[g].slice().sort().forEach(x => cp.append(chipFor(x)));
        cell.append(cp); grid.append(cell);
      });
    });
    grid.append(tEl('span', 'mix-lab'));
    let blueNoHorn = false;
    kids.forEach(kd => {
      const p = tPhen(kd);
      const hit = p.cor === 'azul' && !p.chifre;
      if (hit) blueNoHorn = true;
      const w = tEl('div', 'mix-slime' + (hit ? ' hit' : ''));
      w.append(sprite(p)); grid.append(w);
    });
    parts.push(grid, tEl('p', 'tut-say', tr('tm_same') + tr(blueNoHorn ? 'tm_yes' : 'tm_no') + tr('tm_fixed')));
    const act = tEl('div', 'tut-actions');
    act.append(tBtn(tr('tm_shuffle'), false, () => {
      const shuf = cur => { let q; do { q = [0, 1, 2, 3]; for (let i = 3; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; } } while (q.join() === cur.join()); return q; };
      tutMix = { cor: shuf(tutMix.cor), chifre: shuf(tutMix.chifre) };
      tutMoved = { cor: true, chifre: true };
      renderTut();
    }));
    if (tutStep < TSTEPS.length - 1) act.append(tBtn(tr('next'), true, tNext));
    else {
      parts.push(tEl('p', 'tut-text', tr('tut_done')));
      act.append(tBtn(tr('play_daily'), true, () => { startDaily(); show('game'); }), tBtn(tr('back_home'), false, () => show('home')));
      store('slime-tut-feito', true);
    }
    parts.push(act);
  }
  $('tut-body').replaceChildren(...parts);
}

$('z-in').addEventListener('click', () => setZoom((G.zoom || 1) * 1.25));
$('z-out').addEventListener('click', () => setZoom((G.zoom || 1) / 1.25));
$('z-fit').addEventListener('click', () => setZoom(fitZoom()));
(() => {
  const pts = new Map(); let start = null;
  const host = $('tree');
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  host.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) start = { d: dist(), z: G.zoom || 1 }; });
  host.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && start && start.d > 0) setZoom(start.z * dist() / start.d);
  });
  const end = e => { pts.delete(e.pointerId); if (pts.size < 2) start = null; };
  host.addEventListener('pointerup', end); host.addEventListener('pointercancel', end); host.addEventListener('pointerleave', end);
  /* impede que a pinça na árvore dê zoom na página inteira (o resultado e o resto ficam no tamanho normal) */
  host.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  let gz = 1;
  host.addEventListener('gesturestart', e => { e.preventDefault(); gz = G ? (G.zoom || 1) : 1; });
  host.addEventListener('gesturechange', e => { e.preventDefault(); if (!pts.size) setZoom(gz * e.scale); });
  host.addEventListener('gestureend', e => e.preventDefault());
})();

$('go-daily').addEventListener('click', () => { startDaily(); show('game'); });
$('go-tut').addEventListener('click', () => { startTutorial(); show('tut'); });
$('go-more').addEventListener('click', () => { startTrain($('variant').value); show('game'); });
$('btn-home').addEventListener('click', () => show('home'));
$('tut-home').addEventListener('click', () => show('home'));
$('btn-tut-again').addEventListener('click', () => { startTutorial(); show('tut'); });

function boot(data) {
  initLang();
  fillVariantSelect();
  EASY = !!load('slime-easy');
  const sm = load('slime-mods') || {};
  $('mod-aging').checked = !!sm.aging; $('mod-threat').checked = !!sm.threat; $('mod-hard').checked = !!sm.hard;
  if (data && data.mode === 'train' && data.seedStr && VARIANTS[data.vid]) { newGame('train', VARIANTS[data.vid], data.seedStr, null, data, data.mods); show('game'); }
  else show('home');
}
boot({});
</script>
