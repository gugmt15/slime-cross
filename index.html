<script>
/* Mudança de endereço: quem abre pelo github.io ou pelo www vai pro slimecross.com levando o que está salvo no navegador
   (tudo que começa com "slime-"), e o slimecross.com importa na chegada sem sobrescrever o que já tiver. */
(function () {
  const NOVO = 'https://slimecross.com/';
  if (location.hostname === 'gugmt15.github.io' || location.hostname === 'www.slimecross.com') {
    const dados = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf('slime-') === 0) dados[k] = localStorage.getItem(k);
      }
    } catch (e) { /* sem armazenamento: vai sem dados */ }
    location.replace(NOVO + (Object.keys(dados).length ? '#importar=' + encodeURIComponent(JSON.stringify(dados)) : ''));
    return;
  }
  const m = location.hash.match(/^#importar=(.+)$/);
  if (!m) return;
  try {
    const dados = JSON.parse(decodeURIComponent(m[1]));
    for (const k in dados) {
      if (k.indexOf('slime-') === 0 && typeof dados[k] === 'string' && localStorage.getItem(k) === null) localStorage.setItem(k, dados[k]);
    }
  } catch (e) { /* dado estragado ou sem armazenamento: segue sem importar */ }
  history.replaceState(null, '', location.pathname + location.search);
})();
</script>

<style>
/* Layout: caderno de laboratório quadriculado; alvo e ameaça no topo, árvore genealógica no meio, barra de anotar e cruzar presa embaixo. */
:root {
  --bg: #edf1ea;
  --grid: #dce5d8;
  --surface: #fafcf8;
  --well: #e4ebe0;
  --ink: #1c2620;
  --muted: #5a6a5f;
  --line: #c6d2c2;
  --accent: #4a8526;
  --accent-ink: #ffffff;
  --danger: #b4432f;
  --near: #d9a514;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101612; --grid: #17201a; --surface: #172019; --well: #2a372e;
    --ink: #e2ebe3; --muted: #97a99c; --line: #2e3c33;
    --accent: #8cc35a; --accent-ink: #0f1a10; --danger: #e8735c; --near: #e6c04a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --near: #e6c04a;
  --bg: #101612; --grid: #17201a; --surface: #172019; --well: #2a372e;
  --ink: #e2ebe3; --muted: #97a99c; --line: #2e3c33;
  --accent: #8cc35a; --accent-ink: #0f1a10; --danger: #e8735c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 20px 0;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; line-height: 1; margin: 0; letter-spacing: 0.01em; }
.sub { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
.sub b { color: var(--ink); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
button, select { font: inherit; }
button { cursor: pointer; }
.btn {
  border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink);
  padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 0.9rem;
}
.btn:hover { background: var(--well); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, summary:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.trainbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px dashed var(--ink); border-radius: 8px; padding: 10px 12px; }
.trainbar label { font-weight: 700; font-size: 0.9rem; }
.trainhelp { flex: 1 1 100%; margin: 0; font-size: 0.85rem; color: var(--muted); }
.trainhelp b { color: var(--ink); }
details.howto ul { margin: 8px 0; padding-left: 1.2em; max-width: 65ch; }
details.howto li { margin-bottom: 4px; }
.trainbar .mods { display: flex; flex-wrap: wrap; gap: 4px 14px; flex: 1 1 100%; font-size: 0.88rem; }
.trainbar .mods label { font-weight: 400; display: flex; gap: 6px; align-items: flex-start; line-height: 1.4; }
.trainbar .mods input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; margin: calc((1.4em - 16px) / 2) 0 0; }
.btn.armed { background: var(--danger); border-color: var(--danger); color: #ffffff; }
.btn.toggle.locked { opacity: 0.55; }
.btn.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.trainbar select { border: 1.5px solid var(--ink); border-radius: 6px; padding: 5px 8px; background: var(--bg); color: var(--ink); min-width: 0; max-width: 100%; }

.target {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center;
  background: var(--surface); border: 2px solid var(--ink); border-radius: 10px; padding: 14px 16px;
  box-shadow: 4px 4px 0 var(--ink);
}
.target .eyebrow { display: inline-block; font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 4px; margin-bottom: 4px; }
.target .tname { font-size: 1.15rem; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.target .well { background: var(--well); border-radius: 8px; padding: 6px; }
.target canvas { width: 96px; height: 96px; display: block; }
.tgeno { margin-top: 6px; font-size: 0.85rem; color: var(--muted); }
.tgeno-tags { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; }
.tgeno-tags .gene { font-size: 0.95rem; }
.threat { grid-column: 1 / -1; border-top: 1.5px dashed var(--line); padding-top: 10px; font-size: 0.92rem; display: flex; gap: 12px; align-items: center; }
.threat b { color: var(--danger); flex: none; }
.threat.done b { color: var(--muted); }
.threat .icons { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.threat .prey.past { opacity: 0.4; }
/* presa da ameaça: o traço desenhado em pixel, com a caveira do lado */
.prey { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.prey canvas, canvas.bicho { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.prey .when { font-family: var(--font-mono); font-weight: 700; font-size: 0.8rem; color: var(--danger); }
.prey .arrow { color: var(--muted); }
.prey .short { font-size: 0.82rem; color: var(--muted); }
.prey .preydead { transform: translateY(2px) scale(1.06, 0.92); transform-origin: 50% 100%; }


.rules-box { display: flex; flex-direction: column; gap: 6px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 12px; }
.winrow { border-top: 2px solid var(--line); padding-top: 6px; min-width: 0; font-size: 0.86rem; }
.winrow.new { border-top-color: var(--accent); }
.wr-title { font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink); font-weight: 600; }
.wr-pair { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px 14px; margin: 4px 0; }
.wr-pair.mix { gap: 6px 8px; }
.wr-pair.mix .mini { min-width: 56px; }
.mini { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; }
.mini canvas { width: 36px; height: 36px; display: block; }
.mini figcaption { font-size: 0.8rem; font-weight: 700; display: flex; gap: 3px; align-items: center; white-space: nowrap; }
.role { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 1px 5px; border-radius: 4px; }
.role.dom { background: var(--accent); color: var(--accent-ink); }
.role.rec { color: var(--muted); border: 1px solid var(--line); }
.mini .gene { font-size: 0.72rem; padding: 0 3px; }
.wr-op { color: var(--muted); }
.wr-note { margin: 0; color: var(--muted); }
.gene, details.howto code, .help code, .tgeno code {
  font-family: var(--font-mono); font-weight: 600; font-size: 0.85em; color: var(--ink);
  border: 1.5px solid var(--ink); border-radius: 4px; background: var(--surface);
  padding: 0 4px; line-height: 1.35; display: inline-block; letter-spacing: 0.04em;
}

details.howto { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
details.howto summary { font-weight: 700; cursor: pointer; }
details.howto p, details.howto ol { margin: 8px 0; max-width: 65ch; }
details.howto li { margin-bottom: 4px; }

h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
h2 small { font-family: var(--font-body); font-size: 0.8rem; color: var(--muted); font-weight: 400; }

.tree { overflow: auto; padding-bottom: 6px; touch-action: pan-x pan-y; }
.tree-sizer { position: relative; margin: 0 auto; }
.tree-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tree-head h2 { margin-bottom: 8px; }
.zoom { display: flex; gap: 4px; }
.zbtn { padding: 2px 10px; font-size: 0.85rem; min-width: 34px; }
.tree-canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.links path { fill: none; stroke: var(--muted); stroke-opacity: 0.55; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.links path.hot { stroke: var(--accent); stroke-opacity: 1; stroke-width: 3; }
.xnode {
  position: absolute; border-radius: 11px; white-space: nowrap; padding: 0 8px;
  background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-weight: 600; font-size: 0.72rem;
  display: flex; align-items: center; justify-content: center;
}

.slime {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 2px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1px; color: var(--ink); min-width: 0;
}
.tree-canvas .slime { position: absolute; width: 80px; }
.slime:hover { border-color: var(--ink); }
.slime[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); background: var(--well); }
.slime.focus { outline: 3px dashed var(--accent); outline-offset: 5px; }
/* pais do slime tocado: brilho verde em volta (o tocado tem o tracejado; o escolhido pra cruzar, a borda cheia) */
.slime.parent { border-color: var(--accent); box-shadow: 0 0 10px 3px color-mix(in srgb, var(--accent) 65%, transparent); }
.slime.parent[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent), 0 0 14px 4px color-mix(in srgb, var(--accent) 65%, transparent); }
.slime canvas { width: 44px; height: 44px; display: block; }
.slime .lab { font-weight: 700; font-size: 0.98rem; line-height: 1.1; }
.slime .mark { font-family: var(--font-mono); font-size: 0.7rem; line-height: 1.2; white-space: nowrap; color: var(--muted); }
.slime .mark .picked { color: var(--accent); font-weight: 600; }
.slime .geno { font-family: var(--font-mono); font-size: 0.7rem; color: var(--accent); font-weight: 600; white-space: nowrap; }
.slime .uses { display: flex; gap: 3px; margin-top: 1px; }
.slime .uses i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink); display: block; }
.slime .uses i.left { background: var(--ink); }
.slime .tag { font-size: 0.66rem; color: var(--danger); font-weight: 700; }
/* quem a próxima ameaça vai matar: a ameaça no canto do cartão */
.slime .risk { position: absolute; top: -10px; right: -10px; background: var(--surface); border: 1.5px solid var(--danger); border-radius: 99px; padding: 2px; line-height: 0; z-index: 2; }
.slime.tired { opacity: 0.6; }
.slime.dead { border-style: dashed; background: color-mix(in srgb, var(--surface) 45%, transparent); border-color: color-mix(in srgb, var(--line) 45%, transparent); }
.slime.dead canvas.sprite, .slime.dead .lab, .slime.dead .tag { opacity: 0.45; }
.slime.fresh { animation: pop 650ms cubic-bezier(0.2, 0.9, 0.3, 1.25) both; }
.slime.near { border-color: var(--near); box-shadow: 0 0 0 2px var(--near); }
.slime.fresh.near { animation: pop 650ms cubic-bezier(0.2, 0.9, 0.3, 1.25) both, nearflash 0.9s ease-in-out 1; }
@keyframes nearflash { 0%, 100% { box-shadow: 0 0 0 2px var(--near); } 50% { box-shadow: 0 0 0 3px var(--near), 0 0 16px 4px var(--near); } }
@media (prefers-reduced-motion: reduce) { .slime.fresh.near { animation: none; } }
/* pai que também está a um traço do alvo: fica a borda amarela, e o brilho verde dos pais vem por fora */
.slime.near.parent, .slime.fresh.near.parent { border-color: var(--near); box-shadow: 0 0 0 2px var(--near), 0 0 0 5px var(--accent), 0 0 16px 6px color-mix(in srgb, var(--accent) 60%, transparent); animation-name: none; }
/* balão de "!" que sai do cartão do filhote quase certo, junto com o susto, e some */
.balao { position: absolute; top: -30px; left: 50%; background: #ffffff; color: #1a1c2c; border: 2px solid #1a1c2c; border-radius: 8px; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1; padding: 3px 9px 4px; pointer-events: none; opacity: 0; animation: balao 1.3s ease-out both; z-index: 3; }
.balao::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 8px; height: 8px; background: #ffffff; border-right: 2px solid #1a1c2c; border-bottom: 2px solid #1a1c2c; transform: translateX(-50%) rotate(45deg); }
@keyframes balao { 0% { opacity: 0; transform: translate(-50%, 8px) scale(0.4); } 15% { opacity: 1; transform: translate(-50%, -4px) scale(1.25); } 25% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -6px); } }
@media (prefers-reduced-motion: reduce) { .balao { animation: none; } }
/* quando o "!" some, um "Quase!" pequeno sobe do mesmo cartão e desaparece */
.quase { position: absolute; top: -22px; left: 50%; white-space: nowrap; background: var(--near); color: #1a1c2c; border: 1.5px solid #1a1c2c; border-radius: 99px; font-family: var(--font-display); font-weight: 700; font-size: 0.78rem; line-height: 1; padding: 2px 7px 3px; pointer-events: none; opacity: 0; animation: quase 1.7s ease-out both; z-index: 3; }
@keyframes quase { 0% { opacity: 0; transform: translate(-50%, 6px) scale(0.7); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 25% { transform: translate(-50%, 0) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -16px); } }
@media (prefers-reduced-motion: reduce) { .quase { animation: none; } }
/* susto do filhote quase certo: pulo rápido esticando e aterrissagem achatada */
.slime canvas.sprite.surprise { animation: surprise 0.6s ease-out 1, bob 1.4s ease-in-out 0.6s infinite; }
@keyframes surprise { 0% { transform: scale(1.14, 0.86); } 30% { transform: translateY(-12px) scale(0.88, 1.14); } 55% { transform: translateY(-9px) scale(0.95, 1.06); } 80% { transform: translateY(0) scale(1.12, 0.88); } 100% { transform: translateY(0) scale(1); } }
@media (prefers-reduced-motion: reduce) { .slime canvas.sprite.surprise { animation: none; } }
.slime.hit { border-color: var(--accent); background: var(--well); box-shadow: 0 0 0 2px var(--accent), 0 0 14px 2px var(--accent); }
.slime.fresh.winner { animation: pop 650ms cubic-bezier(0.2, 0.9, 0.3, 1.25) both, shine 0.9s ease-in-out 3; }
.slime.fresh.winner canvas.sprite { animation: jump 0.55s ease-in-out 4 both; }
@keyframes jump { 0%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(0) scale(1.15, 0.85); } 50% { transform: translateY(-14px) scale(0.92, 1.1); } 85% { transform: translateY(0) scale(1.1, 0.9); } }
.slime { position: relative; }
.fx { position: absolute; top: 30%; font-size: 1rem; pointer-events: none; animation: floatup 1.6s ease-out both; z-index: 2; }
.fx.heart { color: #ff6f91; }
.fx.spark { color: #f2c230; }
@keyframes floatup { 0% { transform: translate(0, 0) scale(0.4); opacity: 0; } 15% { opacity: 1; transform: translate(0, -6px) scale(1.1); } 100% { transform: translate(var(--dx), -56px) scale(0.8); opacity: 0; } }
.slime.sad canvas.sprite { animation: sob 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
/* chorando: murcho, respira devagar e de vez em quando soluça */
@keyframes sob { 0%, 100% { transform: translateY(3px) scale(1.08, 0.88); } 30% { transform: translateY(2px) scale(1.05, 0.91); } 55% { transform: translateY(3px) scale(1.08, 0.88); } 62% { transform: translateY(1px) scale(1.04, 0.93); } 68% { transform: translateY(3px) scale(1.09, 0.87); } 74% { transform: translateY(1px) scale(1.04, 0.93); } 80% { transform: translateY(3px) scale(1.08, 0.88); } }
.slime.wilting canvas.sprite { animation: wilt 1.1s ease-in-out both, sob 2.6s ease-in-out 1.1s infinite; transform-origin: 50% 100%; }
@keyframes wilt { 0% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(4px) scale(1.14, 0.8); } 70% { transform: translateY(2px) scale(1.05, 0.92); } 100% { transform: translateY(3px) scale(1.08, 0.88); } }
@keyframes shine { 0%, 100% { box-shadow: 0 0 0 2px var(--accent), 0 0 10px 2px var(--accent); } 50% { box-shadow: 0 0 0 3px var(--accent), 0 0 28px 10px var(--accent); } }
@keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
/* slime escolhido: dá um pulinho achatando, e depois volta a balançar */
.slime canvas.sprite.pick { animation: pick 0.5s ease-out 1, bob 1.4s ease-in-out 0.5s infinite; }
@keyframes pick { 0% { transform: scale(1.16, 0.84); } 40% { transform: translateY(-8px) scale(0.92, 1.1); } 70% { transform: translateY(0) scale(1.08, 0.92); } 100% { transform: translateY(0) scale(1); } }
@media (prefers-reduced-motion: reduce) { .slime canvas.sprite.pick { animation: none; } }
canvas.sprite.winged { width: auto !important; }
canvas.sprite { image-rendering: pixelated; image-rendering: crisp-edges; animation: bob 1.4s ease-in-out infinite; transform-origin: 50% 100%; }
.atk { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; }
.atk-x .atk-e, .atk-sol { display: inline-block; line-height: 1; }
.atk canvas { width: 40px; height: 40px; }
.atk-sol canvas { width: 56px; height: 56px; filter: drop-shadow(0 0 10px #f2c230); }
.atk-vento { height: 3px; width: 60px; background: #b7c3df; border-radius: 2px; }
.slime canvas.sprite.voa { animation: voa 0.9s ease-in both; }
@keyframes voa { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(120px, -60px) rotate(160deg); opacity: 0; } }
.slime canvas.sprite.tonto { animation: tonto 1s ease-in-out both; transform-origin: 50% 50%; }
@keyframes tonto { 0% { transform: translate(0, 0) rotate(0); } 45% { transform: translate(6px, -22px) rotate(200deg); } 80% { transform: translate(0, -10px) rotate(360deg); } 100% { transform: translate(0, 0) rotate(360deg); } }
.slime.levado canvas.sprite { visibility: hidden; }
.slime canvas.sprite.morre { animation: wilt 1.2s ease-in-out both; transform-origin: 50% 100%; }

/* Campanha: a trilha dos capítulos */
.camp-total { margin: 0; font-family: var(--font-display); font-size: 1rem; color: var(--near); }
.camp-list { display: flex; flex-direction: column; gap: 10px; }
.ch-card { display: grid; grid-template-columns: 56px 1fr; grid-template-rows: auto auto; column-gap: 12px; row-gap: 8px; align-items: center; border: 2px solid var(--ink); border-radius: 10px; background: var(--surface); padding: 10px 12px; box-shadow: 3px 3px 0 var(--ink); }
.ch-card { grid-template-columns: 76px 1fr; }
.ch-art { grid-row: 1 / 3; width: 76px; height: 62px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; align-content: center; gap: 2px 4px; }
.ch-art .it { position: relative; display: flex; }
.ch-art canvas { width: auto; image-rendering: pixelated; }
.ch-art.cover { border: 2px solid var(--ink); border-radius: 10px; position: relative; overflow: hidden; }
.ch-art.cover .num { position: absolute; right: 4px; bottom: -8px; font-size: 2rem; color: rgba(255, 255, 255, 0.2); pointer-events: none; }
.ch-art.cover.grid { display: grid; grid-template-columns: 1fr 1fr; justify-items: center; align-items: center; padding: 4px 6px; }
.ch-art.cover.scatter .it { position: absolute; }
.ch-art .it i { position: absolute; right: -6px; top: -4px; font-style: normal; font-size: 0.75rem; font-weight: 700; background: var(--ink); color: var(--surface); border-radius: 4px; padding: 0 4px; }
.ch-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.ch-head b { font-family: var(--font-display); font-weight: 400; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-head small { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
.ch-phases { display: flex; gap: 6px; }
.ph { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 4px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; font-size: 0.8rem; font-weight: 700; }
.ph .stars { font-size: 0.85rem; letter-spacing: 1px; color: var(--near); }
.ph .stars .off { color: var(--line); }
.ph.full { border-color: var(--near); }
.ph:active { transform: translate(1px, 1px); }
.ch-card.locked { opacity: 0.5; box-shadow: none; border-style: dashed; }
.ch-card.locked .ph, .ph.shut { cursor: not-allowed; }
.ph.shut { opacity: 0.45; border-style: dashed; }
.ch-card.locked .ch-art { filter: grayscale(1); }
/* fim da fase: as estrelas grandes */
.end-stars { font-size: 2rem; letter-spacing: 4px; color: var(--near); margin: 4px 0 8px; }
.end-stars .off { color: var(--line); }
[hidden] { display: none !important; }
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
</style>
</head>

const LANGS = ['pt', 'en', 'ja'];
const I18N = {"title":["Slime Cross","Slime Cross","スライムクロス"],"home_tag":["Cruze slimes, descubra os genes escondidos e faça nascer o slime do dia!","Cross slimes, uncover their hidden genes and hatch the slime of the day!","スライムを交配して、かくれた遺伝子を見つけ、今日のスライムを生み出そう!"],"go_daily":["Desafio do dia","Daily challenge","今日のチャレンジ"],"start_here":["comece aqui","start here","ここから"],"tutorial":["Tutorial","Tutorial","チュートリアル"],"tut_sub":["aprenda como funciona em dois minutos","learn how it works in two minutes","2分で遊び方がわかる"],"more":["Outros modos","Other modes","ほかのモード"],"more_sub":["2, 3 ou 4 genes, roxo, transparente e modos especiais","2, 3 or 4 genes, purple, transparent and special modes","遺伝子2〜4つ、紫、透明、特別モード"],"home_btn":["← Início","← Home","← ホーム"],"new":["Novo desafio","New challenge","新しいチャレンジ"],"easy":["Ativar anotações","Enable notes","メモを使う"],"reset":["Recomeçar","Restart","やり直す"],"reset_confirm":["Toque de novo para recomeçar","Tap again to restart","もう一度タップでやり直す"],"version":["Versão","Version","バージョン"],"trainhelp":["Todas com 8 cruzamentos. <b>2 genes</b>, só cor e chifre, pra começar; <b>3 genes</b>, o do desafio do dia; <b>4 genes</b>, entram as asas, com desafios escolhidos pra ser difíceis; <b>Roxo</b>, vermelho com azul dá roxo; <b>Transparente</b>, um gene esconde a cor; <b>Roxo e transparente</b>, as duas juntas. Os modos especiais deixam mais difícil:","All with 8 crosses. <b>2 genes</b>, just color and horn, to start; <b>3 genes</b>, the one in the daily challenge; <b>4 genes</b>, wings join in, with challenges picked to be hard; <b>Purple</b>, red with blue makes purple; <b>Transparent</b>, one gene hides the color; <b>Purple and transparent</b>, both together. Special modes make it harder:","どれも交配は8回まで。<b>遺伝子2つ</b>:色と角だけ。はじめにどうぞ。<b>遺伝子3つ</b>:今日のチャレンジと同じ。<b>遺伝子4つ</b>:翼が加わり、むずかしい問題だけ。<b>紫</b>:赤と青で紫になる。<b>透明</b>:ある遺伝子が色をかくす。<b>紫と透明</b>:両方いっしょ。特別モードで難しくなります:"],"mods_aria":["Modos especiais","Special modes","特別モード"],"mod_aging":["Envelhecer: cada slime cruza só 2 vezes","Aging: each slime can only cross twice","老化:スライムは2回までしか交配できない"],"mod_threat":["Ameaça: depois do 2º cruzamento, morrem todos os slimes com uma das aparências do alvo, avisada no quadro do alvo (por exemplo, todos os sem chifre). Quem só esconde o traço escapa.","Threat: after the 2nd cross, every slime with one of the target's looks dies, announced in the target box (for example, every hornless one). Those that only hide the trait survive.","天敵:2回目の交配のあと、目標の見た目のうち、目標の欄で予告されたもの(たとえば角なし)をもつスライムが全部やられる。特徴をかくしているだけのスライムは助かる。"],"mod_hard":["Escondido: o gene que o alvo pede pode estar escondido nos iniciais","Hidden: the gene the target needs may be hidden in the starting slimes","かくれ:目標に必要な遺伝子が最初のスライムにかくれていることがある"],"target_aria":["Alvo","Target","目標"],"target_today":["Alvo de hoje","Today's target","今日の目標"],"target":["Alvo","Target","目標"],"target_genes":["Genes do alvo:","Target genes:","目標の遺伝子:"],"threat":["Ameaça","Threat","天敵"],"rules_sum":["Dominante e recessivo","Dominant and recessive","顕性と潜性"],"howto_sum":["Como jogar","How to play","遊び方"],"howto":["<li>Cada slime tem <b>duas cópias</b> de cada gene, uma de cada pai. A <b>dominante</b> aparece; a <b>recessiva</b> fica escondida e pode voltar nos filhos.</li><li>Toque em dois slimes e aperte <b>Cruzar</b>. Nascem sempre 4 filhotes, e cada traço sai na <b>proporção exata</b>: dois vermelhos que escondem azul dão 3 vermelhos e 1 azul.</li><li>Já <b>quais traços vão juntos</b> no mesmo filhote é sorteado, como na natureza. Por isso uma combinação possível pode não nascer. O sorteio é igual para todo mundo, e o mesmo par dá sempre a mesma ninhada.</li><li>Os filhotes entram na árvore e podem ser cruzados com qualquer slime, <b>até com o próprio pai ou mãe</b>. Você tem 8 cruzamentos para fazer nascer o alvo.</li><li>Todo desafio precisa de <b>pelo menos 3 cruzamentos</b>: o alvo junta traços de slimes diferentes, e isso leva duas gerações.</li><li>O que o alvo pede sempre aparece à vista em algum dos slimes iniciais. Dá para descobrir os genes escondidos só deduzindo.</li><li>O botão <b>Ativar anotações</b> mostra as letras dos genes embaixo de cada slime e permite marcar palpites. <code>V_</code> quer dizer “tem um V, e a outra letra ainda não se sabe”.</li><li>Filhote com <b>borda amarela</b> está a um traço do alvo.</li>","<li>Each slime has <b>two copies</b> of each gene, one from each parent. The <b>dominant</b> one shows; the <b>recessive</b> one stays hidden and can come back in the offspring.</li><li>Tap two slimes and press <b>Cross</b>. You always get 4 offspring, and each trait comes out in the <b>exact ratio</b>: two reds that hide blue give 3 red and 1 blue.</li><li><b>Which traits go together</b> in the same offspring, though, is random, like in nature. So a possible combination may not hatch. The draw is the same for everyone, and the same pair always gives the same litter.</li><li>The offspring join the tree and can be crossed with any slime, <b>even their own parent</b>. You have 8 crosses to hatch the target.</li><li>Every challenge needs <b>at least 3 crosses</b>: the target combines traits from different slimes, and that takes two generations.</li><li>Whatever the target needs always shows up in one of the starting slimes. You can figure out the hidden genes by deduction alone.</li><li><b>Enable notes</b> shows the gene letters under each slime and lets you mark your guesses. <code>V_</code> means “it has a V, and the other letter is still unknown”.</li><li>An offspring with a <b>yellow border</b> is one trait away from the target.</li>","<li>スライムはそれぞれの遺伝子を<b>2つ</b>持っていて、親から1つずつもらいます。<b>顕性</b>のほうが見た目に出て、<b>潜性</b>のほうはかくれたまま、子どもで現れることがあります。</li><li>スライムを2匹タップして<b>交配</b>を押します。子どもはいつも4匹で、それぞれの特徴は<b>ぴったりの割合</b>で生まれます。青をかくした赤どうしなら、赤3匹と青1匹です。</li><li>ただし、<b>どの特徴が同じ子にそろうか</b>は、自然と同じようにランダムです。だから、ありえる組み合わせが生まれないこともあります。結果はみんな同じで、同じペアからはいつも同じ子どもが生まれます。</li><li>子どもは家系図に加わり、どのスライムとも交配できます。<b>自分の親とも</b>交配できます。目標を生み出すまでに使える交配は8回です。</li><li>どのチャレンジも<b>3回以上の交配</b>が必要です。目標はちがうスライムの特徴を組み合わせたもので、2世代かかります。</li><li>目標に必要な特徴は、最初のスライムのどれかに必ず見えています。かくれた遺伝子は推理だけで見つけられます。</li><li><b>メモを使う</b>をオンにすると、スライムの下に遺伝子の文字が出て、予想をメモできます。<code>V_</code>は「Vを1つ持っていて、もう1つはまだわからない」という意味です。</li><li><b>黄色のふち</b>の子どもは、目標まであと特徴1つです。</li>"],"tut_again":["Rever o tutorial","Replay the tutorial","チュートリアルをもう一度"],"tree":["Árvore da família","Family tree","家系図"],"zoom_aria":["Zoom da árvore","Tree zoom","家系図のズーム"],"z_out":["Afastar","Zoom out","縮小"],"z_in":["Aproximar","Zoom in","拡大"],"z_fit":["Ver tudo","Fit","全体"],"footer":["Mendel chegou nessas regras cruzando ervilhas no jardim do mosteiro de Brno, entre 1856 e 1863. A cor intermediária e o gene que esconde outro foram entendidos depois dele, no começo do século 20.","Mendel found these rules by crossing peas in the garden of the abbey in Brno, between 1856 and 1863. Intermediate colors and genes that hide other genes were understood after him, in the early 20th century.","メンデルは1856年から1863年にかけて、ブルノの修道院の庭でエンドウを交配して、この法則を見つけました。中間の色や、ほかの遺伝子をかくす遺伝子がわかったのは、20世紀のはじめになってからです。"],"msg_start":["Toque em dois slimes para cruzar.","Tap two slimes to cross them.","スライムを2匹タップして交配しよう。"],"pips_aria":["Cruzamentos usados","Crosses used","使った交配"],"cross":["Cruzar","Cross","交配"],"cross_ab":["Cruzar {a} × {b}","Cross {a} × {b}","{a} × {b}を交配"],"giveup":["Ver resposta","Show answer","答えを見る"],"giveup_confirm":["Tem certeza? Toque de novo","Sure? Tap again","本当に? もう一度タップ"],"v_classico":["3 genes","3 genes","遺伝子3つ"],"v_roxo":["Roxo","Purple","紫"],"v_transparente":["Transparente","Transparent","透明"],"v_mistura":["Roxo e transparente","Purple and transparent","紫と透明"],"v_option":["{nome} ({n} cruzamentos)","{nome} ({n} crosses)","{nome}(交配{n}回)"],"days":[["domingo","segunda","terça","quarta","quinta","sexta","sábado"],["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],["日曜","月曜","火曜","水曜","木曜","金曜","土曜"]],"g_V":["Cor","Color","色"],"g_C":["Chifre","Horn","角"],"g_E":["Olhos","Eyes","目"],"g_T":["Transp.","Transp.","透明"],"g_A":["Asas","Wings","翼"],"c_vermelho":["vermelho","red","赤"],"c_azul":["azul","blue","青"],"c_roxo":["roxo","purple","紫"],"c_transparente":["transparente","transparent","透明"],"horn_y":["com chifre","horned","角あり"],"horn_n":["sem chifre","no horn","角なし"],"eyes_2":["dois olhos","two eyes","目が2つ"],"eyes_1":["um olho","one eye","目が1つ"],"wings_y":["com asas","winged","翼あり"],"wings_n":["sem asas","no wings","翼なし"],"wing_y":["com asa","winged","翼あり"],"wing_n":["sem asa","no wings","翼なし"],"normal":["normal","normal","ふつう"],"r_color":["Cor","Color","色"],"r_horn":["Chifre","Horn","角"],"r_eyes":["Olhos","Eyes","目"],"r_trans":["Transparência","Transparency","透明度"],"r_wings":["Asas","Wings","翼"],"rn_mix":["Nenhuma é dominante: uma de cada dá roxo.","Neither is dominant: one of each makes purple.","どちらも顕性ではなく、1つずつだと紫になる。"],"rn_color":["Só {{vv}} é azul. Um vermelho pode esconder azul.","Only {{vv}} is blue. A red one can hide blue.","{{vv}}だけが青。赤いスライムが青をかくしていることもある。"],"rn_horn":["Só {{cc}} nasce sem chifre.","Only {{cc}} is born without a horn.","{{cc}}だけが角なしで生まれる。"],"rn_eyes":["Só {{ee}} nasce com um olho.","Only {{ee}} is born with one eye.","{{ee}}だけが目が1つで生まれる。"],"rn_trans":["Só {{tt}} fica transparente, e esconde a cor que carrega.","Only {{tt}} turns transparent, hiding the color it carries.","{{tt}}だけが透明になり、持っている色がかくれる。"],"rn_wings":["Só {{aa}} nasce com asas.","Only {{aa}} is born with wings.","{{aa}}だけが翼をもって生まれる。"],"dom":["dominante","dominant","顕性"],"rec":["recessivo","recessive","潜性"],"ev_olhos":["um gavião leva todo slime de um olho, que não vê ele chegando","a hawk takes every one-eyed slime, since they can't see it coming","タカが目が1つのスライムを全部さらっていく(近づいても見えないから)"],"ev_chifre":["um urso come todo slime sem chifre, que não tem como se defender","a bear eats every hornless slime, since they can't defend themselves","クマが角のないスライムを全部食べてしまう(身を守れないから)"],"ev_azul":["um sol forte derrete todo slime azul","a scorching sun melts every blue slime","強い日差しで青いスライムが全部とけてしまう"],"ev_asas":["uma ventania derruba todo slime de asa","a gale knocks down every winged slime","強風で翼のあるスライムが全部たおれる"],"who_olhos":["O gavião","The hawk","タカ"],"who_chifre":["O urso","The bear","クマ"],"who_azul":["O sol","The sun","日差し"],"who_asas":["A ventania","The gale","強風"],"threat_before":["depois do {n}º cruzamento, {txt}.","after cross {n}, {txt}.","{n}回目の交配のあと、{txt}。"],"threat_after1":["{who} passou depois do {n}º cruzamento: 1 slime não sobreviveu.","{who} came after cross {n}: 1 slime did not survive.","{n}回目の交配のあと{who}が来た:1匹がやられた。"],"threat_aftern":["{who} passou depois do {n}º cruzamento: {k} slimes não sobreviveram.","{who} came after cross {n}: {k} slimes did not survive.","{n}回目の交配のあと{who}が来た:{k}匹がやられた。"],"r_out":["Acabaram os cruzamentos.","You ran out of crosses.","交配の回数がなくなった。"],"r_nopair":["Não sobrou nenhum par que ainda possa cruzar.","No pair left that can still cross.","交配できるペアが残っていない。"],"r_gaveup":["Resposta mostrada.","Answer shown.","答えを表示しました。"],"s_played":["jogados","played","プレイ"],"s_wins":["% vitórias","% wins","% 勝利"],"s_streak":["sequência","streak","連勝"],"s_best":["melhor sequência","best streak","最高連勝"],"s_title":["Cruzamentos usados em cada desafio do dia:","Crosses used in each daily challenge:","今日のチャレンジで使った交配の回数:"],"kid_of":["filhote de {a} × {b}","offspring of {a} × {b}","{a} × {b}の子"],"sub_daily":["nº {n} · {dia} · ","No. {n} · {dia} · ","第{n}回・{dia}・"],"sub_train":["treino · {nome}","practice · {nome}","練習・{nome}"],"count":["{n} slimes","{n} slimes","{n}匹"],"aria_dead":[", morto",", gone","、もういない"],"aria_uses":[", pode cruzar mais {n} vezes",", can cross {n} more times","、あと{n}回交配できる"],"dead":["morto","dead","死亡"],"genes_of":["Genes de {x}:","Genes of {x}:","{x}の遺伝子:"],"m_auto":["Mostrando uma resposta possível: cruzamento {a} de {b}...","Showing a possible answer: cross {a} of {b}...","答えの一つを再生中:交配 {a}/{b}…"],"m_auto_end":["Mostrando uma resposta possível...","Showing a possible answer...","答えの一つを再生中…"],"m_hatch":["Nascendo...","Hatching...","誕生中…"],"quase_0":["Quase!","Almost!","おしい!"],"quase_1":["Tá perto!","So close!","あと少し!"],"quase_2":["Por pouco!","Close one!","もうちょい!"],"m_won":["Nasceu o alvo!","The target was born!","目標が生まれた!"],"m_below":[" O resultado está mais abaixo."," The result is further down."," 結果は下にあります。"],"m_pick":["Escolha mais um slime ({x} selecionado).","Pick one more slime ({x} selected).","もう1匹えらんで({x}を選択中)。"],"m_done":["Esse par já foi cruzado, e a ninhada é sempre a mesma. Escolha outro par.","This pair was already crossed, and it always gives the same litter. Pick another pair.","このペアはもう交配済みで、いつも同じ子どもが生まれる。別のペアをえらぼう。"],"m_left":["Restam {n} cruzamentos.","{n} crosses left.","残り{n}回。"],"m_dead":["{x} morreu e não cruza mais.","{x} is gone and can't cross anymore.","{x}はもういないので交配できない。"],"m_tired":["{x} já cruzou {n} vezes e não cruza mais.","{x} already crossed {n} times and can't cross anymore.","{x}はもう{n}回交配したので、これ以上できない。"],"sh_daily":["Slime Cross nº {n} ({nome})","Slime Cross No. {n} ({nome})","スライムクロス 第{n}回({nome})"],"sh_train":["Slime Cross · {nome}","Slime Cross · {nome}","スライムクロス・{nome}"],"x_hard":["escondido","hidden","かくれ"],"x_aging":["envelhecer","aging","老化"],"x_threat":["ameaça","threat","天敵"],"x_easy":["anotações","notes","メモ"],"won_pre":["Você conseguiu em ","You did it in ",""],"won_post1":[" cruzamento!"," cross!","回の交配で成功!"],"won_postn":[" cruzamentos!"," crosses!","回の交配で成功!"],"e_min":["Isso é o mínimo possível para este desafio.","That is the minimum for this challenge.","これがこのチャレンジの最少回数です。"],"e_minwas":["O mínimo possível era {n}.","The minimum was {n}.","最少は{n}回でした。"],"e_answer":["Uma resposta possível","A possible answer","答えの一つ"],"e_lost":["Não foi dessa vez","Not this time","今回はざんねん"],"e_example":["O mínimo é {n} cruzamentos, por exemplo:","The minimum is {n} crosses, for example:","最少は{n}回、たとえば:"],"copy":["Compartilhar","Share","シェア"],"copied":["Copiado","Copied","コピーしました"],"selected":["Selecionado, é só copiar","Selected, just copy it","選択したのでコピーしてね"],"hide_genes":["Esconder genes","Hide genes","遺伝子をかくす"],"show_genes":["Mostrar genes","Show genes","遺伝子を見る"],"another":["Outro desafio","Another challenge","別のチャレンジ"],"share_aria":["Resultado para compartilhar","Result to share","シェア用の結果"],"h_won":["nº {n} · resolvido em {m} ✓","No. {n} · solved in {m} ✓","第{n}回・{m}回で成功 ✓"],"h_lost":["nº {n} · não foi dessa vez","No. {n} · not this time","第{n}回・ざんねん"],"h_going":["nº {n} · em andamento","No. {n} · in progress","第{n}回・挑戦中"],"h_new":["nº {n} · até 8 cruzamentos","No. {n} · up to 8 crosses","第{n}回・交配は8回まで"],"step":["Passo {n} de {m}","Step {n} of {m}","ステップ {n}/{m}"],"next":["Próximo","Next","次へ"],"yes_hides":["Sim, esconde azul","Yes, it hides blue","はい、青をかくしている"],"no_hides":["Não esconde","No, it doesn't","いいえ、かくしていない"],"right":["Isso! ","Right! ","正解! "],"wrong":["Não é bem assim. ","Not quite. ","ちょっとちがう。"],"tut_done":["Pronto! No desafio do dia o alvo tem três traços (cor, chifre e olhos) e você tem 8 cruzamentos para fazer ele nascer. Se precisar de ajuda, toque em Ativar anotações: aparecem as letras dos genes embaixo de cada slime.","That's it! In the daily challenge the target has three traits (color, horn and eyes), and you have 8 crosses to hatch it. If you need help, tap Enable notes: it shows the gene letters under each slime.","これで準備完了! 今日のチャレンジでは目標に3つの特徴(色・角・目)があり、8回の交配で生み出します。困ったら「メモを使う」をオンにすると、スライムの下に遺伝子の文字が出ます。"],"play_daily":["Jogar o desafio do dia","Play the daily challenge","今日のチャレンジをあそぶ"],"back_home":["Voltar ao início","Back to home","ホームにもどる"],"t1_text":["Todo slime tem duas cópias do gene da cor: uma veio do pai e a outra da mãe. Este vermelho tem duas cópias vermelhas. Este azul tem duas cópias azuis. O que será que vai nascer se cruzar os dois?","Every slime has two copies of the color gene: one from each parent. This red one has two red copies. This blue one has two blue copies. What do you think will hatch if you cross them?","スライムは色の遺伝子を2つ持っていて、親から1つずつもらいます。この赤いスライムは赤を2つ、この青いスライムは青を2つ持っています。この2匹を交配すると、何が生まれるかな?"],"t1_say":["Os quatro nasceram vermelhos! Cada filhote pegou uma cópia de cada pai: uma vermelha e uma azul. Vermelho é dominante e azul é recessivo, então o azul ficou escondido dentro deles.","All four came out red! Each one got a copy from each parent: one red and one blue. Red is dominant and blue is recessive, so the blue stayed hidden inside them.","4匹とも赤で生まれた! どの子も親から1つずつ、赤と青をもらいました。赤が顕性で青が潜性なので、青は中にかくれています。"],"tp_text":["Também dá para cruzar um filhote com o próprio pai ou mãe. Cruze um desses filhotes vermelhos com o pai azul.","You can also cross an offspring with its own father or mother. Cross one of those red offspring with the blue parent.","子どもを自分の親と交配することもできます。赤い子どもの1匹を、青い親と交配しよう。"],"tp_say":["Metade saiu azul! O filhote deu a cópia azul que escondia, e o pai azul deu outra. Dá para cruzar qualquer par da árvore, até filho com pai ou mãe, e às vezes esse é o caminho mais curto até o alvo.","Half came out blue! The offspring gave the blue copy it was hiding, and the blue parent gave another. You can cross any pair in the tree, even a child with its parent, and sometimes that is the shortest way to the target.","半分が青になった! 子どもがかくしていた青を1つ、青い親がもう1つわたしたんだ。家系図のどのペアでも交配できて、親子どうしでもOK。それが目標へのいちばんの近道になることもある。"],"tm_text":["Destes pais pode nascer um azul sem chifre, mas o jogo não garante isso. Cada coluna é um filhote. A cor e o chifre são distribuídos separados, cada um numa ordem sorteada.","These parents can have a blue hornless offspring, but the game doesn't guarantee it. Each column is one offspring. Color and horn are handed out separately, each in a random order.","この親からは青で角なしの子が生まれることもありますが、ゲームはそれを約束しません。1列が子ども1匹です。色と角は別々に、それぞれランダムな順番で配られます。"],"tm_shuffle":["Trocar os chifres de lugar","Swap the horns around","角を入れかえる"],"tm_same":["O jogo garante a proporção de cada traço: sempre nasce 1 azul e sempre nasce 1 sem chifre. Não garante que sejam o mesmo filhote.","The game guarantees the ratio of each trait: there is always 1 blue and always 1 hornless. It doesn't guarantee they are the same offspring.","ゲームが約束するのは特徴ごとの割合です。青は必ず1匹、角なしも必ず1匹生まれます。でも、同じ子とはかぎりません。"],"tm_yes":["Aqui eles caíram juntos: nasceu um azul sem chifre.","Here they landed together: a blue hornless one hatched.","今回は同じ子にそろったので、青で角なしが生まれた。"],"tm_no":["Aqui eles caíram em filhotes diferentes: o azul sem chifre não nasceu, mesmo sendo possível.","Here they landed on different offspring: no blue hornless one hatched, even though it was possible.","今回は別々の子に分かれたので、青で角なしは生まれなかった。ありえる組み合わせなのに。"],"tm_fixed":["Por isso os 4 filhotes nem sempre mostram todas as combinações possíveis. No jogo, essa ordem é sorteada uma vez por par e é igual para todo mundo.","That's why the 4 offspring don't always show every possible combination. In the game, this order is drawn once for each pair and is the same for everyone.","だから、4匹の子どもがありえる組み合わせを全部見せるとはかぎりません。ゲームでは、この順番はペアごとに1回だけ決まり、みんな同じです。"],"t2_text":["Agora cruze dois desses filhotes. Por fora são vermelhos, mas cada um esconde uma cópia azul.","Now cross two of these offspring. They look red, but each one hides a blue copy.","次はこの子どもを2匹交配しよう。見た目は赤でも、どちらも青を1つかくしています。"],"t2_say":["Nasceu um azul! Ele pegou a cópia azul escondida de cada pai. Um traço pode sumir numa geração e voltar na seguinte. Foi isso que o Mendel viu cruzando ervilhas.","A blue one hatched! It got the hidden blue copy from each parent. A trait can vanish in one generation and come back in the next. That is what Mendel saw crossing peas.","青が生まれた! 両方の親から、かくれていた青を1つずつもらったんだ。特徴はある世代で消えて、次の世代でもどってくることがある。メンデルがエンドウの交配で見たのはこれです。"],"t3_text":["Sua vez. No jogo não dá para ver as cópias, só a aparência. Este vermelho cruzou com um azul e teve estes quatro filhotes. Ele esconde azul?","Your turn. In the game you can't see the copies, only the looks. This red one was crossed with a blue one and had these four offspring. Does it hide blue?","きみの番。ゲームでは遺伝子は見えず、見た目しかわかりません。この赤いスライムを青と交配したら、この4匹が生まれました。この赤は青をかくしている?"],"t3_explain":["Nasceram filhotes azuis, e azul precisa de duas cópias azuis. Uma veio do pai azul; a outra só pode ter vindo do vermelho. Então ele esconde azul.","Blue offspring hatched, and blue needs two blue copies. One came from the blue parent; the other can only have come from the red one. So it hides blue.","青い子どもが生まれた。青になるには青が2つ必要です。1つは青い親から、もう1つは赤い親からとしか考えられない。だから赤は青をかくしています。"],"t4_text":["E este outro vermelho? Também cruzou com um azul. Ele esconde azul?","And this other red one? It was also crossed with a blue one. Does it hide blue?","こちらの赤いスライムは? これも青と交配しました。青をかくしている?"],"t4_explain":["Se ele escondesse azul, metade dos filhotes sairia azul, como no exemplo anterior. Nasceram quatro vermelhos, então ele tem duas cópias vermelhas e não esconde nada.","If it hid blue, half the offspring would come out blue, like in the last example. All four are red, so it has two red copies and hides nothing.","もし青をかくしていたら、さっきの例のように半分が青になるはず。4匹とも赤なので、赤を2つ持っていて、何もかくしていません。"],"t5_text":["Cada gene é herdado separado. Este é azul com chifre; este é vermelho sem chifre. O que será que vai nascer?","Each gene is inherited separately. This one is blue and horned; this one is red with no horn. What do you think will hatch?","遺伝子はそれぞれ別々に受けつがれます。こちらは青で角あり、こちらは赤で角なし。何が生まれるかな?"],"t5_say":["Todos vermelhos e com chifre, porque vermelho e com chifre são dominantes. Mas cada filhote esconde um azul e um sem chifre.","All red and horned, because red and horned are dominant. But each one hides a blue and a hornless copy.","みんな赤で角あり。赤と角ありが顕性だからです。でも、どの子も青と角なしをかくしています。"],"t6_text":["Agora cruze dois desses filhotes.","Now cross two of these offspring.","次はこの子どもを2匹交配しよう。"],"t6_say":["Nasceu um azul sem chifre, e nenhum dos avós era assim: um era azul com chifre, o outro vermelho sem chifre. Como cada gene vem separado, dá para juntar o azul de um lado com o sem chifre do outro. É assim que você monta o alvo no jogo.","A blue, hornless one hatched, and neither grandparent looked like that: one was blue and horned, the other red with no horn. Since each gene comes separately, you can combine the blue from one side with the hornless from the other. That's how you build the target in the game.","青で角なしが生まれた。祖父母にはこんなスライムはいなかった。片方は青で角あり、もう片方は赤で角なし。遺伝子は別々に受けつがれるので、片方の青ともう片方の角なしを組み合わせられる。ゲームではこうやって目標を作ります。"],"lang_pt":["Português (Brasil)","Português (Brasil)","Português (Brasil)"],"lang_en":["English (US)","English (US)","English (US)"],"lang_ja":["日本語","日本語","日本語"],"lang_aria":["Idioma","Language","言語"],"sub_default":["desafio de genética","genetics challenge","遺伝のチャレンジ"],"e_min_path":["O mínimo é {n} cruzamentos:","The minimum is {n} crosses:","最少は{n}回:"],"e_others":["Pode haver outros caminhos.","There may be other ways.","ほかの方法もあるかもしれない。"],"close":["Fechar","Close","閉じる"],"kid_step":["filhote do {n}","offspring from {n}","{n}の子"],"kids_step":["dois filhotes do {n}","two offspring from {n}","{n}の子どうし"],"see_short":["Ver o caminho mais curto","See the shortest path","最短ルートを見る"],"e_short":["O caminho mais curto","The shortest path","最短ルート"],"e_short_p":["São {n} cruzamentos. Você usou {m}.","It takes {n} crosses. You used {m}.","交配{n}回で届きます。あなたは{m}回でした。"],"back_mine":["Voltar pro meu jogo","Back to my game","自分のゲームにもどる"],"v_asasdif":["4 genes","4 genes","遺伝子4つ"],"v_dois":["2 genes","2 genes","遺伝子2つ"],"hard_btn":["Modo difícil","Hard mode","ハードモード"],"hard_locked":["O modo difícil só pode ser trocado antes do primeiro cruzamento do dia.","Hard mode can only be switched before the first cross of the day.","ハードモードは、その日の最初の交配の前にだけ切りかえられます。"],"v_hard":["difícil","hard","ハード"],"hit_olhos":["O gavião atacou!","The hawk attacked!","タカがおそってきた!"],"hit_chifre":["O urso atacou!","The bear attacked!","クマがおそってきた!"],"hit_azul":["O sol esquentou!","The sun blazed!","日差しが強くなった!"],"hit_asas":["A ventania chegou!","A gale blew in!","強風がふいてきた!"],"gone_wind":["levado","blown away","とばされた"],"hard_help":["Modo difícil: 4 genes, com asas, e duas ameaças durante a partida.","Hard mode: 4 genes, with wings, and two threats during the game.","ハードモード:翼をふくむ遺伝子4つ、そして途中で天敵が2回おそってくる。"],"threat_help":["Depois do {n} cruzamento, morrem todos os slimes que mostram o traço marcado. Quem só esconde o traço escapa. A parede vermelha entre os quadradinhos, embaixo, mostra quando.","After cross {n}, every slime showing the marked trait dies. Those that only hide the trait survive. The red wall between the boxes at the bottom shows when.","{n}回目の交配のあと、印のついた特徴を見せているスライムは全部やられる。特徴をかくしているだけのスライムは助かる。下のマスの間の赤いしきりがタイミングを示す。"],"and":[" e "," and ","と"],"nth":["{n}º","{n}","{n}回目"],"kill_olhos":["mata os de um olho","kills the one-eyed","目が1つは全滅"],"kill_chifre":["mata os sem chifre","kills the hornless","角なしは全滅"],"kill_azul":["mata os azuis","kills the blue ones","青は全滅"],"kill_asas":["mata os de asa","kills the winged","翼ありは全滅"],"sobre_link":["Sobre o jogo e sugestões","About the game and suggestions","このゲームについて・ご意見"],"sobre_title":["Sobre","About","このゲームについて"],"sobre_1":["O Slime Cross é um quebra-cabeça diário de genética. Você recebe três slimes com genes escondidos e um alvo, e precisa cruzar os slimes certos até o alvo nascer. Todo mundo recebe o mesmo desafio no mesmo dia.","Slime Cross is a daily genetics puzzle. You get three slimes with hidden genes and a target, and you have to cross the right slimes until the target is born. Everyone gets the same challenge on the same day.","スライムクロスは、遺伝をテーマにした毎日のパズルです。遺伝子がかくれた3匹のスライムと目標が与えられ、正しいスライムを交配して目標を生み出します。同じ日には、みんな同じ問題に挑戦します。"],"sobre_2":["As regras são as que <b>Gregor Mendel</b> encontrou cruzando ervilhas no jardim do mosteiro de Brno, entre 1856 e 1863: cada traço vem em duas cópias, uma de cada pai; a dominante aparece e a recessiva fica escondida, podendo voltar nos filhos. A cor intermediária (o roxo) e o gene que esconde outro (o transparente) foram entendidos depois dele, no começo do século 20. Jogando, você acaba fazendo o que Mendel fazia: deduzir o que cada um esconde a partir do que nasce.","The rules are the ones <b>Gregor Mendel</b> found by crossing peas in the garden of the abbey in Brno, between 1856 and 1863: each trait comes in two copies, one from each parent; the dominant one shows and the recessive one stays hidden, and can come back in the offspring. Intermediate color (purple) and a gene that hides another (transparent) were understood after him, in the early 20th century. Playing, you end up doing what Mendel did: working out what each one hides from what gets born.","ルールは、<b>グレゴール・メンデル</b>が1856年から1863年にかけてブルノの修道院の庭でエンドウを交配して見つけたものです。どの特徴も2つのコピーを持ち、親から1つずつ受けつぐ。顕性のほうが見た目に出て、潜性のほうはかくれたまま子に現れることがある。中間の色(紫)や、ほかの遺伝子をかくす遺伝子(透明)がわかったのは、20世紀のはじめになってからです。遊んでいるうちに、メンデルと同じこと、生まれた子から親がかくしているものを推理することをしているわけです。"],"sobre_3":["Feito por <b>Gustavo Oliveira</b>, como projeto pessoal. O jogo não usa conta nem cookie: o seu progresso fica só no seu navegador.","Made by <b>Gustavo Oliveira</b> as a personal project. The game uses no account and no cookies: your progress stays in your browser.","個人プロジェクトとして<b>Gustavo Oliveira</b>が作りました。アカウントもクッキーも使いません。進み具合はあなたのブラウザにだけ保存されます。"],"sobre_fb_title":["Sugestões","Suggestions","ご意見"],"sobre_fb_sub":["Achou algo estranho, difícil demais, fácil demais, ou tem uma ideia? Mande aqui. Eu leio tudo.","Found something odd, too hard, too easy, or have an idea? Send it here. I read everything.","変なところ、難しすぎる、簡単すぎる、こうしてほしい、などがあれば送ってください。全部読んでいます。"],"fb_msg":["Sua mensagem","Your message","メッセージ"],"fb_contact":["Como te responder (opcional): e-mail ou @ no X","How to reply to you (optional): email or X handle","返信先(任意):メールまたはXのアカウント"],"fb_send":["Enviar","Send","送信"],"fb_sending":["Enviando...","Sending...","送信中..."],"fb_ok":["Recebido. Obrigado!","Received. Thank you!","受け取りました。ありがとう!"],"fb_err":["Não deu pra enviar agora. Tente de novo daqui a pouco.","Couldn't send right now. Try again in a bit.","いま送信できませんでした。少しあとでもう一度お試しください。"],"sobre_x":["Também dá pra falar comigo no X:","You can also reach me on X:","Xでも連絡できます:"],"h_streak":["Sequência: {n} dias","Streak: {n} days","{n}日連続"],"h_streak1":["Sequência: 1 dia","Streak: 1 day","1日連続"],"next_in":["Próximo desafio em {t}","Next challenge in {t}","次のチャレンジまで {t}"],"t_hm":["{h}h {m}min","{h}h {m}m","{h}時間{m}分"],"t_m":["{m}min","{m}m","{m}分"],"go_arch":["Dias anteriores","Past days","過去のチャレンジ"],"arch_sub":["Jogue os desafios que já passaram","Play the challenges you missed","これまでのチャレンジに挑戦"],"arch_note":["Não conta nas estatísticas nem na sequência.","Doesn't count toward your stats or streak.","成績と連勝には数えません。"],"arch_normal":["Normal","Normal","ノーマル"],"arch_won":["✓ Em {m}","✓ In {m}","✓ {m}回"],"arch_lost":["✗ Não foi","✗ Missed","✗ ざんねん"],"arch_going":["Em andamento","In progress","挑戦中"],"arch_back":["← Dias anteriores","← Past days","← 過去のチャレンジ"],"arch_date":["{d}/{m}","{m}/{d}","{m}/{d}"],"nth_day":["nº {n}","No. {n}","第{n}回"],"target_day":["Alvo do nº {n}","Target of No. {n}","第{n}回の目標"],"modes_note":["Todas com até 8 cruzamentos. Toque numa pra jogar.","All with up to 8 crosses. Tap one to play.","どれも交配は8回まで。タップして遊ぶ。"],"modes_special":["Modos especiais","Special modes","特別モード"],"modes_special_sub":["Opcionais, deixam mais difícil. Ligue antes de escolher a versão.","Optional, they make it harder. Turn on before picking a version.","オプション。難しくなります。バージョンを選ぶ前にオンに。"],"modes_btn":["Trocar modo","Change mode","モードを変える"],"d_dois":["Só cor e chifre. Pra começar.","Just color and horn. To start.","色と角だけ。はじめにどうぞ。"],"d_classico":["Cor, chifre e olhos. O mesmo do desafio do dia.","Color, horn and eyes. Same as the daily.","色・角・目。今日のチャレンジと同じ。"],"d_asasdif":["Entram as asas, com desafios difíceis.","Wings join in, with hard challenges.","翼が加わる。むずかしい問題だけ。"],"d_roxo":["Vermelho com azul dá roxo: nenhum dos dois vence.","Red with blue makes purple: neither one wins.","赤と青で紫に。どちらも勝たない。"],"d_transparente":["Um gene deixa o slime transparente e esconde a cor.","One gene makes the slime transparent and hides its color.","ある遺伝子がスライムを透明にして色をかくす。"],"d_mistura":["Roxo e transparente juntos.","Purple and transparent together.","紫と透明がいっしょに。"],"ms_aging":["Envelhecer","Aging","老化"],"md_aging":["Cada slime cruza só 2 vezes.","Each slime can only cross twice.","スライムは2回までしか交配できない。"],"ms_threat":["Ameaça","Threat","天敵"],"md_threat":["Depois do 2º cruzamento, uma ameaça mata todos os slimes de uma das aparências do alvo.","After the 2nd cross, a threat kills every slime with one of the target's looks.","2回目の交配のあと、目標の見た目のどれかをもつスライムが全部やられる。"],"ms_hard":["Escondido","Hidden","かくれ"],"md_hard":["Um gene que o alvo pede pode estar escondido nos iniciais.","A gene the target needs may be hidden in the starting slimes.","目標に必要な遺伝子が最初のスライムにかくれていることがある。"],"hard_short":["Difícil","Hard","ハード"],"modes_short":["Modos","Modes","モード"],"new_short":["Novo","New","新しく"],"lesson_ok":["Entendi","Got it","わかった"],"les_inc_t":["Roxo: nenhuma cor vence","Purple: neither color wins","紫:どちらの色も勝たない"],"les_inc_1":["Nesta versão a cor não tem dominante: {{VV}} é vermelho, {{vv}} é azul, e com uma cópia de cada, {{Vv}}, o slime fica roxo.","In this version color has no dominant: {{VV}} is red, {{vv}} is blue, and with one copy of each, {{Vv}}, the slime turns purple.","このバージョンでは色に顕性がない。{{VV}}は赤、{{vv}}は青、1つずつの{{Vv}}は紫になる。"],"les_inc_2":["Por isso dois roxos {{Vv}} têm os quatro filhotes {{VV}}, {{Vv}}, {{Vv}} e {{vv}}: vermelho, roxo, roxo e azul. Aqui a aparência mostra as duas cópias.","So two purple {{Vv}} slimes have the four babies {{VV}}, {{Vv}}, {{Vv}} and {{vv}}: red, purple, purple and blue. Here the look shows both copies.","だから紫{{Vv}}どうしの子ども4匹は{{VV}}・{{Vv}}・{{Vv}}・{{vv}}、つまり赤・紫・紫・青。ここでは見た目で2つの遺伝子がわかる。"],"les_trans_t":["Transparente: um gene que esconde a cor","Transparent: a gene that hides the color","透明:色をかくす遺伝子"],"les_trans_1":["Entra um gene novo, o da transparência. Só {{tt}} fica transparente, e aí a cor que ele carrega não aparece.","A new gene joins in, for transparency. Only {{tt}} turns transparent, and then the color it carries does not show.","透明の遺伝子が加わる。{{tt}}だけが透明になり、もっている色が見えなくなる。"],"les_trans_2":["A cor continua lá dentro: este transparente é {{tt}} {{VV}}. Com o azul {{TT}} {{vv}}, os filhotes saem {{Tt}} {{Vv}}, e a cor escondida aparece.","The color is still in there: this transparent one is {{tt}} {{VV}}. With the blue {{TT}} {{vv}}, the babies come out {{Tt}} {{Vv}}, and the hidden color shows.","色は中に残っている。この透明なスライムは{{tt}} {{VV}}。青の{{TT}} {{vv}}との子どもは{{Tt}} {{Vv}}になり、かくれていた色が出てくる。"],"train_t":["Treino","Training","練習"],"les_inc_sci":["Em genética, isso se chama <b>dominância incompleta</b>.","In genetics this is called <b>incomplete dominance</b>.","遺伝学では<b>不完全顕性</b>という。"],"les_trans_sci":["Em genética, isso se chama <b>epistasia recessiva</b>: um gene, com as duas cópias recessivas, esconde o efeito de outro gene.","In genetics this is called <b>recessive epistasis</b>: one gene, with both recessive copies, hides the effect of another gene.","遺伝学では<b>潜性上位</b>(エピスタシス)という。ある遺伝子が潜性を2つもつと、別の遺伝子のはたらきをかくしてしまう。"],"camp":["Campanha","Campaign","キャンペーン"],"camp_sub":["Do azul à tempestade","From blue to the storm","青から嵐まで"],"camp_total":["{n} de {t} estrelas","{n} of {t} stars","星 {n}/{t}"],"camp_back":["← Campanha","← Campaign","← キャンペーン"],"camp_phase":["Fase {c}-{n}","Stage {c}-{n}","ステージ {c}-{n}"],"camp_max":["até {n} cruzamentos","up to {n} crosses","交配は{n}回まで"],"camp_locked":["Termine as três fases do capítulo anterior","Finish the three stages of the previous chapter","前の章の3ステージをクリアしよう"],"camp_st3":["Três estrelas: no mínimo de cruzamentos!","Three stars: in the minimum number of crosses!","星3つ:最少回数でクリア!"],"camp_st2":["Duas estrelas: um cruzamento a mais que o mínimo ({n}).","Two stars: one cross more than the minimum ({n}).","星2つ:最少回数({n})より1回多い。"],"camp_st1":["Uma estrela: dá pra fazer em {n}.","One star: it can be done in {n}.","星1つ:{n}回でできる。"],"camp_next":["Próxima fase","Next stage","次のステージ"],"camp_retry":["Tentar de novo","Try again","もう一度"],"camp_done":["Campanha completa! Você já está pronto pro v}}をかくしていることがあり、見た目は{{VV}}とまったく同じ。"],"ch_0_2":["Aqui os três são vermelhos, e todos escondem um {{v}}. Cruze dois e veja o azul nascer.","Here all three are red, and all of them hide a {{v}}. Cross two and watch a blue one hatch.","ここでは3匹とも赤で、みんな{{v}}をかくしている。2匹を交配して、青が生まれるのを見よう。"],"ch_9_1":["Este capítulo junta os dois. No roxo, uma cópia de cada cor dá roxo: {{VV}} vermelho, {{Vv}} roxo, {{vv}} azul.","This chapter brings the two together. In purple, one copy of each color makes purple: {{VV}} red, {{Vv}} purple, {{vv}} blue.","この章では2つがいっしょに。紫では、色を1つずつもつと紫になる:{{VV}}は赤、{{Vv}}は紫、{{vv}}は青。"],"ch_9_2":["E {{tt}} deixa transparente e esconde qualquer uma dessas cores, até o roxo.","And {{tt}} makes it transparent and hides any of those colors, even purple.","そして{{tt}}は透明にして、どの色もかくしてしまう。紫でも。"],"ch_12":["Tudo junto","All together","ぜんぶいっしょ"],"ch_12_1":["Você achou o capítulo secreto! Aqui não tem moleza: roxo, transparente, asas e duas ameaças em toda fase.","You found the secret chapter! No easy ride here: purple, transparent, wings and two threats in every stage.","ひみつの章を見つけた!ここは手ごわい:紫、透明、翼、そしてどのステージにも天敵が2回。"],"ch_12_2":["Lembre: {{tt}} esconde a cor, e quem só esconde um traço escapa das ameaças. Boa sorte!","Remember: {{tt}} hides the color, and those only hiding a trait survive the threats. Good luck!","思い出して:{{tt}}は色をかくす。特徴をかくしているだけなら天敵から助かる。がんばって!"],"ch_3":["Escondido","Hidden","かくれ"],"ch_3_1":["Agora o alvo pede um traço que nenhum slime inicial mostra! Mas ele está ali: dois deles carregam o gene escondido.","Now the target needs a trait no starting slime shows! But it is in there: two of them carry the hidden gene.","目標に必要な特徴を、最初のスライムはだれも見せていない!でも2匹がその遺伝子をかくしもっている。"],"ch_3_2":["Cruze e leia as ninhadas pra descobrir quem são os portadores. Quando os dois se encontram, o traço aparece.","Cross and read the litters to find out who the carriers are. When the two meet, the trait shows up.","交配して子どもを見て、だれが保因者か見つけよう。2匹が出会えば、その特徴があらわれる。"],"camp_st_one":["Estrela conquistada! Agora o chifre te espera.","Star earned! The horn is waiting for you.","星ゲット!次は角が待っている。"],"n_genes":["{n} genes","{n} genes","遺伝子{n}つ"],"fin_2b":["Você já está pronto pro desafio do dia no modo difícil!","You're ready for the daily challenge on hard mode!","もう今日のチャレンジのハードモードもいける!"],"fin_ok_b":["Voltar pra campanha","Back to the campaign","キャンペーンにもどる"]};
let LANG = 'pt';
function tr(key, v) {
  const e = I18N[key];
  let s = e ? e[LANGS.indexOf(LANG)] : key;
  if (typeof s !== 'string') return s;
  v = v || {};
  return s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m)).replace(/\{\{/g, '{').replace(/\}\}/g, '}');
}
function vname(V) { return tr('v_' + V.id); }
const LANG_CODE = { pt: 'PT', en: 'EN', ja: 'JA' };
const GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>';
function closeLangMenus() {
  document.querySelectorAll('.lang-menu').forEach(m => { m.hidden = true; });
  document.querySelectorAll('.lang-btn').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
/* Um botão só (globo + sigla do idioma atual) que abre a lista com o nome de cada idioma escrito nele mesmo. */
function renderLangButtons() {
  document.querySelectorAll('.langs').forEach(box => {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn lang-btn';
    btn.innerHTML = GLOBE;
    const code = document.createElement('span'); code.textContent = LANG_CODE[LANG];
    const caret = document.createElement('span'); caret.className = 'caret'; caret.textContent = '▾'; caret.setAttribute('aria-hidden', 'true');
    btn.append(code, caret);
    btn.setAttribute('aria-label', tr('lang_aria') + ': ' + tr('lang_' + LANG));
    btn.setAttribute('aria-haspopup', 'true'); btn.setAttribute('aria-expanded', 'false');
    const menu = document.createElement('div'); menu.className = 'lang-menu'; menu.hidden = true;
    menu.setAttribute('role', 'menu'); menu.setAttribute('aria-label', tr('lang_aria'));
    LANGS.forEach(l => {
      const o = document.createElement('button'); o.type = 'button'; o.className = 'lang-opt';
      o.setAttribute('role', 'menuitemradio'); o.setAttribute('aria-checked', l === LANG ? 'true' : 'false');
      const name = document.createElement('span'); name.textContent = I18N['lang_' + l][LANGS.indexOf(l)];
      o.append(name);
      if (l === LANG) { const t = document.createElement('span'); t.className = 'tick'; t.textContent = '✓'; t.setAttribute('aria-hidden', 'true'); o.append(t); }
      o.addEventListener('click', () => { closeLangMenus(); setLang(l); });
      menu.append(o);
    });
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const open = menu.hidden;
      closeLangMenus();
      menu.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) { /* abre pro lado que tem espaço: a lista não pode sair da tela */
        menu.style.left = 'auto'; menu.style.right = '0';
        if (menu.getBoundingClientRect().left < 8) { menu.style.right = 'auto'; menu.style.left = '0'; }
      }
      if (open) { const cur = menu.querySelector('[aria-checked="true"]'); if (cur) cur.focus(); }
    });
    box.replaceChildren(btn, menu);
  });
}
document.addEventListener('click', e => { if (!e.target.closest('.langs')) closeLangMenus(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLangMenus(); });
function applyStatic() {
  document.documentElement.lang = { pt: 'pt-BR', en: 'en-US', ja: 'ja' }[LANG];
  document.title = tr('title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = tr(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = tr(e.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', tr(e.dataset.i18nAria)); });
  renderLangButtons();
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem('slime-lang', l); } catch (e) { /* sem armazenamento */ }
  applyStatic();
  if (typeof fillVariantSelect === 'function') fillVariantSelect();
  if (!$('view-home').hidden) renderHome();
  if (!$('view-tut').hidden) renderTut();
  if (!$('view-arch').hidden) renderArch();
  if (!$('view-modes').hidden) renderModes();
  if (!$('view-camp').hidden) renderCamp();
  if (G && !$('view-game').hidden) render();
}
function initLang() {
  let l = null;
  try { l = localStorage.getItem('slime-lang'); } catch (e) { /* sem armazenamento */ }
  if (!LANGS.includes(l)) {
    const n = (navigator.language || 'pt').toLowerCase();
    l = n.startsWith('pt') ? 'pt' : n.startsWith('ja') ? 'ja' : 'en';
  }
  LANG = l;
  applyStatic();
}

/* ---------- versões ---------- */
const AGE_LIMIT = 2;
const MIN_PAR = 3; /* todo desafio precisa de pelo menos 3 cruzamentos: com 2, quase todo mundo vencia (ver simulação na nota do projeto) */
const NO_MODS = { aging: false, threat: false, hard: false };
let EASY = false;
const EVENT_AT = 2;
/* modo difícil do desafio do dia: duas ameaças, depois do 2º e do 4º cruzamento */
const HARD_AT = [2, 4];
/* todas as versões com 8 cruzamentos; 4 genes usa a lista de desafios difíceis (tools/gen4.py) */
const VARIANTS = {
  dois: { id: 'dois', nome: '2 genes', max: 8, two: true },
  classico: { id: 'classico', nome: '3 genes', max: 8 },
  asasdif: { id: 'asasdif', nome: '4 genes', max: 8, wings: true, list: 'lista4' },
  roxo: { id: 'roxo', nome: 'Roxo', max: 8, inc: true },
  transparente: { id: 'transparente', nome: 'Transparente', max: 8, trans: true },
  mistura: { id: 'mistura', nome: 'Roxo e transparente', max: 8, inc: true, trans: true },
};
Object.values(VARIANTS).forEach(V => {
  V.genes = (V.two ? ['V', 'C'] : ['V', 'C', 'E']).concat(V.trans ? ['T'] : [], V.wings ? ['A'] : []);
  V.keys = (V.two ? ['cor', 'chifre'] : ['cor', 'chifre', 'olhos']).concat(V.wings ? ['asas'] : []);
});

/* tudo junto, pro capítulo escondido da campanha: roxo, transparente e asas */
const SECRET = { id: 'segredo', nome: 'Tudo junto', max: 8, inc: true, trans: true, wings: true, genes: ['V', 'C', 'E', 'T', 'A'], keys: ['cor', 'chifre', 'olhos', 'asas'] };

/* só a cor, pro capítulo 0 da campanha: três vermelhos que escondem o azul */
const ONE = { id: 'um', nome: 'Só a cor', max: 8, one: true, genes: ['V'], keys: ['cor'] };

/* modo difícil do desafio do dia: os 4 genes, com lista própria. A partir do nº 20 (24/10) o alvo não pede sempre asa:
   o gene que dá trabalho é sorteado entre os quatro recessivos (tools/gen4ameaca.py) */
const HARD = { id: 'hard', nome: 'difícil', max: 8, wings: true, list: 'dia4', genes: ['V', 'C', 'E', 'A'], keys: ['cor', 'chifre', 'olhos', 'asas'] };

/* Cada ameaça tem uma presa fixa, e a presa é sempre um traço recessivo: gavião leva os de um olho,
   lobo come os sem chifre, o sol derrete os azuis, a ventania leva os de asa. Quem só esconde o traço escapa. */
const EVENTS = [
  { k: 'olhos', v: 1, id: 'olhos' },
  { k: 'chifre', v: false, id: 'chifre' },
  { k: 'cor', v: 'azul', id: 'azul' },
  { k: 'asas', v: true, wings: true, id: 'asas' },
]

/* Painel de regras: cada uma mostra o slime dominante e o recessivo, desenhados. {xx} marca código de gene. */
const BASE_P = { cor: 'vermelho', chifre: false, olhos: 2 };
function rulesOf(V) {
  const r = [];
  const c = x => tr('c_' + x);
  if (V.inc) {
    r.push({ t: tr('r_color'), mix: true, figs: [[{ cor: 'vermelho' }, c('vermelho'), 'VV'], [{ cor: 'roxo' }, c('roxo'), 'Vv'], [{ cor: 'azul' }, c('azul'), 'vv']], s: tr('rn_mix'), novo: true });
  } else {
    r.push({ t: tr('r_color'), dom: [{ cor: 'vermelho' }, c('vermelho'), 'V'], rec: [{ cor: 'azul' }, c('azul'), 'v'], s: tr('rn_color') });
  }
  if (!V.one) r.push({ t: tr('r_horn'), dom: [{ chifre: true }, tr('horn_y'), 'C'], rec: [{ chifre: false }, tr('horn_n'), 'c'], s: tr('rn_horn') });
  if (!V.two && !V.one) r.push({ t: tr('r_eyes'), dom: [{ olhos: 2 }, tr('eyes_2'), 'E'], rec: [{ olhos: 1 }, tr('eyes_1'), 'e'], s: tr('rn_eyes') });
  if (V.trans) r.push({ t: tr('r_trans'), dom: [{}, tr('normal'), 'T'], rec: [{ cor: 'transparente' }, c('transparente'), 't'], s: tr('rn_trans'), novo: true });
  if (V.wings) r.push({ t: tr('r_wings'), dom: [{ asas: false }, tr('wing_n'), 'A'], rec: [{ asas: true }, tr('wing_y'), 'a'], s: tr('rn_wings'), novo: true });
  return r;
}
function miniFig(spec, role) {
  const [over, label, code] = spec;
  const f = document.createElement('figure'); f.className = 'mini';
  const cv = sprite(Object.assign({}, BASE_P, over)); f.append(cv);
  const cap = document.createElement('figcaption'); cap.append(label + ' ', geneTag(code)); f.append(cap);
  if (role) { const r = document.createElement('span'); r.className = 'role ' + role; r.textContent = role === 'dom' ? tr('dom') : tr('rec'); f.append(r); }
  return f;
}
function renderRules(V) {
  return rulesOf(V).map(r => {
    const e = document.createElement('div'); e.className = 'winrow' + (r.novo ? ' new' : '');
    const t = document.createElement('div'); t.className = 'wr-title'; t.textContent = r.t;
    const pair = document.createElement('div'); pair.className = 'wr-pair' + (r.mix ? ' mix' : '');
    if (r.mix) {
      r.figs.forEach(fg => pair.append(miniFig(fg)));
    } else {
      pair.append(miniFig(r.dom, 'dom'), miniFig(r.rec, 'rec'));
    }
    const d = document.createElement('p'); d.className = 'wr-note'; d.append(...withTags(r.s));
    e.append(t, pair, d);
    return e;
  });
}
function geneTag(txt) { const e = document.createElement('span'); e.className = 'gene'; e.textContent = txt; return e; }
function withTags(text) {
  return text.split(/(\{[^}]+\})/).filter(Boolean).map(part => (part[0] === '{' ? geneTag(part.slice(1, -1)) : part));
}

/* ---------- lógica: genética, ninhadas, ameaça, gerador e solucionador ---------- */
function hashStr(s) {

function reg(P, c) { c.p = phenOf(P.V, c.g); P.reg.set(c.id, c); return c; }

function phenOf(V, g) {

  if (V.trans && !has(V.genes.indexOf('T'))) cor = 'transparente';
  const p = { cor, chifre: V.one ? false : !!has(1), /* só a cor: sem chifre, que só entra no capítulo 1 */ olhos: V.two || V.one || has(2) ? 2 : 1 };

}
function hits(V, p, t) { let n = 0; V.keys.forEach(k => { if (p[k] === t[k]) n++; }); return n; }
function match(V, p, t) { return hits(V, p, t) === V.keys.length; }
/* a um traço do alvo (borda amarela); com um gene só, todo errado estaria a um traço, então não marca */
function isNear(V, p, t) { return V.keys.length > 1 && hits(V, p, t) === V.keys.length - 1; }

function litter(P, a, b) {

  const kids = [0, 1, 2, 3].map(k => ({ id: '(' + x.id + 'x' + y.id + ')' + k, g: [], parents: [x.id, y.id], idx: k }));
  for (let i = 0; i < n; i++) {
    const pun = [
      [x.g[i][0], y.g[i][0]], [x.g[i][0], y.g[i][1]],
      [x.g[i][1], y.g[i][0]], [x.g[i][1], y.g[i][1]],
    ];
    const perm = shuffle4(rngFrom(hashStr(P.key + '|' + mk + '|' + i)));
    for (let k = 0; k < 4; k++) kids[k].g[i] = pun[perm[k]].slice();

/* Busca o menor número de cruzamentos, respeitando o limite de uso e a ameaça. */
function solve(P, maxD) {
  const V = P.V;
  function dfs(pop, uses, done, made, d) {
    for (let i = 0; i < pop.length; i++) {
      const a = pop[i];
      if (P.mods.aging && (uses[a.id] || 0) >= AGE_LIMIT) continue;
      for (let j = i + 1; j < pop.length; j++) {
        const b = pop[j];
        if (P.mods.aging && (uses[b.id] || 0) >= AGE_LIMIT) continue;
        const pk = pairKey(a, b);
        if (done.includes(pk)) continue;
        const kids = litter(P, a, b);
        if (kids.some(k => match(V, k.p, P.target))) return [[a.id, b.id]];
        if (d > 1) {
          const nu = Object.assign({}, uses);
          nu[a.id] = (nu[a.id] || 0) + 1; nu[b.id] = (nu[b.id] || 0) + 1;
          let np = pop.concat(kids);
          P.Es.forEach(x => { if (made + 1 === x.at) np = np.filter(c => !killedBy(x.E, c.p)); });
          const r = dfs(np, nu, done.concat(pk), made + 1, d - 1);
          if (r) return [[a.id, b.id]].concat(r);
        }
      }
    }
    return null;
  }
  for (let d = 1; d <= maxD; d++) {
    const r = dfs(P.starters.slice(), {}, [], 0, d);
    if (r) return { depth: d, path: r };

function interesting(V, t) {
  return t.cor !== 'vermelho' || !t.chifre || t.olhos === 1 || (V.wings && t.asas);
}

/* Modo justo: toda letra que o alvo precisa já aparece à vista em algum slime inicial,
   então dá pra achar o gene por dedução, sem cruzar no escuro atrás de um portador escondido. */

    return need.every(a => starters.some(s => knownLetters(pubGeno(V, s.p, i)).includes(a)));

function makePuzzle(V, seedStr, mods) {
  const n = V.genes.length;

  /* a campanha pede o mínimo de cruzamentos de cada fase, uma ameaça específica ou duas ameaças (as regras do difícil) */
  const minPar = mods.minPar || MIN_PAR, maxPar = mods.maxPar || 3;

    const rng = rngFrom(hashStr(key));
    const gen = () => Array.from({ length: n }, () => [rng() < 0.55 ? 1 : 0, rng() < 0.55 ? 1 : 0]);
    const P = { V, key, mods, reg: new Map(), lit: new Map(), Es: [] };
    P.starters = ['A', 'B', 'C'].map(id => reg(P, { id, parents: null, g: gen() }));

    if (mods.needAll) { const cs = [P.target, ...P.starters.map(c => c.p)].map(p => p.cor); if (!cs.includes('roxo') || !cs.includes('transparente')) continue; } /* capítulo escondido: roxo e transparente sempre em jogo */
    if (mods.want && Object.keys(mods.want).some(k => P.target[k] !== mods.want[k])) continue; /* campanha: alvo pedido */
    if (P.starters.some(s => match(V, s.p, P.target))) continue;
    if (mods.twoCarriers) {
      /* capítulo Escondido: um traço recessivo do alvo não aparece em nenhum inicial, mas dois iniciais carregam o gene;
         o resto do alvo fica à vista. É a regra que ele achou justa em 2026-10-15 (o Escondido antigo era chute). */
      const REC = { cor: 'azul', chifre: false, olhos: 1, asas: true };
      const hid = V.keys.filter(k => P.target[k] === REC[k] && !P.starters.some(c => c.p[k] === REC[k]));
      if (hid.length !== 1) continue;
      const gi = V.genes.indexOf({ cor: 'V', chifre: 'C', olhos: 'E', asas: 'A' }[hid[0]]);
      if (P.starters.filter(c => c.g[gi].includes(0)).length < 2) continue;
      if (!V.keys.filter(k => k !== hid[0]).every(k => P.starters.some(c => c.p[k] === P.target[k]))) continue;
    } else if (!mods.hard && !fairStart(V, P.starters, P.target)) continue;
    /* Todo treino: o slime inicial mais parecido com o alvo tem que errar pelo menos 2 traços. Com 1 só,
       o alvo ficava a um passo de um inicial e o desafio saía fácil. */
    if (V.keys.length - Math.max(...P.starters.map(c => hits(V, c.p, P.target))) < (V.two || V.one ? 1 : 2)) continue;
    if (mods.carriers && !P.starters.every(c => c.g.every(pair => pair.includes(0)))) continue; /* campanha: todo inicial esconde o recessivo */
    /* Quatro genes: um gene sorteado tem que dar trabalho (até 2026-10-23 era sempre a asa, e todo alvo tinha asa).
       O alvo pede o recessivo dele, e esse recessivo está num slime inicial diferente do que já tem a maior parte
       dos outros traços; sem isso, o quarto gene vinha de graça e o modo ficava fácil. */
    if (V.wings) {
      const REC = { cor: 'azul', chifre: false, olhos: 1, asas: true };
      const work = V.keys[Math.floor(rng() * V.keys.length)];
      if (P.target[work] !== REC[work]) continue;
      const score = c => V.keys.filter(k => k !== work && c.p[k] === P.target[k]).length;
      const top = Math.max(...P.starters.map(score));
      if (P.starters.some(c => score(c) === top && c.p[work] === REC[work])) continue;
    }
    if (mods.threat) {
      /* a ameaça sempre ataca uma aparência que o alvo tem: pra chegar nele, é preciso guardar quem só esconde o traço */
      const onTarget = valid.filter(e => P.target[e.k] === e.v);
      if (mods.two) {
        if (onTarget.length < 2) continue;
        const i = Math.floor(rng() * onTarget.length); let j = Math.floor(rng() * (onTarget.length - 1)); if (j >= i) j++;
        P.Es = [{ E: onTarget[i], at: HARD_AT[0] }, { E: onTarget[j], at: HARD_AT[1] }];
      } else {
        const pool = mods.ev ? onTarget.filter(e => e.id === mods.ev) : onTarget;
        if (!pool.length) continue;
        P.Es = [{ E: pool[Math.floor(rng() * pool.length)], at: EVENT_AT }];
      }
    }
    const res = solve(P, maxPar);
    if (res && res.depth >= minPar && res.depth <= maxPar) { P.par = res.depth; P.path = res.path; return P; }
  }
  return null;
}

/* O que a aparência já diz de cada gene: V_ (uma maiúscula garantida), vv, Vv no roxo, __ quando a cor está escondida. */
function pubGeno(V, p, i) {
  const L = V.genes[i];
  if (L === 'V') {
    if (V.trans && p.cor === 'transparente') return '__';
    if (V.inc) return p.cor === 'vermelho' ? 'VV' : p.cor === 'roxo' ? 'Vv' : 'vv';
    return p.cor === 'vermelho' ? 'V_' : 'vv';
  }
  if (L === 'C') return p.chifre ? 'C_' : 'cc';
  if (L === 'E') return p.olhos === 2 ? 'E_' : 'ee';
  if (L === 'T') return p.cor === 'transparente' ? 'tt' : 'T_';
  if (L === 'A') return p.asas ? 'aa' : 'A_';
  return '__';
}
function geneOptions(V, p, i) {
  const pub = pubGeno(V, p, i), L = V.genes[i], l = L.toLowerCase();
  if (pub === '__') return V.inc ? [pub, L + L, L + l, l + l] : [pub, L + L, L + l, l + l];
  if (pub.includes('_')) return [pub, L + L, L + l];
  return [];
}
function trueGeno(V, c) {
  return c.g.map((pair, i) => {
    const L = V.genes[i], l = L.toLowerCase();
    return pair.map(v => (v ? L : l)).sort().join('');
  });
}

function puzzleFromList(V, d) {
  const [num, a, b, c, tg] = d;
  const P = { V, key: (V.list || 'lista1') + ':' + num, mods: NO_MODS, reg: new Map(), lit: new Map(), Es: [] };
  const gen = str => V.genes.map((_, i) => [+str[2 * i], +str[2 * i + 1]]);
  P.starters = [['A', a], ['B', b], ['C', c]].map(([id, str]) => reg(P, { id, parents: null, g: gen(str) }));
  P.target = { cor: tg[0] === '1' ? 'vermelho' : 'azul', chifre: tg[1] === '1', olhos: tg[2] === '1' ? 2 : 1 };
  if (V.wings) P.target.asas = tg[3] === '0'; /* asa é o recessivo: 0 nas duas cópias */
  /* desafio com ameaças prontas (modo difícil do dia): ids na ordem em que acontecem */
  if (d[5]) P.Es = d[5].split(',').map((id, i) => ({ E: EVENTS.find(e => e.id === id), at: HARD_AT[i] }));
  const res = solve(P, 3);
  if (!res) return null;
  P.par = res.depth; P.path = res.path;
  return P;
}

function newGame(mode, V, seedStr, info, saved, mods, listed) {
  mods = Object.assign({}, NO_MODS, mods || {});
  let P = listed ? puzzleFromList(V, listed) : null;
  if (!P) P = makePuzzle(V, seedStr, mods);
  for (let extra = 1; !P && extra < 20; extra++) P = makePuzzle(V, seedStr + '+' + extra, mods);
  G = {
    mode, V, seedStr, info, P, mods, listed,
    pop: P.starters.slice(),
    labels: new Map(P.starters.map(s => [s.id, s.id])),
    next: 1, crosses: [], sel: [], status: 'playing', reveal: false,
    marks: Object.assign({}, (saved && saved.marks) || {}), focus: null,
    dead: new Set(), fired: 0, killed: [], killer: new Map(), curE: null, reason: '',
  };
  ((saved && saved.crosses) || []).forEach(([a, b]) => { if (G.status === 'playing') doCross(a, b, true); });
  if (saved && saved.gaveup) { G.status = 'lost'; G.reason = 'r_gaveup'; G.reveal = true; G.gaveup = true; }
  fresh = new Set();
  render();
}

function canBreed(id) { return !G.dead.has(id) && (!G.mods.aging || usesOf(id) < AGE_LIMIT); }

  const ok = G.pop.filter(c => canBreed(c.id));
  for (let i = 0; i < ok.length; i++) for (let j = i + 1; j < ok.length; j++) {
    const pk = pairKey(ok[i], ok[j]);
    if (!G.crosses.some(c => pairKey(C(c.a), C(c.b)) === pk)) return true;
  }
  return false;
}

function doCross(aId, bId, silent) {
  const a = C(aId), b = C(bId);
  if (!a || !b) return;
  const kids = litter(G.P, a, b);
  kids.forEach(k => {
    if (!G.labels.has(k.id)) { G.labels.set(k.id, String(G.next++)); G.pop.push(k); if (!silent) fresh.add(k.id); }
  });
  G.crosses.push({ a: aId, b: bId, kids: kids.map(k => k.id) });
  if (kids.some(k => match(G.V, k.p, G.P.target))) { G.status = 'won'; }
  else {
    const ev = G.P.Es[G.fired];
    if (ev && G.crosses.length === ev.at) {
      G.fired++;
      const victims = [];
      G.pop.forEach(c => { if (!G.dead.has(c.id) && killedBy(ev.E, c.p)) { G.dead.add(c.id); G.killer.set(c.id, ev.E.id); victims.push(c.id); } });
      G.killed.push(victims.length);
      G.curE = ev.E;
      /* jogando de verdade, a morte vira cena: espera a ninhada nascer, avisa, assusta, murcha e só então mostra o morto */
      if (!silent && victims.length) { G.dying = new Set(victims); G.deathState = new Map(victims.map(id => [id, 'alive'])); G.deathT0 = Date.now() + LITTER_MS + 300; G.deathScheduled = false; }
    }
    if (G.crosses.length >= G.V.max) { G.status = 'lost'; G.reason = 'r_out'; }
    else if (!pairsLeft()) { G.status = 'lost'; G.reason = 'r_nopair'; }
  }
  if (!silent) save();
  if (G.mode === 'daily' && !silent && !G.replay && !G.autoplay && G.crosses.length === 1) track('start');
  if (G.mode === 'daily' && G.status !== 'playing') recordDaily();
  if (G.mode === 'camp' && G.status === 'won' && !silent && !G.replay && !G.autoplay) {
    campRecord();
    if (G.campFinale) { const f = G.campFinale; G.campFinale = null; setTimeout(() => campFinale(f), 2600); } /* depois da comemoração do filhote */
  }
}

function recordDaily() {

  st.days[G.seedStr] = { won: G.status === 'won', n: G.crosses.length };
  store(STATS, st);
