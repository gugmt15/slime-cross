}
/* Estatística anônima do desafio do dia (functions/api/stats.js): o começo e o fim de cada partida, sem identificar ninguém.
   Só no site e nos endereços de teste do Cloudflare; os de teste vão marcados e ficam fora do resumo. */
const TRACK_ON = /(^|\.)slimecross\.com$|(^|\.)slime-cross\.pages\.dev$/.test(location.hostname);
const TRACK_TEST = !IS_LIVE && location.hostname !== 'slime-cross.pages.dev';
function track(ev, reason) {
  if (!TRACK_ON) return;
  try {
    const before = Object.keys((load(STATS) || { days: {} }).days).filter(k => k !== G.seedStr);
    const S = statsSummary();
    const body = {
      ev, date: G.seedStr, day: G.info.n, hard: G.V === HARD, test: TRACK_TEST || !!TEST_DAY,
      won: G.status === 'won', reason: reason || G.reason || '', n: G.crosses.length, par: G.P.par,
      path: G.crosses.map(c => lab(c.a) + '×' + lab(c.b)).join(' '), played: before.length, streak: S.current, lang: LANG,
    };
    fetch('/api/stats', { method: 'POST', keepalive: true, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});
  } catch (e) {}
}
function statsSummary() {
  const st = load(STATS) || { days: {} };
  const keys = Object.keys(st.days).sort();
  const played = keys.length;
  const wins = keys.filter(k => st.days[k].won).length;
  const dist = {};
  keys.forEach(k => { const d = st.days[k]; const b = d.won ? d.n : 'X'; dist[b] = (dist[b] || 0) + 1; });
  const dayNum = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
  let best = 0, run = 0, prev = null;
  keys.forEach(k => {
    const won = st.days[k].won, n = dayNum(k);
    run = won ? (prev !== null && n - prev === 1 && run > 0 ? run + 1 : 1) : 0;
    prev = n;
    best = Math.max(best, run);
  });
  const last = keys[keys.length - 1];
  const todayN = dayNum(today().key);
  const current = last && st.days[last].won && todayN - dayNum(last) <= 1 ? run : 0;
  return { played, wins, current, best, dist };
}

  const maxv = Math.max(1, ...bins.map(b => S.dist[b] || 0));

  bins.forEach(bn => {

      alma.style.animationDelay = dph === 'done' ? '0s' : (-((hashStr(c.id) >>> 5) % 70) / 10).toFixed(1) + 's'; /* acabou de morrer: a alma sai na hora */
      b.append(alma);
    }
    if (dph === 'done') G.deathState.set(c.id, 'dead');
  }
  else if (G.mods.aging) {
    const us = document.createElement('span'); us.className = 'uses';
    for (let k = 0; k < AGE_LIMIT; k++) { const i = document.createElement('i'); if (k < AGE_LIMIT - u) i.className = 'left'; us.append(i); }
    b.append(us);
  }
  b.addEventListener('click', () => toggle(c.id));
  return b;
}

function cardH() {
  const marks = EASY;
  return 74 + (marks ? 15 : 0) + (G.reveal ? 15 : 0) + (G.mods.aging || G.P.Es.length ? 13 : 0);
}

let TREE_SIZE = { w: 0, h: 0 };
function applyZoom() {
  const host = $('tree'), sizer = host.querySelector('.tree-sizer'), canvas = host.querySelector('.tree-canvas');
  if (!sizer || !canvas || !G) return;
  const z = G.zoom || 1;
  canvas.style.transform = 'scale(' + z + ')';
  sizer.style.width = Math.ceil(TREE_SIZE.w * z) + 'px';
  sizer.style.height = Math.ceil(TREE_SIZE.h * z) + 'px';
}
function setZoom(z) { if (!G) return; G.zoom = Math.max(0.3, Math.min(1.6, z)); applyZoom(); }
function fitZoom() { const w = $('tree').clientWidth - 4; return TREE_SIZE.w ? Math.min(1, w / TREE_SIZE.w) : 1; }

/* Árvore: cada cruzamento é um nó com o número dele; os dois pais descem até ele, e dele saem os 4 filhotes.
   Ninguém muda de lugar depois que aparece: A, B e C ficam fixos no topo, e cada cruzamento ganha a própria linha,
   embaixo da anterior e centralizada, como os quadradinhos do resultado. A árvore só cresce pra baixo, nunca pro lado
   (até 2026-10-23 cada linha era uma geração, e ninhadas da mesma geração ficavam lado a lado). */
function renderTree() {
  const host = $('tree');
  const relevant = new Set(G.sel);
  if (G.focus) relevant.add(G.focus);
  /* iniciais no meio da área da árvore; a área nunca encolhe, então crescer a árvore não arrasta ninguém */
  if (!G.treeBase && host.clientWidth) G.treeBase = host.clientWidth - 4; /* medida uma vez por partida */
  /* em tela estreita o vão entre os cartões encolhe, pra a ninhada de 4 caber sem a árvore arrastar pro lado */
  const CW = 80, CH = cardH(), GAP = (G.treeBase || 400) >= 362 ? 10 : 6, SLOT = CW + GAP, BAND = 56, XH = 22, RM = 8;
  const GW = 4 * SLOT - GAP; /* largura de uma ninhada */
  const rowTop = g => 12 + g * (CH + BAND); /* folga em cima pra marca da ameaça no canto do cartão não cortar */
  const pos = new Map();
  const base = Math.max(G.treeBase || 0, 4 + GW + RM);
  const off = Math.round(base / 2 - (3 * SLOT - GAP) / 2);
  G.P.starters.forEach((c, k) => { pos.set(c.id, { x: off + k * SLOT, y: rowTop(0) }); });
  const left = Math.max(4, Math.min(Math.round(base / 2 - GW / 2), base - GW - RM));
  const xn = [];
  G.crosses.forEach((cr, i) => {
    const g = i + 1;
    cr.kids.forEach((k, n) => { pos.set(k, { x: left + n * SLOT, y: rowTop(g) }); });
    const xt = lab(cr.a) + ' × ' + lab(cr.b);
    const w = Math.ceil(22 + xt.length * 7.4);
    xn.push({ id: 'x' + i, i, cx: left + GW / 2, cy: rowTop(g) - BAND / 2, w, text: xt });
  });
  let gw = base, gh = 0;
  pos.forEach(p => { gw = Math.max(gw, p.x + CW + RM); gh = Math.max(gh, p.y + CH + 4); });
  const canvas = document.createElement('div'); canvas.className = 'tree-canvas';
  canvas.style.width = gw + 'px'; canvas.style.height = gh + 'px';
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'links'); svg.setAttribute('width', gw); svg.setAttribute('height', gh);
  svg.setAttribute('viewBox', '0 0 ' + gw + ' ' + gh); svg.setAttribute('aria-hidden', 'true');
  const hotCross = new Set();
  G.crosses.forEach((cr, i) => { if (relevant.has(cr.a) || relevant.has(cr.b) || cr.kids.some(k => relevant.has(k))) hotCross.add('x' + i); });
  const calm = [], hot = [];
  const link = (x1, y1, x2, y2, isHot) => {
    const my = (y1 + y2) / 2;
    const path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + y2);
    if (isHot) { path.setAttribute('class', 'hot'); hot.push(path); } else calm.push(path);
  };
  xn.forEach(n => {
    const cr = G.crosses[n.i], h = hotCross.has(n.id);
    [cr.a, cr.b].forEach(p => { const q = pos.get(p); link(q.x + CW / 2, q.y + CH, n.cx, n.cy - XH / 2, h && (relevant.has(p) || cr.kids.some(k => relevant.has(k)))); });
    cr.kids.forEach(k => { const q = pos.get(k); link(n.cx, n.cy + XH / 2, q.x + CW / 2, q.y, h && (relevant.has(k) || relevant.has(cr.a) || relevant.has(cr.b))); });
  });
  svg.append(...calm, ...hot);
  canvas.append(svg);
  BIRTH = new Map();
  G.crosses.forEach(cr => cr.kids.forEach((k, i) => BIRTH.set(k, i)));
  xn.forEach(n => {
    const x = document.createElement('div');
    x.className = 'xnode' + (hotCross.has(n.id) ? ' hot' : '');
    x.style.left = (n.cx - n.w / 2) + 'px'; x.style.top = (n.cy - XH / 2) + 'px';
    x.style.width = n.w + 'px'; x.style.height = XH + 'px';
    x.textContent = n.text; x.title = n.text;
    canvas.append(x);
  });
  pos.forEach((p, id) => {
    const card = makeCard(C(id));
    card.style.left = p.x + 'px'; card.style.top = p.y + 'px';
    canvas.append(card);
  });
  /* como a árvore só cresce pra baixo, a largura é fixa: em tela estreita demais ela já começa no zoom que cabe.
     A largura é medida antes de trocar a árvore: medir depois força o navegador a montar a página com a árvore nova
     ainda sem altura, e a rolagem pulava pro topo a cada toque (2026-10-23). */
  if (G.zoom === undefined) { const hw = host.clientWidth; if (hw && gw > hw) G.zoom = Math.max(0.3, (hw - 2) / gw); }
  const sizer = document.createElement('div'); sizer.className = 'tree-sizer';
  sizer.append(canvas);
  TREE_SIZE = { w: gw, h: gh };
  const z = G.zoom || 1;
  sizer.style.width = Math.ceil(gw * z) + 'px'; sizer.style.height = Math.ceil(gh * z) + 'px';
  host.replaceChildren(sizer);
  applyZoom();
}

function renderNoteBar() {
  const bar = $('notebar');
  if (!G.focus || !EASY) { bar.hidden = true; bar.replaceChildren(); return; }
  const V = G.V, c = C(G.focus);
  bar.hidden = false;
  const title = document.createElement('span'); title.className = 'nb-title'; title.textContent = tr('genes_of', { x: lab(c.id) });
  const parts = [title];
  V.genes.forEach((L, i) => {
    const wrap = document.createElement('div'); wrap.className = 'gpick';
    const nm = document.createElement('span'); nm.className = 'gname'; nm.textContent = tr('g_' + L); wrap.append(nm);
    const opts = geneOptions(V, c.p, i);
    if (!opts.length) { const f = document.createElement('span'); f.className = 'fixed'; f.textContent = pubGeno(V, c.p, i); wrap.append(f); }
    else {
      const cur = (G.marks[c.id] || {})[i] || opts[0];
      opts.forEach(o => {
        const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = (o === opts[0] && !EASY) ? '?' : o;
        btn.setAttribute('aria-pressed', o === cur ? 'true' : 'false');

/* Como a ventania mata: 'tonto' (levanta, gira e derruba o slime no próprio cartão, que fica morto como os outros)
   ou 'leva' (leva embora, cartão vazio). Desde 2026-10-16 é 'tonto': o cartão vazio apagava a cor, que ainda serve pra deduzir. */
const WIND_MODE = 'tonto';
const ATTACK = { olhos: ['ceu'], chifre: ['chao'], azul: ['sol'], asas: ['vento'] };
function deathPhase() {
  if (!G || !G.dying) return null;
  if (Date.now() < G.deathT0) return 'wait';
  return [...G.deathState.values()].every(v => v === 'done' || v === 'dead') ? 'done' : 'scene';
}
/* troca só o cartão daquela vítima, pra não reiniciar a animação das outras */
function refreshCard(id) {
  const old = $('tree').querySelector('[data-id="' + CSS.escape(id) + '"]');
  if (!old) return;
  const nb = makeCard(C(id));
  nb.style.left = old.style.left; nb.style.top = old.style.top; nb.classList.remove('fresh');
  old.replaceWith(nb);
}
function scheduleDeath() {
  if (!G.dying || G.deathScheduled) return;
  G.deathScheduled = true;
  const me = G, E = G.curE, [kind] = ATTACK[E.id] || ['ceu'];
  const live = () => G === me;
  const setSt = (id, st) => { if (!live()) return; G.deathState.set(id, st); refreshCard(id); };
  const finish = () => { if (!live()) return; if (deathPhase() === 'done') { G.dying = null; renderBar(); renderToast(); renderTree(); } };
  /* susto, murchar e morrer; a ventania que leva embora troca o murchar pelo voo */
  const hitOne = id => {
    setSt(id, 'surprise');
    if (kind === 'vento' && WIND_MODE === 'leva') { setTimeout(() => setSt(id, 'blow'), 600); setTimeout(() => { setSt(id, 'done'); finish(); }, 1500); return; }
    if (kind === 'vento') { setTimeout(() => setSt(id, 'spin'), 500); setTimeout(() => setSt(id, 'wilt'), 1500); setTimeout(() => { setSt(id, 'done'); finish(); }, 2800); return; }
    setTimeout(() => setSt(id, 'wilt'), 850);
    setTimeout(() => { setSt(id, 'done'); finish(); }, 2150);
  };
  setTimeout(() => {
    if (!live()) return;
    renderBar(); renderToast();
    const canvas = $('tree').querySelector('.tree-canvas');
    const cardOf = id => $('tree').querySelector('[data-id="' + CSS.escape(id) + '"]');
    const ids = [...G.deathState.keys()].filter(cardOf).sort((a, b) => parseFloat(cardOf(a).style.left) - parseFloat(cardOf(b).style.left));
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!canvas || reduce) { ids.forEach(hitOne); return; }
    const box = id => { const c = cardOf(id); return { x: parseFloat(c.style.left), y: parseFloat(c.style.top), w: c.offsetWidth }; };
    const mk = (txt, cls) => { const e = document.createElement('span'); e.className = 'atk ' + (cls || ''); e.textContent = txt; e.setAttribute('aria-hidden', 'true'); canvas.append(e); return e; };
    if (kind === 'chao' || kind === 'ceu') {
      /* um ataque por vítima, com pouco intervalo entre eles; no chão é um arco liso, do céu é um mergulho */
      ids.forEach((id, i) => setTimeout(() => {
        if (!live()) return;
        const b = box(id), x = b.x + b.w / 2 - 15, y = b.y - 6;
        const wrap = mk('', 'atk-x'), e = document.createElement('span'); e.className = 'atk-e'; e.append(bichoCv(E.id)); wrap.append(e);
        if (kind === 'chao') {
          wrap.animate([{ transform: 'translateX(' + (x - 90) + 'px)' }, { transform: 'translateX(' + x + 'px)' }], { duration: 520, easing: 'linear', fill: 'forwards' });
          e.animate([{ transform: 'translateY(' + (y + 40) + 'px)', easing: 'ease-out' }, { transform: 'translateY(' + (y - 40) + 'px)', easing: 'ease-in' }, { transform: 'translateY(' + y + 'px)' }], { duration: 520, fill: 'forwards' });
        } else {
          wrap.animate([{ transform: 'translateX(' + (x - 60) + 'px)' }, { transform: 'translateX(' + x + 'px)' }], { duration: 480, easing: 'linear', fill: 'forwards' });
          e.animate([{ transform: 'translateY(' + (y - 90) + 'px) rotate(25deg)' }, { transform: 'translateY(' + y + 'px) rotate(55deg)' }], { duration: 480, easing: 'ease-in', fill: 'forwards' });
        }
        setTimeout(() => {
          if (!live()) return;
          hitOne(id);
          wrap.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }).finished.then(() => wrap.remove());
        }, kind === 'chao' ? 520 : 480);
      }, 250 + i * 320));
    } else if (kind === 'sol') {
      const ys = ids.map(id => box(id).y), xs = ids.map(id => box(id).x + box(id).w / 2);
      const sun = mk('', 'atk-sol'); sun.append(bichoCv('azul'));
      const sx = xs.reduce((a, b) => a + b, 0) / xs.length - 22, sy = Math.min(...ys) - 60;
      sun.animate([{ transform: 'translate(' + sx + 'px, ' + (sy - 20) + 'px) scale(0.3)', opacity: 0 }, { transform: 'translate(' + sx + 'px, ' + sy + 'px) scale(1.25)', opacity: 1 }, { transform: 'translate(' + sx + 'px, ' + sy + 'px) scale(1)', opacity: 1 }], { duration: 800, fill: 'forwards' });
      setTimeout(() => { if (!live()) return; ids.forEach(hitOne); }, 800);
      setTimeout(() => sun.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' }).finished.then(() => sun.remove()), 2000);
    } else {
      /* ventania: só riscos de vento atravessando a altura de cada vítima */
      const W = canvas.offsetWidth;
      ids.forEach(id => { const b = box(id); for (let k = 0; k < 3; k++) { const w = mk('', 'atk-vento'); w.style.top = (b.y + 12 + k * 18) + 'px'; w.animate([{ transform: 'translateX(-60px)', opacity: 0.9 }, { transform: 'translateX(' + W + 'px)', opacity: 0 }], { duration: 1000, delay: k * 120, fill: 'forwards' }).finished.then(() => w.remove()); } });
      setTimeout(() => { if (!live()) return; ids.forEach(hitOne); }, 450);
    }
  }, Math.max(0, G.deathT0 - Date.now()));
}
function renderToast() {
  const ph = deathPhase(), el = $('toast');
  const on = ph === 'scene';
  el.hidden = !on;
  if (on) el.replaceChildren(bichoCv(G.curE.id), document.createTextNode(tr('hit_' + G.curE.id)));
}
function renderBar() {

  const btn = $('btn-cross'), msg = $('msg');
  $('btn-giveup').hidden = G.status !== 'playing' || !!G.autoplay || G.mode === 'camp'; /* na campanha não se vê a resposta: a fase se repete até as três estrelas */
  const dph = deathPhase();
  if (dph && dph !== 'done') { btn.disabled = true; btn.textContent = tr('cross'); msg.textContent = dph === 'wait' ? tr('m_hatch') : ''; return; }
  if (G.autoplay && G.status === 'playing') { btn.disabled = true; btn.textContent = tr('cross'); msg.textContent = tr('m_auto', { a: Math.max(1, G.autoStep), b: G.P.path.length }); return; }
  if (G.status !== 'playing') { btn.disabled = true; btn.textContent = tr('cross'); msg.textContent = G.holdEnd ? (G.gaveup ? tr('m_auto_end') : tr('m_hatch')) : (G.status === 'won' ? tr('m_won') : tr(G.reason)) + tr('m_below'); return; }
  if (G.sel.length < 2) {

    msg.textContent = G.sel.length ? tr('m_pick', { x: lab(G.sel[0]) }) : tr('msg_start');
    return;
  }
  const [a, b] = G.sel;
  const pk = pairKey(C(a), C(b));
  const done = G.crosses.some(c => pairKey(C(c.a), C(c.b)) === pk);
  btn.textContent = tr('cross_ab', { a: lab(a), b: lab(b) });
  btn.disabled = done;
  msg.textContent = done ? tr('m_done') : tr('m_left', { n: G.V.max - G.crosses.length });
}

function toggle(id) {
  if (G.autoplay) return;
  const ph = deathPhase(); if (ph && ph !== 'done') return;
  G.focus = id;
  G.parentHop = new Set((C(id) && C(id).parents) || []);
  if (G.status !== 'playing' || !canBreed(id)) {
    G.sel = G.sel.filter(s => s !== id);
    render();
    G.parentHop = null;
    if (G.status === 'playing') $('msg').textContent = G.dead.has(id) ? tr('m_dead', { x: lab(id) }) : tr('m_tired', { x: lab(id), n: AGE_LIMIT });
    return;
  }
  const i = G.sel.indexOf(id);
  if (i >= 0) G.sel.splice(i, 1);
  else { if (G.sel.length === 2) G.sel.shift(); G.sel.push(id); G.justPicked = id; }
  render();
  G.justPicked = null;
  G.parentHop = null;
}

function animateCross(a, b) {
  const before = new Set(fresh);
  doCross(a, b, false);
  G.sel = [];
  const born = [...fresh].filter(id => !before.has(id));
  const last = G.crosses[G.crosses.length - 1];
  const winIdx = last.kids.findIndex(id => match(G.V, C(id).p, G.P.target));
  G.holdEnd = G.status !== 'playing';
  render();
  scheduleDeath();
  /* rola até a ninhada nova antes de ela começar a nascer */
  const first = born.length && $('tree').querySelector('[data-id="' + CSS.escape(born[0]) + '"]');
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
  if (G.holdEnd) {
    const waitIdx = G.status === 'won' && winIdx >= 0 ? birthIdx(C(last.kids[winIdx])) : 3;
    const wait = (KID_START + waitIdx * KID_GAP + KID_GROW) * 1000 + (G.status === 'won' ? 1400 : G.gaveup ? 500 : 2600); /* na derrota, espera a última ninhada murchar */
    setTimeout(() => {
      G.holdEnd = false;

}

/* Ver resposta: recomeça o tabuleiro e joga sozinho a sequência mais curta, com a animação normal. */
function showAnswer() {
  if (G.mode === 'daily') {
    const st = load(STATS) || { days: {} };
    if (!st.days[G.seedStr]) { st.days[G.seedStr] = { won: false, n: G.crosses.length }; store(STATS, st); track('end', 'gaveup'); }
  }
  newGame(G.mode, G.V, G.seedStr, G.info, null, G.mods, G.listed);
  G.gaveup = true;
  G.autoplay = true;
  G.autoStep = 0;
  save();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  const path = G.P.path;
  const step = () => {
    if (!G.autoplay || G.autoStep >= path.length) return;
    const [a, b] = path[G.autoStep];
    G.autoStep++;
    animateCross(a, b);
    if (G.autoStep < path.length) setTimeout(step, LITTER_MS + 700 + (G.dying ? 5200 : 0));
  };
  setTimeout(step, 900);
}

function showShortest() {
  const listed = G.listed;

    crosses: G.crosses.map(c => [c.a, c.b]), marks: G.marks, reveal: G.reveal, share: shareText(), won: G.status === 'won' };
  newGame(mine.mode, mine.V, mine.seedStr, mine.info, null, mine.mods, listed);
  G.replay = mine;
  G.autoplay = true;
  G.autoStep = 0;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  const path = G.P.path, me = G;
  const step = () => {
    if (G !== me || !G.autoplay || G.autoStep >= path.length) return;
    const [a, b] = path[G.autoStep];

    animateCross(a, b);
    if (G.autoStep < path.length) setTimeout(step, LITTER_MS + 700 + (G.dying ? 5200 : 0));

/* a abertura do capítulo aparece sempre que se entra na fase 1: desenho e duas frases, como as lições do roxo e do transparente */
function campIntro(L) {
  const P = L.phases[G.info.ph - 1];
  if (P.intro) return phaseIntro(P.intro);
  if (G.info.ph !== 1) return;
  const sl = (cor, extra, ...g) => ({ p: Object.assign({ cor, chifre: true, olhos: 2 }, extra || {}), g });
  const body = [];
  const par = k => { const e = document.createElement('p'); e.append(...withTags(tr(k))); return e; };
  if (L.lesson) L.lesson.forEach(k => {
    if (L.lesson.length > 1) { const h = document.createElement('h3'); h.className = 'help-sub'; h.textContent = tr('les_' + k + '_t'); body.push(h); }
    body.push(...lessonBody(k, L.V));
  });
  else {
    const rows = {
      0: [lessonRow([sl('vermelho', { chifre: false }, 'Vv'), '×', sl('vermelho', { chifre: false }, 'Vv'), '→', sl('vermelho', { chifre: false }, 'VV'), sl('vermelho', { chifre: false }, 'Vv'), sl('vermelho', { chifre: false }, 'Vv'), sl('azul', { chifre: false }, 'vv')])],
      1: [lessonRow([sl('vermelho', { chifre: false }, 'VV', 'cc'), '×', sl('azul', null, 'vv', 'CC'), '→', sl('vermelho', null, 'Vv', 'Cc')])],
      2: [lessonRow([sl('vermelho', null, 'EE'), '×', sl('vermelho', { olhos: 1 }, 'ee'), '→', sl('vermelho', null, 'Ee')])],
      3: [lessonRow([sl('vermelho', null, 'Cc'), '×', sl('vermelho', null, 'Cc'), '→', sl('vermelho', null, 'CC'), sl('vermelho', null, 'Cc'), sl('vermelho', null, 'Cc'), sl('vermelho', { chifre: false }, 'cc')])],
      4: [lessonRow([sl('azul', null, '2×'), sl('vermelho', null, '2×'), sl('vermelho', { olhos: 1 }, '2×')])],
      5: [lessonRow([{ bicho: 'olhos' }, '→', sl('vermelho', { olhos: 1, morto: true })])],
      12: [lessonRow([sl('roxo', null, 'Vv'), sl('transparente', null, 'tt'), sl('vermelho', { asas: true }, 'aa')]), 'p2', lessonRow([{ bicho: 'olhos' }, { bicho: 'chifre' }, { bicho: 'azul' }, { bicho: 'asas' }])],
      9: [lessonRow([sl('vermelho', null, 'VV'), sl('roxo', null, 'Vv'), sl('azul', null, 'vv')]), 'p2', lessonRow([sl('transparente', null, 'tt', 'Vv')])],
      6: [lessonRow([{ bicho: 'chifre' }, '→', sl('vermelho', { chifre: false, morto: true }), { bicho: 'azul' }, '→', sl('azul', { morto: true })])],
      10: [lessonRow([sl('vermelho', { asas: true }, 'aa'), '×', sl('vermelho', null, 'AA'), '→', sl('vermelho', null, 'Aa')])],
      11: [lessonRow([{ bicho: 'olhos' }, { bicho: 'chifre' }, { bicho: 'azul' }, { bicho: 'asas' }])],
    };
    const r = rows[L.id] || [];
    /* 'p2' marca onde entra a segunda frase quando o desenho vem em duas partes */
    if (r.includes('p2')) body.push(par('ch_' + L.id + '_1'), ...r.map(x => (x === 'p2' ? par('ch_' + L.id + '_2') : x)));
    else body.push(par('ch_' + L.id + '_1'), ...r, par('ch_' + L.id + '_2'));
  }
  $('lesson-title').replaceChildren(...chName(L.id));
  $('lesson-body').replaceChildren(...body);
  lessonTodo = []; lessonAfter = null;
  const dl = $('lesson'); if (dl.showModal) dl.showModal(); else dl.setAttribute('open', '');
}
/* parabéns de terminar a campanha, e de terminar o capítulo escondido */

/* balão próprio de uma fase que traz coisa nova no meio do capítulo (a ventania na fase 3 de Asas e vento) */

    const fig = document.createElement('div'); fig.className = 'lesson-fig';
    const cv = slimeCv(x.p); cv.className = 'sprite'; if (!x.p.morto) ownBob(cv, 'licao:' + i + JSON.stringify(x)); else cv.style.animation = 'none';
    const gs = document.createElement('div'); gs.className = 'gs'; gs.append(...x.g.map(geneTag));
    fig.append(cv, gs); r.append(fig);
  });
  return r;
}

function startTrain(vid) {
  const mods = { aging: $('mod-aging').checked, threat: $('mod-threat').checked, hard: $('mod-hard').checked };

  const V = VARIANTS[vid] || VARIANTS.classico;

let targetVisible = true;
try {
  /* o topo preso aparece quando metade do desenho do alvo já saiu por cima, e não só quando o quadro inteiro já saiu
     (antes havia um trecho da rolagem sem alvo nenhum na tela); cortado embaixo não conta */
  new IntersectionObserver(es => { const e = es[es.length - 1]; targetVisible = e.intersectionRatio >= 0.5 || e.boundingClientRect.top >= 0; updatePin(); }, { threshold: [0, 0.5] }).observe($('target-cv'));
} catch (e) { /* sem observador: o topo preso não aparece */ }
function updatePin() { $('pinbar').hidden = targetVisible || $('view-game').hidden; }
function show(view) {
  ['home', 'tut', 'game', 'sobre', 'arch', 'modes', 'camp'].forEach(v => { $('view-' + v).hidden = v !== view; });
  if (view === 'camp') renderCamp();
  if (view === 'sobre') renderSobre();
  if (view === 'arch') renderArch();
  if (view === 'modes') renderModes();
  window.scrollTo({ top: 0 });
  updatePin();
  if (view === 'home') renderHome();
}
function renderHome() {
  drawSlime($('home-cv'), { cor: 'vermelho', chifre: true, olhos: 2 });
  const t = today();
  const st = load(STATS) || { days: {} };
  const rec = st.days[t.key];
  const sv = load(SAVE + t.key);
  $('daily-status').textContent = rec ? (rec.won ? tr('h_won', { n: t.n, m: rec.n }) : tr('h_lost', { n: t.n }))
    : sv && sv.crosses && sv.crosses.length ? tr('h_going', { n: t.n }) : tr('h_new', { n: t.n });
  homeDay = t.key;
  const S = statsSummary(), bits = [];
  if (S.current > 0) { const sp = document.createElement('span'); sp.textContent = tr(S.current === 1 ? 'h_streak1' : 'h_streak', { n: S.current }); bits.push(sp); }
  if (rec) { if (bits.length) bits.push(' · '); const sp = document.createElement('span'); sp.dataset.next = '1'; sp.textContent = nextText(); bits.push(sp); }
  $('daily-next').replaceChildren(...bits);
  $('daily-next').hidden = !bits.length;
  const ct = campTotal();
  $('camp-status').textContent = ct ? tr('camp_total', { n: ct, t: campMax() }) : tr('camp_sub');
  $('tut-badge').hidden = !!load('slime-tut-feito');
}

/* ---------- tutorial: seis passos, do experimento do Mendel até uma partida guiada ---------- */
function tsl(cor, chifre) { return { cor: cor.split(''), chifre: chifre ? chifre.split('') : null }; }
function tPhen(s) { return { cor: s.cor.includes('V') ? 'vermelho' : 'azul', chifre: s.chifre ? s.chifre.includes('C') : false, olhos: 2 }; }
function tKids(a, b) {
  const pun = (x, y) => [[x[0], y[0]], [x[0], y[1]], [x[1], y[0]], [x[1], y[1]]];
  const pc = pun(a.cor, b.cor);
  const ph = a.chifre && b.chifre ? pun(a.chifre, b.chifre) : null;
  return [0, 1, 2, 3].map(k => ({ cor: pc[k], chifre: ph ? ph[k] : null }));
}
const TGENES = [
  { k: 'cor', dom: 'vermelho', rec: 'azul', has: s => s.cor.includes('V') },
  { k: 'chifre', dom: 'com chifre', rec: 'sem chifre', has: s => s.chifre.includes('C') },
];

const TSTEPS = [
  { passo: 1, kind: 'cross', text: 't1_text', parents: [tsl('VV'), tsl('vv')], say: 't1_say' },
  { passo: 1, kind: 'cross', text: 'tp_text', parents: [tsl('Vv'), tsl('vv')], say: 'tp_say' },
  { passo: 2, kind: 'cross', text: 't2_text', parents: [tsl('Vv'), tsl('Vv')], say: 't2_say' },
  { passo: 3, kind: 'quiz', text: 't3_text', parents: [tsl('Vv'), tsl('vv')], answer: true, explain: 't3_explain' },
  { passo: 3, kind: 'quiz', text: 't4_text', parents: [tsl('VV'), tsl('vv')], answer: false, explain: 't4_explain' },
  { passo: 4, kind: 'cross', text: 't5_text', parents: [tsl('vv', 'CC'), tsl('VV', 'cc')], say: 't5_say' },
  { passo: 4, kind: 'cross', text: 't6_text', parents: [tsl('Vv', 'Cc'), tsl('Vv', 'Cc')], say: 't6_say' },
  { passo: 4, kind: 'mix', text: 'tm_text', parents: [tsl('Vv', 'Cc'), tsl('Vv', 'Cc')] },
]
const TUT_TOTAL = 4;
let tutStep = 0, tutDone = false, tutAnswer = null, tutMix = null, tutMoved = null;

function chipFor(x, hide) {
  const e = document.createElement('span');
  if (hide) { e.className = 'copy unk'; e.textContent = '?'; return e; }
  e.className = 'copy ' + ({ V: 'red', v: 'blue', C: 'horn', c: 'nohorn' }[x]);
  e.textContent = x;
  return e;
}
function tutCard(sl, o) {
  o = o || {};
  const c = document.createElement(o.button ? 'button' : 'div');
  if (o.button) c.type = 'button';
  c.className = 'tut-card' + (o.picked ? ' picked' : '') + (o.hit ? ' hit' : '');
  c.append(sprite(tPhen(sl)));
  if (o.label) { const l = document.createElement('span'); l.className = 'tut-lab'; l.textContent = o.label; c.append(l); }
  [sl.cor, sl.chifre].filter(Boolean).forEach(pair => {
    const cp = document.createElement('div'); cp.className = 'copies';
    pair.slice().sort().forEach(x => cp.append(chipFor(x, o.hide)));
    c.append(cp);
  });
  return c;
}
function tEl(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function tBtn(text, primary, fn) { const b = tEl('button', 'btn' + (primary ? ' primary' : ''), text); b.type = 'button'; b.addEventListener('click', fn); return b; }
function tNext() { tutStep++; tutDone = false; tutAnswer = null; tutMix = null; tutMoved = null; renderTut(); window.scrollTo({ top: 0 }); }
function parentsRow(S, hideFirst) {
  const row = tEl('div', 'tut-row');
  row.append(tutCard(S.parents[0], { picked: true, hide: hideFirst }), tEl('span', 'tut-x', '×'), tutCard(S.parents[1], { picked: true }));
  return row;
}
function kidsRow(kids, hide, animate) {
  const row = tEl('div', 'tut-row' + (animate ? ' tut-kids' : ''));
  kids.forEach((k, i) => { const c = tutCard(k, { hide }); c.style.animationDelay = (i * 0.5) + 's'; row.append(c); });
  return row;
}

function startTutorial() { tutStep = 0; tutDone = false; tutAnswer = null; tutMix = null; tutMoved = null; renderTut(); }

function renderTut() {
  const S = TSTEPS[tutStep];
  const parts = [tEl('div', 'tut-step-n', tr('step', { n: S.passo, m: TUT_TOTAL }))];
  if (S.kind === 'cross') {
    parts.push(tEl('p', 'tut-text', tr(S.text)), parentsRow(S, false));
    const act = tEl('div', 'tut-actions');
    if (!tutDone) act.append(tBtn(tr('cross'), true, () => { tutDone = true; renderTut(); }));
    else {
      parts.push(kidsRow(tKids(S.parents[0], S.parents[1]), false, true), tEl('p', 'tut-say', tr(S.say)));
      if (tutStep < TSTEPS.length - 1) act.append(tBtn(tr('next'), true, tNext));
      else {
        parts.push(tEl('p', 'tut-text', tr('tut_done')));
        act.append(tBtn(tr('play_daily'), true, () => { startDaily(); show('game'); }), tBtn(tr('back_home'), false, () => show('home')));
        store('slime-tut-feito', true);
      }
    }
    parts.push(act);
  } else if (S.kind === 'quiz') {
    parts.push(tEl('p', 'tut-text', tr(S.text)), parentsRow(S, tutAnswer === null), kidsRow(tKids(S.parents[0], S.parents[1]), tutAnswer === null, tutAnswer === null));
    const act = tEl('div', 'tut-actions');
    if (tutAnswer === null) {
      act.append(tBtn(tr('yes_hides'), true, () => { tutAnswer = true; renderTut(); }), tBtn(tr('no_hides'), false, () => { tutAnswer = false; renderTut(); }));
    } else {
      const ok = tutAnswer === S.answer;
      parts.push(tEl('p', 'tut-say' + (ok ? '' : ' wrong'), (ok ? tr('right') : tr('wrong')) + tr(S.explain)));
      act.append(tBtn(tr('next'), true, tNext));
    }
    parts.push(act);
  } else if (S.kind === 'mix') {
    parts.push(tEl('p', 'tut-text', tr(S.text)), parentsRow(S, false));
    /* começa na mesma ordem da ninhada do passo anterior; o botão troca só os chifres de lugar, pra ver a combinação mudar */
    if (!tutMix) tutMix = { cor: [0, 1, 2, 3], chifre: [0, 1, 2, 3] };
    const pun = (x, y) => [[x[0], y[0]], [x[0], y[1]], [x[1], y[0]], [x[1], y[1]]];
    const cells = { cor: pun(S.parents[0].cor, S.parents[1].cor), chifre: pun(S.parents[0].chifre, S.parents[1].chifre) };
    const kids = [0, 1, 2, 3].map(k => ({ cor: cells.cor[tutMix.cor[k]], chifre: cells.chifre[tutMix.chifre[k]] }));
    const grid = tEl('div', 'mix-grid');
    grid.append(tEl('span', 'mix-lab'), ...[1, 2, 3, 4].map(n => tEl('span', 'mix-num', String(n))));
    [['cor', tr('r_color')], ['chifre', tr('r_horn')]].forEach(([g, label]) => {
      grid.append(tEl('span', 'mix-lab', label));
      kids.forEach(kd => {
        const cell = tEl('div', 'mix-cell' + (tutMoved && tutMoved[g] ? ' moved' : ''));
        const cp = tEl('div', 'copies');
        kd[g].slice().sort().forEach(x => cp.append(chipFor(x)));
        cell.append(cp); grid.append(cell);
      });
    });
    grid.append(tEl('span', 'mix-lab'));
    let blueNoHorn = false;
    kids.forEach(kd => {
      const p = tPhen(kd);
      const hit = p.cor === 'azul' && !p.chifre;
      if (hit) blueNoHorn = true;
      const w = tEl('div', 'mix-slime' + (hit ? ' hit' : ''));
      w.append(sprite(p)); grid.append(w);
    });
    const say = tEl('div', 'tut-say');
    say.append(tEl('p', null, tr('tm_same')), tEl('p', null, tr(blueNoHorn ? 'tm_yes' : 'tm_no')), tEl('p', null, tr('tm_fixed')));
    /* o botão de trocar fica entre a tabela e o texto, em destaque: é a parte que a pessoa tem que fazer */
    const swap = tEl('div', 'tut-actions');
    swap.append(tBtn(tr('tm_shuffle'), true, () => {
      const shuf = cur => { let q; do { q = [0, 1, 2, 3]; for (let i = 3; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; } } while (q.join() === cur.join()); return q; };
      tutMix = { cor: tutMix.cor, chifre: shuf(tutMix.chifre) };
      tutMoved = { chifre: true };
      renderTut();
    }));
    parts.push(grid, swap, say);
    const act = tEl('div', 'tut-actions');
    if (tutStep < TSTEPS.length - 1) act.append(tBtn(tr('next'), true, tNext));
    else {
      parts.push(tEl('p', 'tut-text', tr('tut_done')));
      act.append(tBtn(tr('play_daily'), true, () => { startDaily(); show('game'); }), tBtn(tr('back_home'), false, () => show('home')));
      store('slime-tut-feito', true);
    }
    parts.push(act);
  }
  $('tut-body').replaceChildren(...parts);
}

$('z-in').addEventListener('click', () => setZoom((G.zoom || 1) * 1.25));
$('z-out').addEventListener('click', () => setZoom((G.zoom || 1) / 1.25));
$('z-fit').addEventListener('click', () => setZoom(fitZoom()));
(() => {
  const pts = new Map(); let start = null;
  const host = $('tree');
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  host.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) start = { d: dist(), z: G.zoom || 1 }; });
  host.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && start && start.d > 0) setZoom(start.z * dist() / start.d);
  });
  const end = e => { pts.delete(e.pointerId); if (pts.size < 2) start = null; };
  host.addEventListener('pointerup', end); host.addEventListener('pointercancel', end); host.addEventListener('pointerleave', end);
  /* impede que a pinça na árvore dê zoom na página inteira (o resultado e o resto ficam no tamanho normal) */
  host.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  let gz = 1;
  host.addEventListener('gesturestart', e => { e.preventDefault(); gz = G ? (G.zoom || 1) : 1; });
  host.addEventListener('gesturechange', e => { e.preventDefault(); if (!pts.size) setZoom(gz * e.scale); });
  host.addEventListener('gestureend', e => e.preventDefault());
})();

$('go-daily').addEventListener('click', () => { startDaily(); show('game'); });
$('go-tut').addEventListener('click', () => { startTutorial(); show('tut'); });
/* Sobre e sugestões */
const X_URL = 'https://x.com/SlimeCross';
$('go-sobre').addEventListener('click', () => show('sobre'));
$('sobre-home').addEventListener('click', () => show('home'));
function renderSobre() {
  drawSlime($('sobre-cv'), { cor: 'roxo', chifre: true, olhos: 2, asas: true, happy: true });
  $('sobre-x').hidden = !X_URL;
  if (X_URL) { $('sobre-x-link').href = X_URL; $('sobre-x-link').textContent = X_URL.replace(/^https?:\/\//, ''); }
  $('fb-status').textContent = ''; $('fb-status').className = 'fb-status';
}
$('fb').addEventListener('submit', async e => {
  e.preventDefault();
  const st = $('fb-status'), btn = $('fb-send');
  st.className = 'fb-status'; st.textContent = tr('fb_sending'); btn.disabled = true;
  try {
    const r = await fetch('/api/feedback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ msg: $('fb-msg').value, contact: $('fb-contact').value, lang: LANG, page: G ? G.mode + ':' + (G.V && G.V.id) : 'home' }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { st.className = 'fb-status ok'; st.textContent = tr('fb_ok'); $('fb-msg').value = ''; $('fb-contact').value = ''; }
    else { st.className = 'fb-status err'; st.textContent = tr('fb_err'); }
  } catch (err) { st.className = 'fb-status err'; st.textContent = tr('fb_err'); }
  btn.disabled = false;
});
$('go-more').addEventListener('click', () => show('modes'));
$('go-arch').addEventListener('click', () => show('arch'));
$('go-camp').addEventListener('click', () => show('camp'));
$('camp-home').addEventListener('click', () => show('home'));
$('arch-home').addEventListener('click', () => show('home'));
$('modes-home').addEventListener('click', () => show('home'));
$('btn-modes').addEventListener('click', () => show('modes'));
$('arch-n').addEventListener('click', () => { archHard = false; renderArch(); });
$('arch-h').addEventListener('click', () => { archHard = true; renderArch(); });
const goBack = () => show(G && G.mode === 'arch' ? 'arch' : G && G.mode === 'train' ? 'modes' : G && G.mode === 'camp' ? 'camp' : 'home');
$('btn-home').addEventListener('click', goBack);
/* o título do jogo volta junto com a setinha, como o "← Início" das outras telas */

ghMid.setAttribute('role', 'button'); ghMid.tabIndex = 0;
ghMid.addEventListener('click', goBack);
ghMid.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goBack(); } });
$('tut-home').addEventListener('click', () => show('home'));
$('btn-tut-again').addEventListener('click', () => { closeHelp(); startTutorial(); show('tut'); });
/* Instruções numa janela que abre no "?" do topo, pra a tela do jogo ficar só com o jogo */
function openHelp() { const d = $('help'); if (d.showModal) d.showModal(); else d.setAttribute('open', ''); }
function closeHelp() { const d = $('help'); if (d.close) d.close(); else d.removeAttribute('open'); }
$('btn-help').addEventListener('click', openHelp);
$('help-close').addEventListener('click', closeHelp);
$('help').addEventListener('click', e => {
  const r = $('help').getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeHelp();
});

function boot(data) {
  if (!IS_LIVE && /[?&]cenas/.test(location.search)) { setTimeout(() => { show('camp'); renderCenas(); }, 0); }
  initLang();
  fillVariantSelect();
  EASY = !!load('slime-easy');
  const sm = load('slime-mods') || {};
  $('mod-aging').checked = !!sm.aging; $('mod-threat').checked = !!sm.threat; $('mod-hard').checked = !!sm.hard;
  if (data && data.mode === 'train' && data.seedStr && VARIANTS[data.vid]) { newGame('train', VARIANTS[data.vid], data.seedStr, null, data, data.mods); show('game'); }
  else show('home');
}
boot({});
